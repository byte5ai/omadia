<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2738"/>
      <stop offset="1" stop-color="#061c2a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6fc8d6"/>
    </marker>
  </defs>
  <rect width="820" height="470" rx="16" fill="#03121d"/>

  <!-- Channels -->
  <text x="40" y="44" fill="#8fb3c0" font-size="12" letter-spacing="1.5">CHANNELS</text>
  <g font-size="13" fill="#e6f4f7" text-anchor="middle">
    <rect x="40" y="56" width="96" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/><text x="88" y="78">Web chat</text>
    <rect x="146" y="56" width="96" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/><text x="194" y="78">Teams</text>
    <rect x="252" y="56" width="96" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/><text x="300" y="78">Slack</text>
    <rect x="358" y="56" width="96" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/><text x="406" y="78">Telegram</text>
    <rect x="464" y="56" width="96" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/><text x="512" y="78">Discord</text>
    <rect x="570" y="56" width="96" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/><text x="618" y="78">WhatsApp</text>
  </g>

  <!-- Your infrastructure -->
  <rect x="24" y="112" width="600" height="338" rx="14" fill="none" stroke="#6fc8d6" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="40" y="136" fill="#6fc8d6" font-size="12" letter-spacing="1.5">YOUR INFRASTRUCTURE</text>

  <line x1="353" y1="92" x2="353" y2="150" stroke="#6fc8d6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="40" y="152" width="420" height="76" rx="10" fill="url(#surface)" stroke="#6fc8d6" stroke-opacity="0.7"/>
  <text x="60" y="180" fill="#ffffff" font-size="16" font-weight="600">Orchestrator</text>
  <text x="60" y="204" fill="#b9d6de" font-size="13">routes each turn to the right agent, dispatches tools,</text>
  <text x="60" y="221" fill="#b9d6de" font-size="13">streams the answer back</text>

  <!-- Verifier + Conductor -->
  <rect x="476" y="152" width="132" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/>
  <text x="542" y="174" fill="#e6f4f7" font-size="13" text-anchor="middle">Answer verifier</text>
  <rect x="476" y="194" width="132" height="34" rx="8" fill="url(#surface)" stroke="#1d4a5e"/>
  <text x="542" y="216" fill="#e6f4f7" font-size="13" text-anchor="middle">Conductor</text>

  <!-- Plugins -->
  <line x1="250" y1="230" x2="250" y2="262" stroke="#6fc8d6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="264" width="568" height="70" rx="10" fill="url(#surface)" stroke="#1d4a5e"/>
  <text x="60" y="292" fill="#ffffff" font-size="16" font-weight="600">Plugins</text>
  <text x="60" y="316" fill="#b9d6de" font-size="13">agents, tools, integrations, capability providers, behind one stable API</text>

  <!-- Data -->
  <line x1="250" y1="336" x2="250" y2="368" stroke="#6fc8d6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="370" width="180" height="62" rx="10" fill="url(#surface)" stroke="#1d4a5e"/>
    <text x="130" y="396" fill="#ffffff" font-weight="600">Knowledge graph</text>
    <text x="130" y="416" fill="#b9d6de">Postgres + pgvector</text>
    <rect x="234" y="370" width="180" height="62" rx="10" fill="url(#surface)" stroke="#1d4a5e"/>
    <text x="324" y="396" fill="#ffffff" font-weight="600">Vault</text>
    <text x="324" y="416" fill="#b9d6de">encrypted secrets</text>
    <rect x="428" y="370" width="180" height="62" rx="10" fill="url(#surface)" stroke="#1d4a5e"/>
    <text x="518" y="396" fill="#ffffff" font-weight="600">Receipts</text>
    <text x="518" y="416" fill="#b9d6de">hash-chained</text>
  </g>

  <!-- Privacy Shield boundary + LLM -->
  <rect x="632" y="152" width="20" height="182" rx="6" fill="#6fc8d6" fill-opacity="0.18" stroke="#6fc8d6"/>
  <text x="642" y="243" fill="#6fc8d6" font-size="12" font-weight="600" letter-spacing="1" text-anchor="middle" transform="rotate(-90 642 243)">PRIVACY SHIELD</text>
  <line x1="462" y1="190" x2="628" y2="190" stroke="#6fc8d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="656" y1="190" x2="682" y2="190" stroke="#6fc8d6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="684" y="152" width="116" height="182" rx="10" fill="url(#surface)" stroke="#1d4a5e"/>
  <text x="742" y="180" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">LLM</text>
  <g fill="#b9d6de" font-size="12.5" text-anchor="middle">
    <text x="742" y="208">Anthropic</text>
    <text x="742" y="230">OpenAI</text>
    <text x="742" y="252">Mistral</text>
    <text x="742" y="274">MiniMax</text>
    <text x="742" y="296">Ollama</text>
  </g>
  <text x="742" y="322" fill="#6fc8d6" font-size="11" text-anchor="middle">your key, your choice</text>
</svg>
