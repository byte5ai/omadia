# electron-builder configuration for the omadia desktop installer.
# Produces signed/notarizable installers for macOS and Windows from one config.
#
# Prerequisites for a *signed* build (unsigned builds work for local testing):
#   macOS:   CSC_LINK + CSC_KEY_PASSWORD (Developer ID cert) and
#            APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID for notarization.
#   Windows: CSC_LINK + CSC_KEY_PASSWORD (Authenticode cert), ideally an EV cert
#            to avoid SmartScreen warnings.
#
# The omadia runtime (middleware dist + node_modules, web-ui standalone) is shipped
# as unpacked extraResources so the kernel can be forked as a child process and so
# the WASM/native bits are not trapped inside the asar archive.

appId: ai.omadia.desktop
productName: omadia
copyright: Copyright © 2026 byte5 GmbH

directories:
  output: release
  buildResources: buildResources

# Icons are stated per target rather than left to electron-builder's convention
# scan (#888). Auto-detection silently falls back to Electron's own atom icon
# when a file is missing or renamed, which is exactly how three beta rounds
# shipped with the default icon; an explicit path fails the build instead.
# All of them are generated from `buildResources/icon.svg` by `npm run icons`.

# Only the compiled desktop app + its own node_modules go into the app bundle.
# The ~130MB Postgres engine ships via extraResources (staged to runtime/omadia-pg),
# so exclude its node_modules copy to avoid duplicating it inside the asar.
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/@embedded-postgres/**"
  - "!**/node_modules/embedded-postgres/**"

# The omadia stack lives outside the asar so child processes can execute it. These
# paths are produced by `scripts/stage-runtime.mjs` (run before electron-builder),
# which copies the built middleware + web-ui + the bundled Postgres engine here.
extraResources:
  - from: runtime/middleware
    to: omadia/middleware
  - from: runtime/web-ui
    to: omadia/web-ui
  - from: runtime/omadia-pg
    to: omadia-pg

asar: true

# Sign the native Mach-O binaries inside the staged middleware (extraResources)
# BEFORE the outer app is signed — electron-builder does not sign extraResources,
# and notarization rejects unsigned nested Mach-O. Fail-soft when unsigned.
afterPack: buildResources/afterPack.js

mac:
  category: public.app-category.developer-tools
  icon: buildResources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: buildResources/entitlements.mac.plist
  entitlementsInherit: buildResources/entitlements.mac.plist
  # Architecture is NOT pinned here — CI passes `--arm64` or `--x64` explicitly
  # and each arch is built on a runner of that architecture.
  #
  # It has to work that way: the omadia runtime ships as unpacked extraResources
  # (middleware node_modules with better-sqlite3/argon2/sharp, plus the embedded
  # Postgres engine), and extraResources are copied verbatim — they cannot be
  # arch-split within one bundle. Building x64 on an arm64 host would therefore
  # produce a DMG containing arm64 binaries that crashes on Intel.
  #
  # The old "Intel runners queue for hours" rationale is obsolete: macos-13 was
  # retired in December 2025 and `macos-26-intel` is a standard runner.
  # Note x86_64 support on GitHub Actions ends August 2027.
  target:
    - target: dmg
    - target: zip          # required by electron-updater on macOS
  # Always carry the arch in the filename — electron-builder omits it for x64 by
  # default, which would drop a nondescript `omadia-<version>.zip` next to the
  # arm64 one. This is the ZIP name (electron-updater's payload); the DMG name is
  # set under `dmg:` below. Both keep the existing arm64 filenames unchanged.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  # Notarization is left unset here so it's driven entirely by CI: the workflow
  # adds `--config.mac.notarize=true` only when the Apple secrets are present
  # (and electron-builder skips it without notary credentials). A hard-coded
  # `notarize: false` here would fight that CLI override.

dmg:
  # Target-level name wins over mac.artifactName, keeping the DMG exactly as it
  # was for arm64 (`omadia-<version>-arm64.dmg`) while x64 gets `-x64`.
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: buildResources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # signtool / azure-trusted-signing wired via CSC_* env in CI.

nsis:
  installerIcon: buildResources/icon.ico
  uninstallerIcon: buildResources/icon.ico
  installerHeaderIcon: buildResources/icon.ico
  oneClick: false
  perMachine: false        # per-user install → state in %APPDATA%, no admin prompt
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Development
  icon: buildResources/icon.png
  target:
    - target: AppImage      # portable, the true "one-click, no package manager" path
      arch: [x64]
    - target: deb
      arch: [x64]

publish:
  provider: github
  releaseType: release
