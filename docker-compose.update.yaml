# Optional overlay — operator-triggered rolling self-update (issue #432).
#
# Without this overlay omadia runs in NOTIFY-ONLY mode: Admin → Update still
# shows the running version and flags when a newer release exists, it just
# cannot apply one. That is the default on purpose — the ability to replace
# running containers requires Docker Engine access, which is host-root
# equivalent, and no self-host should acquire that by accident.
#
#   # one-time: compose reads the pinned tag from the project-root .env, and
#   # the updater writes it there, so the file must exist as a FILE before the
#   # bind mount is created (Docker would otherwise create a directory).
#   touch .env
#
#   # required: the shared secret between middleware and updater
#   echo "UPDATER_TOKEN=$(openssl rand -hex 24)" >> .env
#
#   docker compose -f docker-compose.yaml -f docker-compose.update.yaml up -d
#
# On Linux, set UPDATER_UID/UPDATER_GID in .env to your own uid/gid if it is
# not 1000 — the sidecar has to be able to write that .env file.
#
# Adds two services and one network: `docker-socket-proxy` and `updater`, and
# the internal `omadia-control` network that only those two join. Always pass
# both `-f` files: a plain `docker compose up -d` leaves an already running
# proxy and updater exactly as they were.

services:
  middleware:
    environment:
      # Presence of this URL is what flips the admin page from notify-only to
      # "Update"-capable. The token is the same secret the sidecar demands.
      OMADIA_UPDATER_URL: http://updater:8090
      OMADIA_UPDATER_TOKEN: ${UPDATER_TOKEN:?UPDATER_TOKEN must be set in the project-root .env}

  # --- Docker Engine API proxy ---------------------------------------------
  # The ONLY container with the socket mounted. Exposes a narrowed HTTP API to
  # the internal `omadia-control` network, which only the updater joins; the
  # updater talks to this, never to the socket.
  #
  # Trust model: whoever can reach this proxy owns the host. It has no
  # authentication, and CONTAINERS=1 + POST=1 is host-root-equivalent on its
  # own: every method under /containers is allowed, so `POST /containers/create`
  # takes `HostConfig.Privileged` and host `Binds`, and `/containers/{id}/archive`
  # reads and writes files in any container. VOLUMES=0 blocks the /volumes API,
  # not bind mounts; EXEC=0 blocks `/exec/{id}/start`, while
  # `POST /containers/{id}/exec` still creates exec instances. The flags below
  # therefore only shrink what a compromised updater can do. The boundary is
  # reachability: the proxy is on `omadia-control` alone, so middleware,
  # web-ui, postgres and every overlay sidecar on `omadia` can neither resolve
  # nor route to it (docs/security-architecture.md §10e). Never attach an
  # application service to `omadia-control`.
  #
  # Engine calls the updater makes — audit against this list before you change
  # a flag:
  #   GET    /containers/json               (find services by compose label)
  #   GET    /containers/{id}/json          (inspect, to rebuild the container)
  #   POST   /images/create                 (pull)
  #   POST   /containers/{id}/stop
  #   DELETE /containers/{id}
  #   POST   /containers/create
  #   POST   /containers/{id}/start
  #   POST   /networks/{id}/connect         (multi-network services only)
  #
  # Every section flag this image version knows is set below, on or off, so
  # that turning one on is a deliberate edit (the image itself defaults EVENTS,
  # PING and VERSION to 1). Re-audit the list whenever the image tag changes.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # --- on ---
      CONTAINERS: 1
      IMAGES: 1
      # Needed only when a service is on more than one network, but kept on:
      # recreate.mjs attaches the second and later networks AFTER stop +
      # remove, so a 403 here would strand a half-recreated middleware, and its
      # rollback, on any stack that put it on an extra (e.g. reverse-proxy)
      # network.
      NETWORKS: 1
      # Admits every non-GET method (POST, DELETE, PUT) on the sections above.
      POST: 1
      # Read-only liveness probe. The updater never calls it; it is kept for
      # the operator check in docs/upgrading.md.
      PING: 1
      # --- off ---
      # The ALLOW_* switches only add access when CONTAINERS=0. With
      # CONTAINERS=1 + POST=1, start/stop/restart are already allowed, so
      # these three change nothing here.
      ALLOW_RESTARTS: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      # On by image default; the updater does not subscribe to events.
      EVENTS: 0
      EXEC: 0
      GRPC: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      # On by image default; the updater never calls /version.
      VERSION: 0
      VOLUMES: 0
    volumes:
      # Read-only mount: the proxy only needs to read/write the socket stream,
      # and :ro prevents the socket file itself from being replaced.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No ports:, and not on `omadia`: the control network is the only way in.
    networks: [omadia-control]

  # --- Updater sidecar ------------------------------------------------------
  updater:
    # Published to GHCR by the same workflow (and on the same tag) as the
    # middleware it updates, so a self-hoster needs no source checkout.
    #
    # To run a locally built one instead, build it under the same name first:
    #   docker build -t ghcr.io/byte5ai/omadia-updater:latest \
    #     middleware/sidecars/updater
    # (deliberately NOT a `build:` section here: this service is also absent
    # from docker-compose.build.yaml, so that overlay cannot accidentally
    # start an updater on a stack that never opted into one.)
    #
    # The updater never replaces ITSELF (it is on the protected list — a
    # container cannot recreate the process doing the recreating), so after an
    # update it keeps running the old image until the operator's next
    # `docker compose up -d` picks up the new pin from .env.
    image: ghcr.io/byte5ai/omadia-updater:${OMADIA_VERSION:-latest}
    restart: unless-stopped
    # Must be able to write the project .env. Override in .env when the host
    # user is not uid 1000.
    user: '${UPDATER_UID:-1000}:${UPDATER_GID:-1000}'
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:?UPDATER_TOKEN must be set in the project-root .env}
      UPDATER_DOCKER_API: http://docker-socket-proxy:2375
      UPDATER_SERVICES: middleware,web-ui
      UPDATER_ENV_FILE: /workspace/.env
      UPDATER_HEALTH_URL: http://middleware:8080/health
    volumes:
      # Single-file bind mount of the compose project's .env — the updater
      # rewrites OMADIA_VERSION in place so the operator's next manual
      # `docker compose up -d` keeps the version they chose. `touch .env`
      # first; Docker creates a DIRECTORY for a missing bind source.
      - ./.env:/workspace/.env
    depends_on:
      - docker-socket-proxy
    # No ports: — the control plane is compose-network only and bearer-authed.
    # The only service on both networks: `omadia` so the middleware can reach
    # it (OMADIA_UPDATER_URL) and its health gate can reach the middleware
    # (UPDATER_HEALTH_URL); `omadia-control` for the Engine proxy
    # (UPDATER_DOCKER_API).
    networks: [omadia, omadia-control]
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Engine-control network: `docker-socket-proxy` and `updater`, nothing else.
  # Whatever joins it can drive the Docker Engine, so never attach an
  # application service to it. Three settings keep `omadia` out:
  #   - a separate bridge: Docker's DNS answers `docker-socket-proxy` only to
  #     containers on this network;
  #   - `internal: true`: no route off the host, nothing published;
  #   - `inhibit_ipv4`: the bridge gets no address on the host, so the host
  #     has no route into this subnet and cannot forward traffic to the proxy
  #     from another network. Stock Linux Docker already drops that traffic
  #     with firewall rules; some runtimes (OrbStack) forward it, which this
  #     setting stops. Accepted by every engine tested, 20.10 to 29.
  # IPv6 stays off explicitly, so a daemon-wide IPv6 default cannot open a
  # second path around `inhibit_ipv4`.
  omadia-control:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: 'true'
