schema_version: 1
id: minimal-dev
name: Minimal Dev
description: Orchestrator stack without the verifier. Embeddings are included because orchestrator-extras requires embeddingClient@^1. The memory and knowledge-graph backend follows DATABASE_URL and is set up at boot. Add channel plugins from the store after the profile applies.
plugins:
  - "@omadia/embeddings"
  - "@omadia/orchestrator-extras"
  - "@omadia/orchestrator"
