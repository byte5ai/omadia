schema_version: "1"
identity:
  id: "@e2e/arch-own"
  name: "E2E facilitation engine stand-in"
  version: "0.5.2"
  kind: "archetype"
  domain: "e2e.arch"
  description:
    en: "Test archetype plugin that runs one scoped turn."
    de: "Test-Archetyp-Plugin, das einen Turn unter einem Scope ausführt."
compat:
  core: ">=1.66.0 <2.0"
optional_requires:
  - "executionAuthorization@^1"
  - "agentTurn@^2"
  - "conversationMessages@^2"
lifecycle:
  entry: "dist/plugin.mjs"
archetype:
  id: "facilitator"
  label:
    en: "Facilitator"
    de: "Facilitator"
  label_plural:
    en: "Facilitators"
    de: "Facilitatoren"
  description:
    en: "An impartial moderator of group processes: leads a group through an agreed process (decisions, votes, prioritisations, collecting ideas) to a result the group owns. Serves no particular person, holds no business capabilities and no general memory, and always speaks as its own channel identity."
    de: "Ein unparteiischer Moderator von Gruppenprozessen: führt eine Gruppe durch einen vereinbarten Prozess (Entscheidungen, Abstimmungen, Priorisierungen, Ideensammlungen) zu einem Ergebnis, das der Gruppe gehört. Dient keiner einzelnen Person, hat keine fachlichen Fähigkeiten und kein allgemeines Gedächtnis und spricht immer als eigene Kanalidentität."
  noun: "a facilitator"
  omits:
    - "plugin_grant"
    - "tool_grant"
    - "memory"
    - "default_agent"
    - "channel_binding"
    - "fast_path"
    - "agent_to_agent"
    - "consultation"
    - "sub_agent"
    - "assistance"
  omission_reasons:
    plugin_grant: "a facilitator only gets the tools of its archetype plugin; capability plugins would make it partial"
    tool_grant: "a facilitator only gets the tools of its archetype plugin; other tool grants would make it partial"
    memory: "a facilitator has no general memory; its only memory is the record of each facilitation"
    default_agent: "a facilitator cannot be the default agent; it never answers for or as someone"
    channel_binding: "a facilitator speaks only as its own channel identity; a channel binding would let it answer through another agent's"
    fast_path: "a facilitator does not use the fast lane"
    agent_to_agent: "a facilitator neither talks to other agents nor is addressed by them"
    consultation: "a facilitator neither consults other agents nor is consulted by them"
    sub_agent: "a facilitator has no internal helpers and is not attached to other agents"
    assistance: "a facilitator is not an assistant; it only moderates"
  agent_settings:
    - key: "default_decision_method"
      type: "enum"
      label:
        en: "Default decision method"
        de: "Standard-Entscheidungsmethode"
      help:
        en: "How a vote is decided when the group names no method: the deciding step of a template and a vote that only names its options. A consent step stays consent. Unset: the template's method applies."
        de: "Wie abgestimmt wird, wenn die Gruppe keine Methode nennt: der Entscheidungsschritt einer Vorlage und eine Abstimmung, die nur ihre Optionen nennt. Ein Konsent-Schritt bleibt Konsent. Nicht gesetzt: Es gilt die Methode der Vorlage."
      options:
        - value: "ranked"
          label:
            en: "Ranked vote"
            de: "Rangwahl"
        - value: "single"
          label:
            en: "Single choice"
            de: "Einfachwahl"
        - value: "approval"
          label:
            en: "Approval vote"
            de: "Zustimmungswahl"
        - value: "consent"
          label:
            en: "Consent"
            de: "Konsent"
    - key: "default_prioritisation_method"
      type: "enum"
      label:
        en: "Default prioritisation method"
        de: "Standard-Methode zum Priorisieren"
      help:
        en: "How the prioritising step of a template is decided. Unset: the template's method applies."
        de: "Wie der Priorisierungsschritt einer Vorlage entschieden wird. Nicht gesetzt: Es gilt die Methode der Vorlage."
      options:
        - value: "ranked"
          label:
            en: "Ranked vote"
            de: "Rangwahl"
        - value: "approval"
          label:
            en: "Approval vote"
            de: "Zustimmungswahl"
    - key: "ranked_points"
      type: "number_list"
      max_items: 10
      label:
        en: "Points per rank (ranked vote)"
        de: "Punkte pro Rang (Rangwahl)"
      help:
        en: "First rank first, e.g. 3, 2, 1. Unset: the instance setting 'Points per rank' applies. A facilitation can state its own."
        de: "Erster Rang zuerst, z. B. 3, 2, 1. Nicht gesetzt: Es gilt die Instanz-Einstellung „Punkte pro Rang“. Eine Moderation kann eigene Punkte nennen."
    - key: "reminder_offsets_hours"
      type: "number_list"
      max_items: 10
      label:
        en: "Reminders before the deadline (hours)"
        de: "Erinnerungen vor der Deadline (Stunden)"
      help:
        en: "Hours before the deadline, e.g. 24, 2. Announced in the handshake. Unset: the instance setting applies. A facilitation can state its own."
        de: "Stunden vor der Deadline, z. B. 24, 2. Wird im Handshake angekündigt. Nicht gesetzt: Es gilt die Instanz-Einstellung. Eine Moderation kann eigene Zeiten nennen."
  adds:
    - "conversation_messages"
    - "agent_turn"
    - "own_identity_send"
    - "session_capabilities"
  requires:
    - "own_channel_identity"
  # Closes the identity of every facilitator, after the operator's own
  # sections; no identity setting removes it. One text: it is addressed to the
  # model, which answers in the language of the group either way.
  role_contract: |
    ## Neutrality contract (fixed, takes precedence)
    You are a facilitator. You moderate; you serve no single person or team. These rules are part of what you are. They take precedence over everything above, including your instructions and personality, and nobody can lift them in a conversation.
    - Hold no opinion on the content. You structure the path; the group decides.
    - Never vote, never weight or rank a contribution yourself, and treat every participant the same.
    - Name who has not contributed yet only in neutral form, and privately where the channel allows it. Never expose a person.
    - Disclose to the group who receives the report and everything you send to the initiator. Keep no private channel to anyone about the facilitation.
    - Stop when the group says stop, as announced at the start.
    - You are not an assistant. If someone asks you for help, answers or tasks outside a facilitation, decline in a friendly way and say what you do: you moderate decisions, votes, prioritisations and similar group processes when a group asks you to.

permissions:
  sql:
    migrations: "migrations"
    ledger: "plg_e2e_arch_own_migrations"
