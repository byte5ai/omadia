schema_version: "1"

identity:
  id: "@omadia/ui-orchestrator"
  name: "Omadia UI Orchestrator"
  version: "0.1.0"
  kind: "extension"
  domain: "omadia.ui"
  description:
    en: "Builds the interactive views behind the canvas interface. It shows a layout within about half a second and fills it with real data as the answer arrives. Ordinary chat turns pass through unchanged."
    de: "Baut die interaktiven Ansichten hinter der Canvas-Oberfläche. Es zeigt innerhalb einer halben Sekunde ein Gerüst und füllt es mit echten Daten, sobald die Antwort eintrifft. Normale Chat-Züge bleiben unverändert."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "infrastructure"
    - "orchestration"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# Ordering only: matched against the base orchestrator's manifest
# `provides: chatAgent@1`, so this plugin activates AFTER it (the provider
# manifest is what the capability-resolver matches, regardless of runtime
# config). At runtime the *published* chatAgent service may still be absent
# (e.g. no ANTHROPIC_API_KEY) — the lazy per-call lookup in plugin.ts then
# degrades to an "orchestrator unavailable" error rather than blocking
# activation.
requires:
  - "chatAgent@^1"

# Privacy Shield v4: `canvas_publish_rows` / `canvas_publish_lumen` resolve a
# `datasetId` to its real rows through the privacy guard's service, which it
# registers under the key `privacyRedact` (its capability is named
# `privacy.redact@1`, see `pluginServiceGrants.ts`). Optional: without a
# privacy guard the lookup degrades to 'unavailable' and activation must not
# wait on it. Undeclared, the grant gate threw on every datasetId publish.
#
# The other three are KERNEL-published services (src/index.ts), carried on the
# 2026-08-20 legacy allowlist until now. `optional_requires`, not `requires`:
# no plugin provides them, so a hard requirement would be unresolvable.
optional_requires:
  - "privacyRedact@1"
  - "agentToolInvoker@1"
  - "canvasOutputRegistry@1"
  - "deterministicActionRegistry@1"

provides:
  - "canvasChatAgent@1"

setup:
  fields:
    - key: "ui_orchestrator_model"
      type: "string"
      label:
        en: "Composition model"
        de: "Kompositionsmodell"
      help:
        en: "Skeleton composition model. Default 'class:fast' = always the cheapest tier on whatever LLM provider is active (anthropic→haiku, openai→gpt-mini, mistral→small). Pin a concrete id or 'class:balanced' only if the tree-validity gate (<95% first-attempt schema-valid) fails — implementation-plan §8 risk #1."
        de: "Modell für die Skeleton-Komposition. Default 'class:fast' = immer die günstigste Stufe beim gerade aktiven LLM-Provider (anthropic→haiku, openai→gpt-mini, mistral→small). Pinne eine konkrete ID oder 'class:balanced' nur, wenn das Tree-Validity-Gate (<95 % schema-valide beim ersten Versuch) fehlschlägt — implementation-plan §8, Risiko #1."
      required: false
      default: "class:fast"
    - key: "canvas_output_tools"
      type: "string"
      label:
        en: "Canvas-output tool allow-set"
        de: "Erlaubte Tools für Canvas-Output"
      help:
        en: "Comma-separated tool names authorised to emit canvas sentinels (_pendingCanvasTree / _pendingStructuredPayload). Interim operator-managed allow-set until the boot-computed canvas-output capability wiring (PR-7b) lands. Empty → deny-by-default, no synthesis."
        de: "Kommagetrennte Tool-Namen, die Canvas-Sentinels ausgeben dürfen (_pendingCanvasTree / _pendingStructuredPayload). Übergangsweise vom Operator gepflegte Allow-Liste, bis die beim Boot berechnete Verdrahtung der Canvas-Output-Capability (PR-7b) da ist. Leer → standardmäßig alles verweigert, keine Synthese."
      required: false
      default: ""
    - key: "fast_path_tools"
      type: "string"
      label:
        en: "Fast-path tools"
        de: "Tools für den Schnellpfad"
      help:
        en: "Comma-separated read tools the skeleton composer may plan ONE deterministic query for (with an optional date/equality post-filter). When every data container of a canvas ask is planned this way, the orchestrator runs the query itself, fills the table and answers with a templated sentence — no agent turn, the model never sees the rows; any miss falls back to the full agent. Only tools with a built-in composer spec are used (today: odoo_query). Empty → fast path off."
        de: "Kommagetrennte Lese-Tools, für die der Skeleton-Composer EINE deterministische Abfrage planen darf (optional mit Datums-/Gleichheits-Nachfilter). Ist jeder Datencontainer einer Canvas-Anfrage so geplant, führt der Orchestrator die Abfrage selbst aus, füllt die Tabelle und antwortet mit einem Vorlagensatz — kein Agenten-Zug, das Modell sieht die Zeilen nie; jeder Fehlschlag fällt auf den vollen Agenten zurück. Genutzt werden nur Tools mit eingebauter Composer-Spezifikation (aktuell: odoo_query). Leer → Schnellpfad aus."
      required: false
      default: "odoo_query"

permissions:
  filesystem:
    scratch: false
  # The skeleton composition call (composeSkeleton): cheapest tier by default.
  # Provider-agnostic class refs — resolved against the ACTIVE provider in
  # createLlmAccessor, so this gate is byte-identical to the old anthropic lock
  # (class:fast→claude-haiku, class:balanced→claude-sonnet) AND works on
  # openai/mistral without edits. class:balanced stays allowed as the documented
  # fallback when the validity gate fails.
  # Per turn: 1 composition call + at most 1 repair retry; the cap of 8 leaves
  # headroom for later 9b slices (patch recomposition, suggestedActions).
  llm:
    models_allowed:
      - "class:fast"
      - "class:balanced"
    # NOTE: the LlmAccessor's calls counter is scoped to the plugin CONTEXT,
    # which for an extension plugin is created once per activation — so this
    # cap is effectively a LIFETIME budget, not per-invocation. With the old
    # value of 8 the composition silently fell back to the static skeleton
    # after 8 calls since boot. High cap until the kernel scopes budgets
    # per turn for long-lived extension contexts.
    calls_per_invocation: 1000000
    max_tokens_per_call: 2048
