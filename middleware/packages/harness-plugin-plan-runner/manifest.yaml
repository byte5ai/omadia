schema_version: "1"

identity:
  id: "@omadia/plugin-plan-runner"
  name: "Plan Runner"
  version: "0.2.0"
  kind: "extension"
  domain: "orchestrator.plan-runner"
  description:
    en: "Writes down a plan for a task with several steps and tracks progress against those named steps, instead of trusting the model to remember them. A cheap check keeps it out of the way on simple questions."
    de: "Schreibt für eine Aufgabe mit mehreren Schritten einen Plan auf und verfolgt den Fortschritt anhand dieser benannten Schritte, statt sich darauf zu verlassen, dass das Modell sie behält. Eine günstige Vorprüfung hält es bei einfachen Fragen heraus."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "orchestration"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

setup:
  fields:
    - key: "enabled"
      type: "enum"
      label:
        en: "Plan-as-data (experimental)"
        de: "Plan-as-data (experimentell)"
      help:
        en: "When enabled, the plugin materializes an explicit plan DAG (Plan + PlanStep nodes in the knowledge graph) on multi-step turns. Simple Q&A stays untouched (a cheap Haiku gate decides per turn). Default: on."
        de: "Wenn aktiviert, materialisiert das Plugin auf mehrstufigen Turns einen expliziten Plan-DAG (Plan + PlanStep-Knoten im Knowledge-Graph). Einfache Q&A bleiben unberührt (ein billiger Haiku-Gate entscheidet pro Turn). Standard: on."
      required: false
      default: "on"
      enum:
        - value: "off"
          label:
            en: "Off — no plan materialization"
            de: "Off — keine Plan-Materialisierung"
        - value: "on"
          label:
            en: "On — materialize a plan DAG on multi-step turns"
            de: "On — Plan-DAG auf mehrstufigen Turns materialisieren"
    - key: "verifyExitConditions"
      type: "enum"
      label:
        en: "Check exit conditions (E4b, experimental)"
        de: "Exit-Conditions prüfen (E4b, experimentell)"
      help:
        en: "When enabled, a Haiku call checks after each tool whether the result meets the current step's exit condition; if not, the rest of the plan is replanned. Costs one extra Haiku call per completed step with an exit condition (turn hot path) — hence deliberately opt-in. Only applies when the plan runner is active (enabled=on). Default: off."
        de: "Wenn aktiviert, prüft ein Haiku-Aufruf nach jedem Tool, ob das Ergebnis die Exit-Condition des aktuellen Schritts erfüllt; falls nicht, wird der Rest des Plans neu geplant. Kostet einen zusätzlichen Haiku-Call pro abgeschlossenem Schritt mit Exit-Condition (Turn-Hot-Path) — daher bewusst opt-in. Greift nur bei aktivem Plan-Runner (enabled=on). Standard: off."
      required: false
      default: "off"
      enum:
        - value: "off"
          label:
            en: "Off — no exit condition check"
            de: "Off — keine Exit-Condition-Prüfung"
        - value: "on"
          label:
            en: "On — check exit conditions after each tool"
            de: "On — Exit-Conditions nach jedem Tool prüfen"
    - key: "mapStepsAtTurnEnd"
      type: "enum"
      label:
        en: "Map tool calls to steps at turn end (#1502)"
        de: "Tool-Aufrufe am Turn-Ende den Schritten zuordnen (#1502)"
      help:
        en: "During the turn the plan card credits steps in order: the i-th tool call completes the i-th step. When on, one Haiku call after the turn maps the whole tool trace to the steps and corrects the stored plan, which later turns recall. It fixes a call credited to the wrong step and a call that covered two steps. The live card is not changed, and the turn's answer is not delayed. If the call fails, the stored plan keeps the in-turn result. Costs one Haiku call per planned turn. Default: on."
        de: "Während des Turns hakt die Plan-Karte Schritte der Reihe nach ab: der i-te Tool-Aufruf erledigt den i-ten Schritt. Wenn aktiviert, ordnet ein Haiku-Aufruf nach dem Turn die ganze Tool-Spur den Schritten zu und korrigiert den gespeicherten Plan, den spätere Turns abrufen. Das behebt einen Aufruf, der dem falschen Schritt zugerechnet wurde, und einen Aufruf, der zwei Schritte erledigt hat. Die Live-Karte bleibt unverändert, und die Antwort des Turns wartet nicht darauf. Schlägt der Aufruf fehl, behält der gespeicherte Plan das Ergebnis aus dem Turn. Kostet einen Haiku-Call pro geplantem Turn. Standard: on."
      required: false
      default: "on"
      enum:
        - value: "on"
          label:
            en: "On — correct the stored plan after the turn"
            de: "On — gespeicherten Plan nach dem Turn korrigieren"
        - value: "off"
          label:
            en: "Off — keep the in-turn order mapping"
            de: "Off — Zuordnung der Reihe nach aus dem Turn behalten"
    - key: "gcDuplicatePlans"
      type: "enum"
      label:
        en: "Clean up duplicate plans (#237)"
        de: "Doppelte Pläne aufräumen (#237)"
      help:
        en: "When enabled, right after materializing a new plan the plugin cleans up older, semantically identical plans in the same scope (the user refines the same goal over several turns → only the latest iteration remains). Two layers, cheapest first: identical normalized request summary (no LLM), then a single Haiku call over the most recent candidates. Fire-and-forget; NEVER deletes the survivor or a plan whose turn is still running. Only applies when the plan runner is active (enabled=on). Default: on."
        de: "Wenn aktiviert, räumt das Plugin direkt nach dem Materialisieren eines neuen Plans ältere, semantisch gleiche Pläne im selben Scope auf (der Nutzer verfeinert dasselbe Ziel über mehrere Turns → nur die letzte Iteration bleibt). Zwei Schichten, billigste zuerst: identische normalisierte Request-Summary (kein LLM), dann ein einzelner Haiku-Call über die jüngsten Kandidaten. Fire-and-forget; löscht NIE den Überlebenden oder einen Plan mit noch laufendem Turn. Greift nur bei aktivem Plan-Runner (enabled=on). Standard: on."
      required: false
      default: "on"
      enum:
        - value: "off"
          label:
            en: "Off — no plan deduplication"
            de: "Off — keine Plan-Deduplizierung"
        - value: "on"
          label:
            en: "On — clean up older duplicate plans"
            de: "On — ältere Duplikat-Pläne aufräumen"
    - key: "reuseProcesses"
      type: "enum"
      label:
        en: "Reuse learned processes (experimental)"
        de: "Gelernte Prozesse wiederverwenden (experimentell)"
      help:
        en: "When enabled and a matching learned process (ProcessMemory) exists, the plugin materializes the plan directly from its stored steps — without the Haiku gate and without replanning. Only live when a persistent processMemory@1 provider is published (with the in-memory KG the path stays inert); data is still fetched fresh, only the order of steps is fixed. Off forces fresh planning on every turn. Only applies when the plan runner is active (enabled=on). Default: on."
        de: "Wenn aktiviert, materialisiert das Plugin bei einem passenden gelernten Prozess (ProcessMemory) den Plan direkt aus dessen gespeicherten Schritten — ohne Haiku-Gate und ohne Neuplanung. Nur scharf, wenn ein persistenter processMemory@1-Provider veröffentlicht ist (mit dem In-Memory-KG bleibt der Pfad inert); Daten werden weiter frisch geholt, nur die Schrittfolge ist fixiert. Off erzwingt pro Turn eine frische Planung. Greift nur bei aktivem Plan-Runner (enabled=on). Standard: on."
      required: false
      default: "on"
      enum:
        - value: "off"
          label:
            en: "Off — always plan fresh"
            de: "Off — immer frisch planen"
        - value: "on"
          label:
            en: "On — reuse a matching learned process"
            de: "On — passenden gelernten Prozess wiederverwenden"
    - key: "processReuseThreshold"
      type: "string"
      label:
        en: "Similarity threshold for process reuse"
        de: "Ähnlichkeitsschwelle für Prozess-Wiederverwendung"
      help:
        en: "Hybrid retrieval score (range 0–1) at or above which a learned process is reused instead of replanning; higher = stricter, fewer matches. Non-numeric, empty or out-of-range values fall back to the default 0.6. Only applies when reuseProcesses=on. Default: 0.6."
        de: "Hybrid-Retrieval-Score (Wertebereich 0–1), ab dem ein gelernter Prozess statt einer Neuplanung wiederverwendet wird; höher = strenger, weniger Treffer. Nicht-numerische, leere oder außerhalb von 0–1 liegende Werte fallen auf den Standard 0.6 zurück. Greift nur bei reuseProcesses=on. Standard: 0.6."
      required: false
      default: "0.6"
      # No decimal field type exists (loader: string|url|secret|oauth|enum|
      # boolean|integer|host_list|json_file), so the 0–1 score is a string with
      # a pattern that rejects out-of-range/non-numeric input at the schema
      # level. The pattern is not the only write path, though — the admin
      # `PATCH /installed/:id/config` route and profile apply store values
      # without re-running it, keeping raw JSON/YAML types (a number `0.8` is
      # possible) — so the plugin ALSO falls back to 0.6 on anything
      # non-numeric or outside 0–1 (`parseProcessReuseThreshold`, belt + braces).
      pattern: "^(0|1|0\\.[0-9]+|1\\.0+)$"
      pattern_hint:
        en: "Decimal between 0 and 1, e.g. 0.6"
        de: "Dezimalzahl zwischen 0 und 1, z. B. 0.6"

# ---------------------------------------------------------------------------
# Permissions. The plugin writes `Plan` / `PlanStep` nodes via the
# `knowledgeGraph` service (the graph allow-list below is declarative; the
# service call itself is the write path). Base: one Haiku gate call + one
# planning call per plan-worthy turn. With verifyExitConditions=on, one extra
# Haiku call per completing step that declared an exit condition, plus a
# planning call per replan. With mapStepsAtTurnEnd=on (default), one mapping
# call per planned turn (#1502).
#
# `calls_per_invocation` is counted over the plugin context's lifetime, i.e.
# since activation, not per turn (see handoff "Aufrufzähler des Accessors").
# At 30 the gate alone used it up after about 30 turns, and planning then
# stopped silently until the next activation. Same ceiling as the
# ui-orchestrator for the same reason.
# ---------------------------------------------------------------------------
permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false
  llm:
    models_allowed:
      - "claude-haiku-4-5"
    calls_per_invocation: 1000000
    max_tokens_per_call: 2048

playbook:
  when_to_use: |
    Aktiviere dieses Plugin (experimentell), wenn der Orchestrator bei
    langen, mehrstufigen Turns frühere Sub-Goals strukturell festhalten soll,
    statt sich auf das LLM-Gedächtnis zu verlassen. Es hängt sich an den
    onBeforeTurn-Hook, klassifiziert per Haiku, ob ein Plan nötig ist, und
    persistiert bei Bedarf einen Plan-DAG im Knowledge-Graph.

provides: []
requires: []
