schema_version: "1"

identity:
  id: "@omadia/plugin-quality-guard"
  name: "Quality Guard"
  version: "0.2.1"
  kind: "tool"
  domain: "quality.response-guard"
  description:
    en: "Keeps answers factual and on topic. It sets how firmly an agent should avoid flattery and adds those boundaries to its instructions."
    de: "Hält Antworten sachlich und beim Thema. Es legt fest, wie deutlich ein Agent Gefälligkeit vermeiden soll, und ergänzt diese Grenzen in seinen Anweisungen."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "quality"
    - "guardrails"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# ---------------------------------------------------------------------------
# Setup fields. The operator can configure GLOBAL defaults — these apply when
# the orchestrator calls `responseGuard.getRules` without a profile-quality
# override. Per-profile overrides land via AGENT.md frontmatter (Phase 2.1)
# or via the legacy `agent_overrides` map below.
#
# Two axes, do not conflate them:
#   - WITHIN the plugin these three sources OVERRIDE each other, resolving to
#     one block: AGENT.md `quality` frontmatter → `agent_overrides` → defaults.
#   - That resolved block is then PREPENDED to every agent's prompt IN ADDITION
#     to the boundaries the agent already carries from the Agent Builder /
#     operator "Grenzen" tab. Those two blocks STACK — neither replaces the
#     other — so a prohibition set in both places appears twice, and a plugin
#     default sycophancy plus a per-agent slider yield two anti-flattery blocks.
# ---------------------------------------------------------------------------
setup:
  fields:
    - key: "default_sycophancy"
      type: "enum"
      label:
        en: "Default sycophancy level"
        de: "Default Sycophancy-Level"
      help:
        en: "Applies to every agent that sets no anti-flattery level of its own and has no `agent_overrides` entry. `off` disables the anti-flattery rules; `medium` is a balanced default for advisory use cases; `high` plays devil's advocate. Order per agent: the agent's own setting (agent editor → Boundaries, or AGENT.md `quality` frontmatter) → `agent_overrides` → this default. An agent with its own level already carries it in its own prompt, so this plugin adds no second anti-flattery block for that agent; the same holds for boundaries."
        de: "Wirkt für jeden Agenten, der keine eigene Schmeichel-Bremse gesetzt hat und keinen Eintrag in `agent_overrides` hat. `off` deaktiviert die Anti-Schmeichel-Regeln; `medium` ist eine balancierte Standardvorgabe für Beratungs-Use-Cases; `high` ist devil's-advocate. Reihenfolge pro Agent: die eigene Einstellung des Agenten (Agent-Editor → Grenzen oder AGENT.md-`quality`-Frontmatter) → `agent_overrides` → dieser Default. Ein Agent mit eigener Stufe trägt sie bereits in seinem eigenen Prompt, deshalb hängt dieses Plugin für ihn keinen zweiten Anti-Schmeichel-Block an; für Grenzen gilt dasselbe."
      required: false
      default: "medium"
      enum:
        - value: "off"
          label:
            en: "Off — no anti-flattery rules"
            de: "Off — keine Anti-Schmeichel-Regeln"
        - value: "low"
          label:
            en: "Low — light correction on explicit false confirmation"
            de: "Low — leichte Korrektur bei expliziter Falsch-Bestätigung"
        - value: "medium"
          label:
            en: "Medium — balanced (default for advisory use cases)"
            de: "Medium — balanciert (Default für Beratungs-Use-Cases)"
        - value: "high"
          label:
            en: "High — devil's advocate, challenges premises"
            de: "High — devil's advocate, hinterfragt Prämissen"

    - key: "default_boundary_presets"
      type: "string"
      label:
        en: "Default boundary presets (comma-separated)"
        de: "Default Boundary-Presets (komma-separiert)"
      help:
        en: "IDs from the shared preset library that apply to ALL profiles — the same IDs as in the agent editor → Boundaries: no-financial-data, no-pii, no-medical-data, no-legal-advice, own-domain-only, no-code-execution, no-external-links, no-discount-authority, no-commitments, no-personnel-decisions, no-speculation, no-competitor-discussion. Still accepted (v0.1 plugin IDs, unchanged wording): no-financial-advice, no-medical-advice, internal-only, no-pii-collection, no-external-quotes, privacy-first, factual-only, no-reasoning-disclosure. Unknown IDs are logged at startup and ignored. These presets apply on top of each agent's own boundaries — both blocks land in the prompt, neither replaces the other. Set a prohibition in one place only."
        de: "IDs aus der gemeinsamen Preset-Library, die für ALLE Profile gelten — dieselben IDs wie im Agent-Editor → Grenzen: no-financial-data, no-pii, no-medical-data, no-legal-advice, own-domain-only, no-code-execution, no-external-links, no-discount-authority, no-commitments, no-personnel-decisions, no-speculation, no-competitor-discussion. Weiterhin akzeptiert (Plugin-IDs aus v0.1, unveränderter Wortlaut): no-financial-advice, no-medical-advice, internal-only, no-pii-collection, no-external-quotes, privacy-first, factual-only, no-reasoning-disclosure. Unbekannte IDs werden beim Start protokolliert und ignoriert. Diese Presets gelten zusätzlich zu den agenteneigenen Grenzen — beide Blöcke landen im Prompt, keiner ersetzt den anderen. Ein Verbot also nur an einer Stelle setzen."
      required: false
      default: ""

    - key: "default_boundary_custom"
      type: "string"
      label:
        en: "Default custom boundaries (one per line)"
        de: "Default Custom-Boundaries (newline-separiert)"
      help:
        en: "Free-text boundaries, one per line. Added verbatim as bullet points to the system prompt, on top of each agent's own boundaries."
        de: "Freitext-Boundaries, eine pro Zeile. Werden 1:1 als Bullet-Points in den System-Prompt gehängt, zusätzlich zu den agenteneigenen Grenzen."
      required: false
      default: ""

    - key: "agent_overrides"
      type: "string"
      label:
        en: "Per-agent overrides (JSON)"
        de: "Per-Agent-Overrides (JSON)"
      help:
        en: "Optional JSON map agent slug → sycophancy level. Example: {\"fallback\":\"off\",\"sales\":\"high\"}. The key is the agent's slug, as in its URL (/operator/agents/<slug>). An agent's own anti-flattery setting (agent editor → Boundaries, or AGENT.md `quality` frontmatter) wins over this map."
        de: "Optionale Map Agent-Slug → SycophancyLevel als JSON. Beispiel: {\"fallback\":\"off\",\"sales\":\"high\"}. Der Schlüssel ist der Slug des Agenten, wie in seiner URL (/operator/agents/<slug>). Die eigene Schmeichel-Bremse des Agenten (Agent-Editor → Grenzen oder AGENT.md-`quality`-Frontmatter) geht dieser Map vor."
      required: false
      default: ""

playbook:
  when_to_use: |
    Aktiviere dieses Plugin, wenn der Orchestrator zuverlässig konkrete,
    nicht-schmeichelnde Antworten liefern soll — Beratungs-Agents, SEO-
    Analyst, alle Profile mit Risiko für False-Positive-Bestätigungen.
    Das Plugin published die `responseGuard@1`-Capability; der Orchestrator
    splice't den `prependRules`-Block VOR die Body-Prose des System-Prompts
    als eigenes Cache-Element. Profile ohne Quality-Frontmatter erben die
    globalen Defaults.

# ---------------------------------------------------------------------------
# Permissions. The plugin only manipulates strings — no network, no graph,
# no memory writes. Allow-lists are explicit-empty so the operator sees the
# zero-attack-surface in the install dialog.
# ---------------------------------------------------------------------------
permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false

provides:
  - "responseGuard@1"
requires: []
