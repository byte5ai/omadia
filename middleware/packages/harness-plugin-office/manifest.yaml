schema_version: "1"

identity:
  id: "@omadia/plugin-office"
  name: "Headless Office"
  version: "0.1.3"
  kind: "tool"
  domain: "productivity.office"
  description:
    en: "Creates Excel and Word files from structured data and returns a download link that a channel can attach to its answer."
    de: "Erzeugt Excel- und Word-Dateien aus strukturierten Daten und liefert einen Download-Link, den ein Kanal an seine Antwort anhängen kann."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "productivity"
    - "infrastructure"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

setup:
  guide:
    en: |
      ## Set up document storage (Tigris / S3)

      Headless Office renders .xlsx/.docx files and stores them in an
      **S3-compatible bucket** (Tigris), then serves signed `/documents` URLs.
      You need a bucket and your middleware's public URL.

      ### 1. Create an S3-compatible bucket
      1. Create a bucket on **[Tigris](https://www.tigrisdata.com)** (or any
         S3-compatible store).
      2. Note the **endpoint** (e.g. `https://fly.storage.tigris.dev`) and the
         **bucket name** → fields **Tigris/S3 Endpoint** and **Bucket-Name**.
      3. Create access credentials (access key id + secret) and provide them when
         prompted during install.

      ### 2. Public base URL
      Set **Public Middleware Base-URL** to the public origin where this
      middleware is reachable (e.g. `https://bot.omadia.ai`). It is embedded in
      the signed file URLs that channels render as attachments.

      > **Tenant prefix** namespaces keys in a shared bucket (default `dev`);
      > **Signed-URL TTL** controls how long a document link stays valid.
    de: |
      ## Datei-Speicher einrichten (Tigris / S3)

      Headless Office erzeugt .xlsx/.docx-Dateien, legt sie in einem
      **S3-kompatiblen Bucket** (Tigris) ab und liefert signierte
      `/documents`-URLs. Du brauchst einen Bucket und die öffentliche URL deiner
      Middleware.

      ### 1. S3-kompatiblen Bucket anlegen
      1. Lege einen Bucket bei **[Tigris](https://www.tigrisdata.com)** (oder
         einem beliebigen S3-kompatiblen Store) an.
      2. Notiere **Endpoint** (z.B. `https://fly.storage.tigris.dev`) und
         **Bucket-Name** → Felder **Tigris/S3 Endpoint** und **Bucket-Name**.
      3. Erstelle Zugangsdaten (Access Key ID + Secret) und trage sie bei der
         Installation ein, wenn danach gefragt wird.

      ### 2. Öffentliche Base-URL
      Setze **Öffentliche Middleware-Base-URL** auf die öffentliche Origin, unter
      der diese Middleware erreichbar ist (z.B. `https://bot.omadia.ai`). Sie
      steckt in den signierten Datei-URLs, die Channels als Anhang rendern.

      > **Tenant-Prefix** trennt Keys in einem gemeinsamen Bucket (Default `dev`);
      > **Signed-URL-TTL** steuert, wie lange ein Dokument-Link gültig bleibt.
  fields:
    - key: "public_base_url"
      type: "url"
      label: "Öffentliche Middleware-Base-URL"
      help: "Wird in signierten Datei-URLs verwendet, z.B. https://bot.omadia.ai"
      required: true

    - key: "tigris_endpoint"
      type: "url"
      label: "Tigris/S3 Endpoint"
      required: true

    - key: "tigris_bucket"
      type: "string"
      label: "Tigris/S3 Bucket-Name"
      required: true

    - key: "tenant_id"
      type: "string"
      label: "Tenant-Prefix für Keys"
      required: false
      default: "dev"

    - key: "signed_url_ttl_sec"
      type: "integer"
      label: "Signed-URL-TTL (Sekunden)"
      required: false
      default: 3600

    - key: "max_rows"
      type: "integer"
      label: "Max. Zeilen pro Dokument (Schutz gegen Runaways)"
      required: false
      default: 100000

    - key: "document_url_secret"
      type: "secret"
      label: "HMAC-Secret für signierte Datei-URLs"
      required: true

    - key: "aws_access_key_id"
      type: "secret"
      label: "Tigris Access Key ID"
      required: true

    - key: "aws_secret_access_key"
      type: "secret"
      label: "Tigris Secret Access Key"
      required: true

playbook:
  when_to_use: |
    Datei-Erzeugung on-demand: Excel-Tabellen (.xlsx) und Word-Dokumente
    (.docx) aus strukturierten Daten. Die Antwort enthält eine signierte
    /documents-URL, die Web-UI/Telegram als Download bzw. Dokument anhängen.
    Nutze es, wenn der User explizit eine Datei/Tabelle/Report als Download
    will — nicht für reine Text-Antworten.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false
  # Signed download URLs (`/documents/dl/<key>?exp=&sig=`) are opened by
  # channel users who have no operator session. The route authenticates itself
  # via the HMAC signature; this declaration lets it be served without the
  # kernel's session gate — once the operator grants it. Two segments because a
  # one-segment claim is refused as too broad.
  public_paths:
    - "/documents/dl"

integrations: []
