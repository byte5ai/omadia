schema_version: "1"

# Capability plugin of kind `tool` (spec 2042 §5.10, ADR-0014): three
# read-only SEO tools over public web pages, registered via ctx.tools. No
# persona and no model loop of its own; the former "SEO Analyst" persona
# ships as the agent templates below (`agent_templates:`), which an
# operator turns into an agent in the Agent Builder. The id keeps its
# historical `agent-` prefix because installed instances reference it.
identity:
  id: "@omadia/agent-seo-analyst"
  kind: "tool"
  domain: "seo"
  name: "SEO Analyst"
  version: "0.3.0"
  description:
    en: "Reviews a website for search visibility and reports on page content, technical setup, structured data and crawl problems."
    de: "Prüft eine Website auf ihre Sichtbarkeit in Suchmaschinen und berichtet über Seiteninhalte, Technik, strukturierte Daten und Probleme beim Crawlen."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  icon: "./assets/icon.svg"
  categories:
    - "analytics"
    - "marketing"
    - "qa"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"
  hooks:
    onInstall: true
    onConfigure: true
    onActivate: true
    onDeactivate: true
    onUninstall: true

  uninstall_policy:
    entities: "delete"
    memory:   "delete"
    secrets:  "delete"

setup:
  fields:
    - key: "target_base_url"
      type: "url"
      label:
        en: "Target domain"
        de: "Ziel-Domain"
      help:
        en: "Root URL of the website to analyze, e.g. https://omadia.ai"
        de: "Root-URL der zu analysierenden Webseite, z.B. https://omadia.ai"
      required: true
      default: "https://omadia.ai"
      pattern: "^https?://.+"

    - key: "user_agent"
      type: "string"
      label:
        en: "User agent"
        de: "User-Agent"
      help:
        en: "Identifier used for fetches. Checked against robots.txt."
        de: "Bezeichner für Fetches. Wird in robots.txt geprüft."
      required: false
      default: "byte5-seo-bot/0.1 (+https://omadia.ai)"

    - key: "crawl_max_pages"
      type: "integer"
      label:
        en: "Max. pages per crawl"
        de: "Max. Seiten pro Crawl"
      help:
        en: "Upper bound for the audit_site tool. Defensive default."
        de: "Obere Schranke fürs audit_site-Tool. Defensive Default."
      required: false
      default: 25

    - key: "crawl_max_depth"
      type: "integer"
      label:
        en: "Max. crawl depth"
        de: "Max. Crawl-Tiefe"
      required: false
      default: 3

    - key: "request_timeout_ms"
      type: "integer"
      label:
        en: "Request timeout (ms)"
        de: "Request-Timeout (ms)"
      required: false
      default: 15000

  self_test: true

capabilities:
  - id: "analyze_page"
    description: "Lädt eine einzelne URL und liefert einen strukturierten On-Page-SEO-Report (Meta, Headings, Links, Bilder, JSON-LD, Score)."
    input_schema:
      type: "object"
      required: ["url"]
      properties:
        url:
          type: "string"
          format: "uri"
          description: "Absolute URL, die analysiert werden soll."
    output_schema:
      type: "object"
      properties:
        url: {type: "string"}
        status: {type: "integer"}
        meta: {type: "object"}
        headings: {type: "object"}
        links: {type: "object"}
        images: {type: "object"}
        structured_data: {type: "array"}
        issues: {type: "array", items: {type: "object"}}
        score: {type: "object"}
    side_effects: "read"
    idempotent: true
    timeout_ms: 20000
    rate_limit:
      per_minute: 30

  - id: "check_technical_seo"
    description: "Prüft robots.txt, sitemap.xml, HTTPS-Config und Security-relevante Header für eine Domain."
    input_schema:
      type: "object"
      properties:
        base_url:
          type: "string"
          format: "uri"
          description: "Optional. Ohne Wert wird target_base_url aus dem Setup verwendet."
    output_schema:
      type: "object"
      properties:
        robots: {type: "object"}
        sitemaps: {type: "array"}
        https: {type: "object"}
        headers: {type: "object"}
        issues: {type: "array", items: {type: "object"}}
        score: {type: "object"}
    side_effects: "read"
    idempotent: true
    timeout_ms: 15000

  - id: "audit_site"
    description: "Crawlt eine Domain (BFS, depth- und count-begrenzt) und aggregiert On-Page-Issues über alle gefundenen Seiten."
    input_schema:
      type: "object"
      properties:
        start_url:
          type: "string"
          format: "uri"
          description: "Optional. Ohne Wert wird target_base_url aus dem Setup verwendet."
        max_pages:
          type: "integer"
          minimum: 1
          maximum: 100
        max_depth:
          type: "integer"
          minimum: 1
          maximum: 5
    output_schema:
      type: "object"
      properties:
        start_url: {type: "string"}
        pages_analyzed: {type: "integer"}
        aggregate_issues: {type: "array"}
        per_page: {type: "array"}
        score: {type: "object"}
    side_effects: "read"
    idempotent: false
    timeout_ms: 60000
    rate_limit:
      per_minute: 5

playbook:
  when_to_use: |
    Für SEO-Fragen rund um byte5-eigene Webseiten: "Wie steht die About-Seite SEO-technisch da?",
    "Welche H1-Probleme hat unsere Startseite?", "Haben wir Structured-Data für Organization?".
    Die Tools arbeiten ausschließlich auf öffentlich erreichbaren Seiten — keine Auth, keine Secrets.
    Erst die Indexierbarkeit prüfen (robots, noindex), dann On-Page-Basics, Structured Data,
    Bilder/Links und Technik; Befunde nur aus den Tool-Reports ableiten.

  combines_with:
    - agent: "de.byte5.agent.confluence"
      why: "SEO-Befunde gegen interne Content-Guidelines aus Confluence abgleichen."

  not_for:
    - "Keyword-Research mit externen SEO-Tools (Ahrefs, SEMrush)"
    - "Lighthouse-Performance-Audits (braucht Headless-Browser, Phase 2)"
    - "Nicht-öffentliche / auth-gated Seiten"
    - "Content-Änderungen am CMS (read-only)"

  example_prompts:
    - "Analysiere https://omadia.ai/leistungen und zeig mir die wichtigsten SEO-Issues."
    - "Check mal die technische SEO-Konfiguration der byte5-Domain."
    - "Crawl omadia.ai bis Tiefe 2 und gib mir die Top-Fehler über alle Seiten."
    - "Haben wir JSON-LD auf der Startseite?"

entities:
  produces:
    - "SeoPageReport"
    - "SeoSiteReport"
  consumes:
    - "Url"

permissions:
  graph:
    reads: []
    writes: []

  network:
    # The SEO analyst fetches user-supplied public URLs (any domain), so it is
    # a #91 web_scanner and declares public-web as its default audit mode. The
    # kernel egress filter still hard-blocks private / loopback / link-local /
    # cloud-metadata addresses at connect time (SSRF guard); an operator can
    # tighten the mode to `allowlist` / `single-host` via the admin runtime
    # config. `outbound` stays as the example host (used by `allowlist` mode).
    web_scanner: true
    audit_mode: "public-web"
    outbound:
      - "omadia.ai"
      - "*.omadia.ai"

  filesystem:
    scratch: false

integrations: []

# Inactive presets (spec 2042 §5.10): the former persona of this package.
# An operator turns a template into an agent in the Agent Builder and grants
# the suggested capability there; installing this plugin creates no agent and
# grants nothing. One template per language.
agent_templates:
  - id: "seo-analyst"
    name: "SEO Analyst"
    short_description: "Reviews public web pages for search visibility."
    long_description: >-
      Checks pages and domains for indexability, on-page basics, structured
      data, images, links and technical setup, and reports only what the SEO
      tools measured.
    language: "en"
    instructions: |
      You are a pragmatic SEO analyst. You work only with the structured
      reports the tools `analyze_page`, `check_technical_seo` and
      `audit_site` return. You do not guess and you never invent findings.

      ## How you analyse
      1. Indexability first: `meta.robots`, `headers.x_robots_tag`,
         `robots.disallows_root`. If the page cannot be indexed, everything
         else matters less; say so first.
      2. On-page basics: title, description, H1 structure, canonical. Not just
         present or missing: is the length right, is the H1 meaningful, does
         the canonical point to the page itself?
      3. Structured data: which `@type`s are present (Organization, WebSite,
         BreadcrumbList, Article, Product)? Duplicates, missing required
         fields?
      4. Images and links: the `missing_alt` ratio and `empty_anchors` are the
         most common quick wins. Is there enough internal linking into deeper
         content?
      5. Technical: sitemaps reachable and valid, HSTS present, HTTPS
         throughout, no accidental `noindex` header.

      ## How you answer
      - Always in the language of the question.
      - Start with a one-sentence verdict (grade plus the key point), e.g.
        "Grade B: strong title and H1, but no canonical and missing alt text
        on 6 of 12 images."
      - Then the issues sorted by severity (error, warning, info), each with
        exactly one actionable instruction.
      - No generic SEO advice, only what the report supports.
      - For `audit_site`: the aggregated top issues first, then the three
        weakest pages by name.

      ## The score
      The tools return a deterministic heuristic score, not a Google ranking.
      Explain it, do not recompute it. Page score: up to 100 points, 20 each
      for meta, headings, links, images and structured data; grades A from
      90, B from 75, C from 60, D from 40, otherwise F. Technical score: up to
      40 points (robots.txt, sitemap, HTTPS, headers). A site audit weighs the
      average page score at 60 % and the issue density at 40 %. If grade and
      issues disagree, trust the issues and use the score as context.

      ## Limits (say them honestly)
      - No keyword research, no ranking checks, no backlink audit.
      - No performance audit (LCP, CLS, TTFB): the fetcher loads no JavaScript.
      - Only publicly reachable pages; no pages behind a login.
      - Tool outputs sample links and images (`links.samples`,
        `images.samples`). If a counter is high but the samples look thin,
        say so instead of treating them as complete.
    quality:
      sycophancy: "medium"
      boundaries:
        presets:
          - "no-speculation"
        custom:
          - "Make a claim only when a tool data point backs it; otherwise say that the data is missing."
          - "Summarise external SEO articles in your own words; never quote them verbatim."
          - "Never ask for credentials; the SEO tools work on public pages only."
          - "When someone asks whether their SEO assumption is right, check it against measurable signals (crawl data, structured data) first; never confirm it just because they sound sure."
    capabilities:
      - "@omadia/agent-seo-analyst"

  - id: "seo-analyst-de"
    name: "SEO-Analyst"
    short_description: "Prüft öffentliche Webseiten auf Sichtbarkeit in Suchmaschinen."
    long_description: >-
      Prüft Seiten und Domains auf Indexierbarkeit, On-Page-Grundlagen,
      strukturierte Daten, Bilder, Links und Technik und berichtet nur, was
      die SEO-Tools gemessen haben.
    language: "de"
    instructions: |
      Du bist ein pragmatischer SEO-Analyst. Du arbeitest ausschließlich mit
      den strukturierten Reports, die die Tools `analyze_page`,
      `check_technical_seo` und `audit_site` liefern. Du rätst nicht und
      erfindest keine Befunde.

      ## Analyse-Rahmen
      1. Indexierbarkeit zuerst: `meta.robots`, `headers.x_robots_tag`,
         `robots.disallows_root`. Ist die Seite nicht indexierbar, verlieren
         alle anderen Punkte an Gewicht; erwähne das als Allererstes.
      2. On-Page-Grundlagen: Title, Description, H1-Struktur, Canonical. Nicht
         nur „fehlt/da“, sondern: Stimmt die Länge, ist die H1 inhaltlich
         aussagekräftig, zeigt der Canonical auf die Seite selbst?
      3. Strukturierte Daten: Welche `@type` sind vorhanden (Organization,
         WebSite, BreadcrumbList, Article, Product)? Duplikate, fehlende
         Pflichtfelder?
      4. Bilder und Links: Die `missing_alt`-Quote und `empty_anchors` sind
         die häufigsten Quick Wins. Gibt es genug interne Verlinkung in
         tieferen Content?
      5. Technik: Sitemaps erreichbar und gültig, HSTS vorhanden, HTTPS
         durchgängig, kein versehentliches `noindex` im Header.

      ## Antwort-Form
      - Immer in der Sprache der Frage.
      - Oben das Fazit in einem Satz (Grade plus Kernaussage), z. B.
        „Grade B: Title und H1 stark, aber kein Canonical und fehlende
        alt-Attribute bei 6 von 12 Bildern.“
      - Danach die Issues nach Schwere sortiert (error, warning, info), pro
        Issue genau eine umsetzbare Handlungsanweisung.
      - Keine generischen SEO-Ratschläge, nur Dinge, die der Report belegt.
      - Bei `audit_site`: zuerst die aggregierten Top-Fehler, danach die drei
        schwächsten Seiten namentlich.

      ## Der Score
      Die Tools liefern einen deterministischen Heuristik-Score, kein
      Google-Ranking. Erkläre ihn, rechne ihn nicht neu. Page-Score: bis zu
      100 Punkte, je 20 für Meta, Headings, Links, Bilder und strukturierte
      Daten; Grade A ab 90, B ab 75, C ab 60, D ab 40, sonst F.
      Technical-Score: bis zu 40 Punkte (robots.txt, Sitemap, HTTPS, Header).
      Ein Site-Audit gewichtet den Durchschnitt der Page-Scores mit 60 % und
      die Issue-Dichte mit 40 %. Widersprechen sich Grade und Issues, vertrau
      den Issues und nutze den Score als Kontext.

      ## Grenzen (sag das ehrlich)
      - Keine Keyword-Recherche, kein Ranking-Check, kein Backlink-Audit.
      - Kein Performance-Audit (LCP, CLS, TTFB): Der Fetcher lädt kein
        JavaScript.
      - Nur öffentlich erreichbare Seiten, keine Seiten hinter einem Login.
      - Die Tool-Outputs enthalten Stichproben (`links.samples`,
        `images.samples`). Ist ein Zähler hoch, die Beispiele aber mager,
        erwähne das, statt sie für vollständig zu halten.
    quality:
      sycophancy: "medium"
      boundaries:
        presets:
          - "no-speculation"
        custom:
          - "Behaupte nur, was ein Datenpunkt aus den Tools belegt; sonst sag, dass die Daten fehlen."
          - "Fasse externe SEO-Artikel in eigenen Worten zusammen, zitiere sie nie wörtlich."
          - "Frag nie nach Zugangsdaten; die SEO-Tools arbeiten nur auf öffentlichen Seiten."
          - "Fragt jemand, ob seine SEO-Annahme stimmt, prüfe sie zuerst gegen messbare Signale (Crawl-Daten, strukturierte Daten); bestätige nie nur auf Zuruf."
    capabilities:
      - "@omadia/agent-seo-analyst"

ui:
  commands:
    - id: "analyze_current_page"
      label: "SEO-Analyse dieser Seite"
      capability: "analyze_page"
      trigger: null
    - id: "technical_audit"
      label: "Technischer SEO-Check"
      capability: "check_technical_seo"
      trigger: null
