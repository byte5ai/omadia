schema_version: "1"

identity:
  id: "@omadia/orchestrator-extras"
  name: "Orchestrator Extras"
  version: "0.1.0"
  kind: "extension"
  domain: "core.orchestrator-extras"
  description:
    en: "Adds the steps around a chat turn that make answers better over time. It looks up relevant context before the turn, records facts in the knowledge graph afterwards, and recognises what a message is about."
    de: "Ergänzt die Schritte rund um einen Chat-Zug, die Antworten mit der Zeit besser machen. Es sucht vorher passenden Kontext, hält danach Fakten im Wissensgraphen fest und erkennt, worum es in einer Nachricht geht."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  categories:
    - "infrastructure"
    - "orchestration"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

provides:
  - "contextRetriever@1"
  - "factExtractor@1"
  - "topicDetector@1"
  - "captureFilter@1"
  - "sessionBriefing@1"
  # OM-102 — the three LLM-backed memory features state themselves for the
  # dashboard card. The scratch-promotion reaper is a background job that
  # publishes nothing else, so its state has no other reader.
  - "memoryFeatureStatus@1"

requires:
  - "knowledgeGraph@^1"
  - "embeddingClient@^1"

# OM-102 — kernel services the provider chain reads. All three are published
# by the kernel at boot (before any plugin activates) and all three are
# genuinely optional: without them the chain degrades to the pre-OM-102
# behaviour (this plugin's own vault scope, `anthropic` only).
optional_requires:
  - "llmProviderCatalog@1"
  - "llmProviderPool@1"
  - "installedPluginConfigReader@1"
  # WP-10 — the memory jobs mask the stored text they send. `turnContext`
  # (kernel) carries the turn's privacy handle; `privacyRedact` is the key the
  # privacy guard registers its service under (its capability is named
  # `privacy.redact@1`, see `pluginServiceGrants.ts`). Neither holds activation
  # back: without a privacy guard the jobs send what they sent before.
  - "turnContext@1"
  - "privacyRedact@1"

# ---------------------------------------------------------------------------
# S+9.2 Sub-Commit 2b: Capability lifetime flipped.
#
# manifest-provides ≠ runtime-provides (S+9.1 Lesson #2): the plugin
# declares all three capabilities here so the capability resolver
# sees them as "available". At runtime activate() decides — depending on
# config — which ones are actually delivered to the ServiceRegistry:
#
#   - `contextRetriever@1`: active as soon as knowledgeGraph + embeddingClient
#     are present (embeddingClient is internally optional — degrades to
#     FTS-only). Is ALWAYS published when the requires are satisfied.
#   - `factExtractor@1` + `topicDetector@1`: only when ANTHROPIC_API_KEY
#     is set (Haiku calls). Without the key activate runs without provide;
#     consumers degrade gracefully (Orchestrator skips fact-ingest;
#     Teams TopicDetector skips → continue-default).
#
# Always-Register-Bootstrap-Pattern (S+9.1 Rule #8): bootstrap.ts
# `bootstrapOrchestratorExtrasFromEnv` ALWAYS registers the plugin —
# even when ANTHROPIC_API_KEY is empty — otherwise the resolver dies
# when a later consumer declares `requires: ["topicDetector@^1"]`.
# ---------------------------------------------------------------------------

setup:
  # Nur operativ relevante Felder im UI. Die internen Tuning-Knöpfe
  # (recall-weights, context-budget, topic-thresholds, model-overrides,
  # backfill-/decay-Parameter) bleiben über ihre code-seitigen Defaults
  # gesteuert (`parseNumberOrDefault(ctx.config.get(...), default)`). Bei
  # Bedarf jederzeit hier wieder als Feld deklarierbar.
  # #1096: context_tail_size ist bewusst KEIN interner Knopf — die Tail-Länge
  # bestimmt, wie viel des laufenden Gesprächs das Modell überhaupt sieht,
  # und war als unsichtbare 3 genau der Grund, warum das Modell sich an die
  # Sitzung nicht erinnerte.
  fields:
    - key: "anthropic_api_key"
      label:
        en: "Anthropic API key"
        de: "Anthropic-API-Key"
      type: "secret"
      required: false
      help:
        en: "Optional. OM-102: FactExtractor, TopicDetector and the scratch reaper run on ANY available LLM provider — first their own assignment (llm_provider), then the orchestrator's (e.g. the Claude subscription via claude-cli), and only last this key. Only needed if these background jobs should deliberately run on a dedicated Anthropic key. Without any provider only the ContextRetriever remains. (S+12.6: type: secret — the key is stored in the vault, not in the installed.json config.)"
        de: "Optional. OM-102: FactExtractor, TopicDetector und der Scratch-Reaper laufen auf JEDEM verfügbaren LLM-Provider — zuerst die eigene Zuordnung (llm_provider), dann die des Orchestrators (z. B. das Claude-Abo über claude-cli), erst zuletzt dieser Key. Nur nötig, wenn diese Hintergrund-Jobs bewusst auf einem eigenen Anthropic-Key laufen sollen. Ohne jeden Provider bleibt nur der ContextRetriever. (S+12.6: type: secret — Key wird im Vault gespeichert, nicht in installed.json config.)"
    - key: "capture_level"
      label:
        en: "Capture level"
        de: "Capture-Level"
      type: "string"
      required: false
      help:
        en: "off | minimal | normal | aggressive. Default: normal. minimal: privacy + hints automatically, no LLM, no scoring. normal: + significance scoring; turns below score 0.2 are stored only as a history entry (#1096: they stay visible in the conversation tail but get no embedding and do not show up in cross-session recall). aggressive: the same cutoff at 0.5. off: escape hatch — NO cleanup, unstripped text goes into the index."
        de: "off | minimal | normal | aggressive. Default: normal. minimal: privacy + hints automatisch, kein LLM, keine Bewertung. normal: + Significance-Scoring, Turns unter score 0.2 werden nur als Verlaufs-Eintrag gespeichert (#1096: sie bleiben im Gesprächs-Tail sichtbar, erhalten aber kein Embedding und tauchen in der sitzungsübergreifenden Recall nicht auf). aggressive: dieselbe Grenze bei 0.5. off: Escape-Hatch — KEIN Cleanup, ungestripped text in den Index."
    - key: "capture_default_visibility"
      label:
        en: "Capture default visibility"
        de: "Capture-Standard-Sichtbarkeit"
      type: "string"
      required: false
      help:
        en: "private | team | public. Default: team. Used when neither a palaia hint nor the scorer provides a visibility."
        de: "private | team | public. Default: team. Wird verwendet, wenn weder palaia-hint noch der Scorer eine Visibility liefert."
    - key: "capture_significance_threshold"
      label:
        en: "Significance threshold (overrides level default)"
        de: "Significance-Threshold (überschreibt den Level-Default)"
      type: "string"
      required: false
      help:
        en: "Threshold in [0,1]. Default = level-specific (normal=0.2, aggressive=0.5). Only relevant from capture_level=normal upwards. Determines what is stored as knowledge (embedding, recall, promotion) — not what the chat history contains."
        de: "Grenze in [0,1]. Default = level-spezifisch (normal=0.2, aggressive=0.5). Nur relevant ab capture_level=normal. Bestimmt, was als Wissen gespeichert wird (Embedding, Recall, Promotion) — nicht, was der Chat-Verlauf enthält."
    - key: "context_tail_size"
      label:
        en: "Conversation tail (number of turns)"
        de: "Gesprächs-Tail (Anzahl Turns)"
      type: "integer"
      required: false
      default: "10"
      help:
        en: "How many of the most recent turns of the running session go into the context verbatim — the model's only memory within a session. Default 10 (until #1096 fixed at 3, with no way to change it). Higher values cost room in the token budget (context_default_budget_tokens) that is otherwise available for cross-session recall; values outside 1–50 are clamped to that range. On Neon the daily GC keeps at most graph_gc_hot_max_entries turns per session (default 50) — a longer tail would have nothing left to read after that."
        de: "Wie viele der letzten Turns der laufenden Sitzung wortwörtlich in den Kontext gehen — das einzige Gedächtnis des Modells innerhalb einer Sitzung. Default 10 (bis #1096 fest auf 3, ohne Einstellmöglichkeit). Höhere Werte kosten Platz im Token-Budget (context_default_budget_tokens), der sonst der sitzungsübergreifenden Recall zur Verfügung steht; Werte ausserhalb von 1–50 werden auf diesen Bereich geklemmt. Auf Neon behält der tägliche GC pro Sitzung höchstens graph_gc_hot_max_entries Turns (Default 50) — ein längerer Tail hätte danach nichts mehr zu lesen."

playbook:
  when_to_use: |
    Wird automatisch installiert sobald die Empty-Middleware-Roadmap
    Phase S+9.2 abgeschlossen ist. Operator-Touchpoints: setze
    ANTHROPIC_API_KEY (im Operator-Setup oder via legacy .env) damit
    Fact-Extraction + Topic-Detection aktiv werden. Ohne Key bleibt
    nur der ContextRetriever — KG-RAG funktioniert weiter.

permissions:
  memory:
    reads:
      - "/memories/sessions/*"
    writes: []
  graph:
    reads: []
    writes:
      - "Turn"
      - "Fact"
      - "MENTIONS"
      - "DERIVED_FROM"
  network:
    outbound:
      - "anthropic-api"
  filesystem:
    scratch: false

integrations:
  - id: "anthropic_api"
    kind: "http"
    target: "Anthropic Claude API (Haiku-Klassifikator für FactExtractor + TopicDetector)"
    auth_from: "anthropic_api_key"
    docs: "https://docs.anthropic.com/en/api/messages"
