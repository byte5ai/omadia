schema_version: "1"

identity:
  id: "@omadia/plugin-privacy-guard"
  name: "Privacy Guard"
  version: "0.15.0"
  kind: "tool"
  domain: "privacy.redact"
  description:
    en: "Keeps the raw results of data-source tools away from the language model. They stay on the server, the model works with an anonymised summary, and the final answer can be built from the real data. Masking the user's own messages is a separate setting, off by default. A turn in which the shield acted reports what was protected."
    de: "Hält die Rohergebnisse von Datenquellen-Tools vom Sprachmodell fern. Sie bleiben auf dem Server, das Modell arbeitet mit einer anonymisierten Zusammenfassung, und die endgültige Antwort kann aus den echten Daten entstehen. Das Maskieren der eigenen Nachrichten des Users ist eine eigene Einstellung, standardmäßig aus. Ein Zug, in dem der Schutz gegriffen hat, weist aus, was geschützt wurde."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "privacy"
    - "compliance"
    - "guardrails"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# ---------------------------------------------------------------------------
# Two setup fields (#361). The v4 Data-Plane Boundary itself stays
# configuration-free — generic over JSON shape and value statistics. The
# only toggles concern free-text user-prompt masking, DEFAULT OFF: flag-off
# is byte-identical to pre-#361 behavior. Flipping it on for a locale
# requires a green run of the committed validation harness (src/validation/)
# against its documented recall gates, posted to issue #361 first.
# `c1_detector_url` points at the optional GLiNER inference sidecar — a URL,
# not a credential, hence a plain non-secret field (secrets-only-in-Vault
# rule untouched).
# ---------------------------------------------------------------------------
setup:
  fields:
    - key: "mask_user_prompt"
      type: "enum"
      label:
        en: "Free-text user-prompt PII masking"
        de: "PII-Maskierung im Freitext-Prompt des Nutzers"
      help:
        en: "EXPERIMENTAL, default off. When on, PII spans detected in the user's own message (email, IBAN, phone, address, ID numbers, amounts and dates by the C0 regex baseline, plus the custom deny-list) are replaced by realistic pseudonyms in the turn's own model requests (main prompt, the user messages of the live chat history/priorTurns, ingested attachment text, live steering text, direct-line relay payloads, a verifier correction hint, and the fact-extraction/routing/excerpt passes that read this text); the real values are restored server-side, best-effort, in the final answer and in what is persisted (session log, knowledge graph, promoted memories). Tools run on the real values: before a data tool runs, whole pseudonyms in its input are put back (not dates and amounts), so a search for a masked term finds it, and whatever a tool returns to the model is masked again. A domain tool's question to its sub-agent and the agent's own memory and stored-process tools keep the pseudonyms; the sub-agent's own data-tool calls get the real values. A plugin tool that passes its input to a model through ctx.llm sends that model the real value. Failure-closed for those requests when the C0 baseline cannot run: if C0 detection or substitution fails, the request is blocked rather than sent unmasked, direct-line (#specialist) turns included. Names and free-form entities need the C1 transformer detector: set `c1_detector_url` (or the `PRIVACY_C1_DETECTOR_URL` env var) to enable it; unset, only the C0 regex baseline runs. If the configured C1 detector fails, the rest of the turn falls back to the C0 baseline (logged as degraded), so names only C1 detects reach the model unmasked. Whether this is on or off, the earlier answers a channel replays in priorTurns and recalled prior context are masked as well (identity shapes, the deny-list and C1; dates and amounts stay): an answer the shield rendered carries real values the model never saw. The inbound security screener and turn scoring get the text as the turn's model saw it. The memory jobs (turn scoring of stored text included) and, while this guard runs, the canvas composer mask stored and pre-turn text with their own scope (identity shapes, the deny-list and C1; dates and amounts stay), whether this is on or off. Other plugin ctx.llm calls, such as the plan runner, send their text as it is. Attached images reach the model unmasked either way. docs/security-architecture.md §6f lists all of it."
        de: "EXPERIMENTELL, standardmäßig aus. Wenn aktiv, werden PII-Spans in der eigenen Nachricht des Nutzers (E-Mail, IBAN, Telefon, Adresse, Ausweisnummern, Beträge und Datumsangaben über die C0-Regex-Baseline, dazu die eigene Deny-Liste) in den Modellanfragen des Turns durch realistische Pseudonyme ersetzt (Haupt-Prompt, die Nutzernachrichten des laufenden Chat-Verlaufs/priorTurns, eingelesener Anhangstext, Live-Steering-Text, Direct-Line-Relay-Payloads, ein Korrekturhinweis des Verifiers sowie die Fact-Extraction-, Routing- und Excerpt-Durchläufe, die diesen Text lesen); die echten Werte werden server-seitig, nach bestem Bemühen, in der finalen Antwort und in allem Gespeicherten wiederhergestellt (Session-Log, Knowledge Graph, übernommene Memories). Tools arbeiten mit den echten Werten: Bevor ein Daten-Tool läuft, werden ganze Pseudonyme in seiner Eingabe zurückübersetzt (nicht Datumsangaben und Beträge), sodass eine Suche nach einem maskierten Begriff ihn findet, und was ein Tool an das Modell zurückgibt, wird wieder maskiert. Die Frage eines Domain-Tools an seinen Sub-Agenten sowie die eigenen Memory- und Stored-Process-Tools des Agenten behalten die Pseudonyme; die Daten-Tool-Aufrufe des Sub-Agenten bekommen die echten Werte. Ein Plugin-Tool, das seine Eingabe über ctx.llm an ein Modell weitergibt, schickt diesem Modell den echten Wert. Für diese Anfragen gilt fail-closed, wenn die C0-Baseline nicht laufen kann: Schlägt die C0-Erkennung oder -Ersetzung fehl, wird die Anfrage blockiert statt unmaskiert gesendet, Direct-Line-Turns (#specialist) eingeschlossen. Namen und frei formulierte Entitäten brauchen den C1-Transformer-Detektor: Setze `c1_detector_url` (oder die Env-Variable `PRIVACY_C1_DETECTOR_URL`), um ihn zu aktivieren; ohne läuft nur die C0-Regex-Baseline. Fällt der konfigurierte C1-Detektor aus, fällt der Rest des Turns auf die C0-Baseline zurück (als degraded geloggt), sodass Namen, die nur C1 erkennt, unmaskiert beim Modell ankommen. Ob aktiv oder nicht: Die früheren Antworten, die ein Channel in priorTurns wiederholt, und abgerufener früherer Kontext werden ebenfalls maskiert (Identitätsmuster, die Deny-Liste und C1; Datumsangaben und Beträge bleiben): Eine vom Shield gerenderte Antwort enthält echte Werte, die das Modell nie gesehen hat. Der Security-Screener für eingehende Nachrichten und das Turn-Scoring bekommen den Text so, wie das Modell des Turns ihn sah. Die Memory-Jobs (inklusive Scoring gespeicherter Texte) und, solange dieser Guard läuft, der Canvas-Composer maskieren gespeicherten Text und Text vor dem Turn mit einem eigenen Scope (Identitätsmuster, die Deny-Liste und C1; Datumsangaben und Beträge bleiben), ob aktiv oder nicht. Andere Plugin-Aufrufe über ctx.llm, etwa der Plan-Runner, senden ihren Text unverändert. Angehängte Bilder erreichen das Modell in jedem Fall unmaskiert. docs/security-architecture.md §6f listet alles auf."
      required: false
      default: "off"
      enum:
        - value: "off"
          label:
            en: "Off — prompts pass unchanged (default)"
            de: "Aus — Prompts gehen unverändert durch (Standard)"
        - value: "on"
          label:
            en: "On — mask detected PII spans (C0 baseline)"
            de: "An — erkannte PII-Spans maskieren (C0-Baseline)"
    - key: "custom_terms"
      type: "string"
      label:
        en: "Custom deny-list terms"
        de: "Eigene Begriffe für die Deny-Liste"
      help:
        en: "Operator-defined literal terms that are ALWAYS masked in free-text prompts when prompt masking is on — project code names, customer names, internal identifiers. Separate entries with ';' or newlines; matched case-insensitively on word boundaries. Spans report type 'custom' in the privacy receipt and flow through the same fail-closed surrogate machinery as the built-in patterns. Prompts are untouched while mask_user_prompt is off. Regardless of that flag, the terms are ALSO applied to tool-error text (a tool's returned 'Error: …' string), to the earlier answers a channel replays as chat history (priorTurns) and to every evidence-judge request of the answer verifier (the restored claim plus knowledge-graph evidence) before it reaches a model."
        de: "Vom Operator festgelegte wörtliche Begriffe, die in Freitext-Prompts IMMER maskiert werden, wenn die Prompt-Maskierung aktiv ist — Projekt-Codenamen, Kundennamen, interne Kennungen. Trenne die Einträge mit ';' oder Zeilenumbrüchen; Treffer werden ohne Beachtung der Groß-/Kleinschreibung an Wortgrenzen erkannt. Spans erscheinen in der Privacy-Receipt mit dem Typ 'custom' und laufen durch dieselbe fail-closed-Surrogat-Mechanik wie die eingebauten Muster. Solange mask_user_prompt aus ist, bleiben Prompts unberührt. Unabhängig von diesem Flag werden die Begriffe AUCH auf Tool-Fehlertexte angewendet (der von einem Tool zurückgegebene 'Error: …'-String), auf die früheren Antworten, die ein Channel als Chat-Verlauf wiederholt (priorTurns), und auf jede Evidence-Judge-Anfrage des Antwort-Verifiers (der wiederhergestellte Claim plus Knowledge-Graph-Evidenz), bevor sie ein Modell erreicht."
      required: false
      default: ""
    - key: "custom_patterns"
      type: "string"
      # One regex per line — ';' is regex syntax, so newlines are the only
      # separator and the field must accept them (#1525).
      multiline: true
      label:
        en: "Custom deny-list patterns (advanced)"
        de: "Eigene Muster für die Deny-Liste (erweitert)"
      help:
        en: "Operator-defined regular expressions (one per NEWLINE — ';' is legal regex syntax and is not treated as a separator), each masked like a built-in pattern. Every pattern is vetted when the config changes: invalid syntax or a pattern that is already slow on the probe texts is REJECTED with a loud log line ('customPatternRejected') and is NOT active — check the middleware log after saving. A repeated group with an unbounded quantifier inside, such as (x+)+, is logged as a warning ('customPatternNestedQuantifier') and stays active. Patterns run in a worker thread with a time limit of 100 ms each: a match that runs longer is stopped, the turn is blocked rather than sent unmasked ('customPatternRuntimeExceeded'), and other requests are not held up. Prompts are untouched while mask_user_prompt is off. Regardless of that flag, the patterns are ALSO applied to tool-error text, to the earlier answers a channel replays as chat history (priorTurns) and to every evidence-judge request of the answer verifier (the restored claim plus knowledge-graph evidence) before it reaches a model."
        de: "Vom Operator festgelegte reguläre Ausdrücke (einer pro ZEILE — ';' ist gültige Regex-Syntax und wird nicht als Trennzeichen behandelt), die jeweils wie ein eingebautes Muster maskiert werden. Jedes Muster wird bei einer Konfigurationsänderung geprüft: Ungültige Syntax oder ein Muster, das schon auf den Probe-Texten zu langsam ist, wird mit einer deutlichen Log-Zeile ('customPatternRejected') ABGELEHNT und ist NICHT aktiv — prüfe nach dem Speichern das Middleware-Log. Eine wiederholte Gruppe mit einem unbegrenzten Quantor darin, etwa (x+)+, wird als Warnung geloggt ('customPatternNestedQuantifier') und bleibt aktiv. Die Muster laufen in einem Worker-Thread mit einem Zeitlimit von je 100 ms: Ein Treffer, der länger braucht, wird abgebrochen, der Turn wird blockiert statt unmaskiert gesendet ('customPatternRuntimeExceeded'), und andere Anfragen warten nicht darauf. Solange mask_user_prompt aus ist, bleiben Prompts unberührt. Unabhängig von diesem Flag werden die Muster AUCH auf Tool-Fehlertexte angewendet, auf die früheren Antworten, die ein Channel als Chat-Verlauf wiederholt (priorTurns), und auf jede Evidence-Judge-Anfrage des Antwort-Verifiers (der wiederhergestellte Claim plus Knowledge-Graph-Evidenz), bevor sie ein Modell erreicht."
      required: false
      default: ""
    - key: "non_personal_fields"
      type: "string"
      # One entry per line (also ';' or ','), #1556.
      multiline: true
      label:
        en: "Non-personal fields (sent in clear)"
        de: "Nicht personenbezogene Felder (im Klartext)"
      help:
        en: "Empty by default. Fields of tool results that hold no personal data and may reach the model in clear, so an answer can name them — for example a department, a job position or a product category. One entry per line: 'tool:field' for one tool (odoo_execute:department_id), '*:field' or just 'field' for every tool (*:job_id). A listed field clears only when every value is text or an Odoo pair [id, \"label\"]; the model then sees the label and can filter, sort and group on it. A value the identity detector flags (e-mail, IBAN, phone, address, ID number) keeps the field masked; person names are NOT detected here, so never list a field that can hold a person (partner_id, user_id, employee_id, a manager). A result built from several tools clears a field only when every one of them lists it. A bare 'field' or '*:field' applies to every tool that returns a column of that name, uploads and external MCP tools included — name the tool when you can. Link-key columns (__k_…) are refused. Each cleared field appears in the turn's privacy receipt as 'In clear by admin rule'."
        de: "Standardmäßig leer. Felder von Tool-Ergebnissen, die keine personenbezogenen Daten enthalten und das Modell im Klartext erreichen dürfen, damit eine Antwort sie nennen kann — etwa eine Abteilung, eine Position oder eine Produktkategorie. Ein Eintrag pro Zeile: 'tool:feld' für ein Tool (odoo_execute:department_id), '*:feld' oder nur 'feld' für jedes Tool (*:job_id). Ein gelistetes Feld wird nur dann freigegeben, wenn jeder Wert Text oder ein Odoo-Paar [id, \"Label\"] ist; das Modell sieht dann das Label und kann danach filtern, sortieren und gruppieren. Ein Wert, den der Identitätsdetektor erkennt (E-Mail, IBAN, Telefon, Adresse, Ausweisnummer), hält das Feld maskiert; Personennamen werden hier NICHT erkannt, liste also nie ein Feld, das eine Person enthalten kann (partner_id, user_id, employee_id, eine Führungskraft). Ein Ergebnis aus mehreren Tools gibt ein Feld nur frei, wenn jedes davon es listet. Ein bloßes 'feld' oder '*:feld' gilt für jedes Tool, das eine Spalte dieses Namens liefert, auch Uploads und externe MCP-Tools — nenne das Tool, wo es geht. Link-Key-Spalten (__k_…) werden abgelehnt. Jedes freigegebene Feld steht in der Privacy-Receipt des Turns als 'Per Admin-Regel im Klartext'."
      required: false
      default: ""
    - key: "c1_detector_url"
      type: "string"
      label:
        en: "C1 PII-detector sidecar URL"
        de: "URL des C1-PII-Detektor-Sidecars"
      help:
        en: "Base URL of the GLiNER PII-inference sidecar (middleware/sidecars/pii-detector) that detects person names and free-form addresses — the C1 tier on top of the C0 regex baseline. Under the docker-compose.pii-detector.yaml overlay: http://pii-detector:8812. Leave empty to run only the C0 regex baseline (no C1 call is attempted). The sidecar receives raw text: the turn's prompt text while mask_user_prompt is on and, regardless of that flag, tool-error text, the earlier answers a channel replays as chat history (priorTurns) and every evidence-judge request of the answer verifier (the restored claim plus knowledge-graph evidence). Keep it internal-network-only, never public. If the sidecar fails at runtime, C1 is off for the rest of that turn and each of these paths runs on the C0 baseline and the deny-list alone (logged as promptMaskDegraded or toolErrorRedactDegraded), so names only C1 detects reach the model unmasked; no text skips C0. Falls back to the PRIVACY_C1_DETECTOR_URL env var when empty."
        de: "Base-URL des GLiNER-PII-Inferenz-Sidecars (middleware/sidecars/pii-detector), das Personennamen und frei formulierte Adressen erkennt — die C1-Stufe über der C0-Regex-Baseline. Mit dem Overlay docker-compose.pii-detector.yaml: http://pii-detector:8812. Leer lassen, um nur die C0-Regex-Baseline laufen zu lassen (es wird kein C1-Aufruf versucht). Das Sidecar erhält Rohtext: den Prompt-Text des Turns, solange mask_user_prompt aktiv ist, und unabhängig von diesem Flag Tool-Fehlertexte, die früheren Antworten, die ein Channel als Chat-Verlauf wiederholt (priorTurns), und jede Evidence-Judge-Anfrage des Antwort-Verifiers (der wiederhergestellte Claim plus Knowledge-Graph-Evidenz). Halte es ausschließlich im internen Netz, niemals öffentlich. Fällt das Sidecar zur Laufzeit aus, ist C1 für den Rest dieses Turns aus und jeder dieser Pfade läuft nur mit der C0-Baseline und der Deny-Liste (geloggt als promptMaskDegraded oder toolErrorRedactDegraded), sodass Namen, die nur C1 erkennt, unmaskiert beim Modell ankommen; kein Text überspringt C0. Ist das Feld leer, wird auf die Env-Variable PRIVACY_C1_DETECTOR_URL zurückgegriffen."
      required: false
      default: ""

playbook:
  when_to_use: |
    Aktiviere dieses Plugin, damit die Modellanfragen eines Turns statt der
    Rohergebnisse von Datenquellen-Tools einen identitätsfreien Digest an
    Public-LLMs (Anthropic, OpenAI) schicken. Was trotzdem im Klartext
    rausgeht (intern-exempte Tools samt ihrer Fehlertexte, Operator-Bypass,
    Prompt-Text bei `mask_user_prompt: off`, Namen ohne oder bei
    ausgefallenem C1-Detektor, Bilder, Modellaufrufe außerhalb des
    Privacy-Handles), steht in docs/security-architecture.md §6f. Das Plugin
    published die `privacy.redact@1`-Capability; der Orchestrator-Hook ruft
    sie am Tool-Dispatch-Seam auf:
      - `internToolResultV4` interniert das rohe Tool-Ergebnis server-seitig
        hinter einer `datasetId` und gibt dem LLM nur einen identitätsfreien
        Digest.
      - `runV4Tool` führt vom LLM komponierte `v4_*`-Verben (sort, filter,
        rank, …) und das `v4_render_answer`-Directive in vertrauenswürdigem
        Server-Code aus. Die gerenderte Antwort meldet die Prosa des Modells
        getrennt von den Zeilen (`prose`, `''` ohne Prosa): Der
        Antwort-Verifier prüft nur sie, die Zellwerte sind Systemdaten.
        Ein Tabellen-Render gibt dem LLM nur Zeilenzahl und Spaltennamen
        zurück; der Canvas-Snapshot mit den echten Zellen geht als
        `canvasSentinel` am LLM vorbei (#1402).
      - `finalizeTurn` verwirft die Turn-Datasets und liefert eine PII-freie
        `PrivacyReceipt` für die UI-Disclosure.
      - `redactToolErrorText` redigiert zurückgegebene `Error:`-Texte
        irreversibel (`[masked:<typ>]`), bevor das Modell sie liest;
        `recordToolError` listet jeden behandelten Tool-Fehler unter
        `PrivacyReceipt.toolErrors`.
      - `projectVerifierText` maskiert jede Evidence-Judge-Anfrage des
        Antwort-Verifiers (wiederhergestellter Claim plus
        Knowledge-Graph-Evidenz) immer, auch bei `mask_user_prompt: off`,
        über die Platzhalter-Map des Turns: C0-Identitätsmuster, Deny-Liste,
        die vom Verifier benannten Identitätswerte und C1, falls konfiguriert.
        `countUnresolvedSurrogates` zählt Platzhalter, die ein Modell
        so umgeschrieben hat, dass die Wiederherstellung sie nicht mehr
        zurückbildet.
      - `maskReplayedAnswer` maskiert die früheren Antworten, die ein Channel
        als Verlauf (`priorTurns`) wiederholt, immer, auch bei
        `mask_user_prompt: off`: C0-Identitätsmuster, Deny-Liste und C1,
        falls konfiguriert, über die Platzhalter-Map des Turns, sodass die
        Antwort die echten Werte zurückbekommt. Eine server-gerenderte
        Antwort trägt Realwerte, die das Modell nie gesehen hat.
      - `openStoredTextScope` maskiert gespeicherten Text, den ein
        Memory-Job außerhalb eines Turns an sein Modell schickt
        (Topic-Cluster-Namen, Inkonsistenz-Erkennung, Teams-Themenerkennung),
        immer, auch bei `mask_user_prompt: off`: C0-Identitätsmuster,
        Deny-Liste und C1, falls konfiguriert, über eine eigene
        Platzhalter-Map pro Job-Lauf, die die echten Werte in die Ausgabe des
        Jobs zurückbringt.
    Die Receipt landet als Message-Metadata im Channel-Output (Teams + Web)
    und kann dort als Collapsed-/Expanded-Card gerendert werden.

    Versions-Paarung: Ein Orchestrator ab @omadia/plugin-api 1.20.0 erwartet
    vom Provider `redactToolErrorText`, `recordToolError`,
    `projectVerifierText` und `countUnresolvedSurrogates`. Dieses Plugin hat
    alle vier ab 0.6.0. Fehlen sie (bei einer älteren Kopie, die das
    gebündelte Plugin ersetzt, etwa per Upload mit
    `PLUGIN_ALLOW_BUNDLED_ID_OVERRIDE=1`, oder bei einem anderen
    `privacy.redact@1`-Provider), hält der Orchestrator zurückgegebene
    `Error:`-Texte vollständig zurück und loggt einmal pro Prozess
    `does not implement redactToolErrorText`. Jede Evidence-Judge-Anfrage des
    Antwort-Verifiers scheitert dann geschlossen (Claims bleiben ungeprüft),
    und die Prüfung auf ungelöste Platzhalter zählt 0, hält also eine zweite
    Antwort mit umgeschriebenen Platzhaltern nicht zurück.
    Ab @omadia/plugin-api 1.23.0 maskiert der Orchestrator wiederholte
    Antworten über `maskReplayedAnswer` (dieses Plugin ab 0.7.0). Fehlt es,
    maskiert er sie über `maskUserPrompt`, also nur bei
    `mask_user_prompt: on`.
    Ab @omadia/plugin-api 1.25.0 maskieren die Memory-Jobs außerhalb eines
    Turns über `openStoredTextScope` (dieses Plugin ab 0.8.0). Fehlt es,
    überspringen sie ihren Modellaufruf.
    Ab @omadia/plugin-api 1.33.0 liefert `runV4Tool` den Canvas-Snapshot eines
    Tabellen-Renders als `canvasSentinel` (dieses Plugin ab 0.10.0), nie im
    `resultText` (#1402). Ein neuerer Orchestrator mit einer älteren Kopie
    zieht einen eingebetteten Snapshot selbst aus dem `tool_result`. Ein
    älterer Orchestrator mit diesem Plugin leakt nichts, ignoriert aber
    `canvasSentinel`: die Canvas zeigt die Tabelle dann nicht (der Chat schon).
    Ab @omadia/plugin-api 1.46.0 bucht dieses Plugin (ab 0.12.0) Text aus
    früheren Unterhaltungen als `maskedContextSpans`, meldet den Zustand des
    C1-Namensdetektors (`nameDetector`, `nameDetectorStatus`) und zählt jeden
    maskierten Wert einmal. Ein älterer Orchestrator übergibt kein `origin`:
    wiederholte User-Nachrichten landen dann weiter in `maskedPromptSpans`.
    Mit einer älteren Kopie dieses Plugins liefert die Privacy-Posture
    `name_detector: null`, und die UI zeigt keinen Detektor-Zustand.
    Ab @omadia/plugin-api 1.47.0 gibt der Orchestrator Tools die echten Werte
    statt der Prompt-Pseudonyme, aber nur, wenn der Provider
    `restoreToolInputValues` und `remaskPromptValues` hat (dieses Plugin ab
    0.13.0, #1544). Fehlt es,
    bekommen Tools weiter die Pseudonyme. `fileExportAvailable`,
    `renderProvenance` und die Digest-Audience `public-api` sind optional: Ein
    älterer Provider bietet weiter immer Excel an und liefert keine Herkunft.
    Ab @omadia/plugin-api 1.48.0 meldet die Receipt `operatorClearedFields`
    (dieses Plugin ab 0.14.0, #1556): Felder, die `non_personal_fields`
    freigegeben hat. Ein älteres Plugin kennt die Einstellung nicht und maskiert
    sie weiter.
    Ab @omadia/plugin-api 1.49.0 liefert dieses Plugin (ab 0.15.0) die
    Grundlage für die Vorschläge auf /admin/privacy-fields:
    `takeFieldObservations`, `vetFieldSample`, `classifyModelsSchemaOnly`,
    `maskedFieldPreview`. Fehlen sie, bleibt die Seite leer; maskiert wird wie
    zuvor.

# ---------------------------------------------------------------------------
# Permissions. Server-side compute plus ONE deliberate network target
# (#361): the operator-configured on-prem C1 PII-inference sidecar. No
# graph, no memory.
# ---------------------------------------------------------------------------
permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      # #361 — the GLiNER PII-detector sidecar (`c1_detector_url` setup
      # field / PRIVACY_C1_DETECTOR_URL). Operator-configured, on-prem,
      # internal-network-only. It receives raw text: prompt text while
      # mask_user_prompt is on and, regardless of that flag, tool-error text,
      # the answers a channel replays as chat history and every
      # evidence-judge request of the answer verifier (the restored claim
      # plus knowledge-graph evidence). That makes it a
      # deliberate, security-reviewable exception to the plugin's
      # previously pure-compute posture.
      - "pii-detector-sidecar"
  filesystem:
    scratch: false
  # Slice 2 — schema-level PII classification. The plugin asks a cheap Haiku
  # model which fields of an interned tool result carry personal identity
  # data, given ONLY the schema (tool name + field names + types, never a
  # value). Drives leak detection / the honest receipt; never the masking
  # itself (deny-by-default stays the safety net). Host pays — no plugin key.
  llm:
    models_allowed:
      - "claude-haiku-4-5"
    calls_per_invocation: 1000
    max_tokens_per_call: 512

provides:
  - "privacy.redact@1"
requires: []
