schema_version: "1"

identity:
  id: "@omadia/diagrams"
  name: "Diagrams"
  version: "0.2.3"
  kind: "tool"
  domain: "visualization.diagrams"
  description:
    en: "Turns Mermaid, Graphviz, PlantUML and Vega-Lite descriptions into diagram images and returns a link that can be shared."
    de: "Wandelt Beschreibungen in Mermaid, Graphviz, PlantUML und Vega-Lite in Diagramm-Bilder um und liefert einen Link, der weitergegeben werden kann."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "visualization"
    - "infrastructure"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

# Diagrams opt-in uses the MemoryStore service to auto-lookup
# `/memories/_brand/logo.md` when a spec references `brand://logo` but the
# LLM forgot to pass `brand_logo_storage_key`. The feature degrades cleanly
# when the service is absent (the LLM must pass the key itself), so it is an
# optional capability, not a dependency on one provider plugin (#1973,
# ADR-0053): `@omadia/memory` and `@omadia/memory-postgres` both provide it,
# and only one of them is ever active. Resolved at first use.
#
# #1961 (ADR-0177): renders are filed under the id of the turn that made them,
# read from the kernel's `turnContext` service. Optional: without it every
# render lands in one no-turn bucket (the pre-fix behaviour).
optional_requires:
  - "memoryStore@1"
  - "turnContext@1"

lifecycle:
  entry: "dist/plugin.js"

setup:
  fields:
    - key: "kroki_base_url"
      type: "url"
      label:
        en: "Kroki Base URL"
        de: "Kroki-Base-URL"
      help:
        en: "Endpoint of the Kroki installation, e.g. https://kroki.io"
        de: "Endpoint der Kroki-Installation, z.B. https://kroki.io"
      required: true

    - key: "public_base_url"
      type: "url"
      label:
        en: "Public middleware base URL"
        de: "Öffentliche Middleware-Base-URL"
      help:
        en: "Used in signed image URLs, e.g. https://bot.omadia.ai"
        de: "Wird in signierten Bild-URLs verwendet, z.B. https://bot.omadia.ai"
      required: true

    - key: "tigris_endpoint"
      type: "url"
      label:
        en: "Tigris/S3 Endpoint"
        de: "Tigris/S3-Endpoint"
      required: true

    - key: "tigris_bucket"
      type: "string"
      label:
        en: "Tigris/S3 bucket name"
        de: "Tigris/S3 Bucket-Name"
      required: true

    - key: "tenant_id"
      type: "string"
      label:
        en: "Tenant prefix for keys"
        de: "Tenant-Prefix für Keys"
      required: false
      default: "default"

    - key: "signed_url_ttl_sec"
      type: "integer"
      label:
        en: "Signed URL TTL (seconds)"
        de: "Signed-URL-TTL (Sekunden)"
      required: false
      default: 3600
      min: 1

    - key: "max_source_bytes"
      type: "integer"
      label:
        en: "Max. diagram source size (bytes)"
        de: "Max. Diagram-Source-Größe (Bytes)"
      required: false
      default: 1000000

    - key: "max_png_bytes"
      type: "integer"
      label:
        en: "Max. PNG size (bytes)"
        de: "Max. PNG-Größe (Bytes)"
      required: false
      default: 900000

    - key: "diagram_url_secret"
      type: "secret"
      label:
        en: "HMAC secret for signed URLs"
        de: "HMAC-Secret für signierte URLs"
      required: true

    - key: "aws_access_key_id"
      type: "secret"
      label:
        en: "Tigris Access Key ID"
        de: "Tigris Access Key ID"
      required: true

    - key: "aws_secret_access_key"
      type: "secret"
      label:
        en: "Tigris Secret Access Key"
        de: "Tigris Secret Access Key"
      required: true

playbook:
  when_to_use: |
    Diagramm-Rendering on-demand: Flow/Sequenz/State/Gantt (Mermaid), dichte
    gerichtete Graphen (Graphviz), klassische UML (PlantUML), quantitative
    Charts aus Fach-Agent-Daten (Vega-Lite). Die Antwort enthält eine
    signierte PNG-URL, die Teams-/Web-UI inline als Card rendert.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false
  # Signed PNG URLs (`/diagrams/dl/<key>?exp=&sig=`) are opened by channel
  # users without an operator session; the route verifies the HMAC itself.
  # Served session-less only once the operator grants the prefix.
  public_paths:
    - "/diagrams/dl"

integrations: []
