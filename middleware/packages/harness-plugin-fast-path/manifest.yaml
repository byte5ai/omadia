schema_version: "1"

identity:
  id: "@omadia/fast-path"
  name: "Fast Path"
  version: "0.5.0"
  kind: "extension"
  domain: "omadia.fast-path"
  description:
    en: "Answers simple data lookups in seconds instead of a full agent turn — in the chat, Teams, Telegram, Slack, the API and the canvas. One quick check decides whether a single read query answers the message; then the query runs directly and the result is shown as a table. Everything else goes to the agent as before."
    de: "Beantwortet einfache Datenabfragen in Sekunden statt mit einem vollen Agenten-Zug: im Chat, in Teams, Telegram, Slack, über die API und im Canvas. Eine schnelle Prüfung entscheidet, ob eine einzige Leseabfrage die Nachricht beantwortet; dann läuft die Abfrage direkt und das Ergebnis erscheint als Tabelle. Alles andere geht wie bisher an den Agenten."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "infrastructure"
    - "orchestration"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# The triage prompt reaches a model BEFORE the turn has a privacy handle, so
# with a Privacy Shield running it is masked through the guard's stored-text
# scope (#1540, failure-closed). Optional: without a guard the triage sends
# the text as written (no shield ⇒ nothing to mask), and activation must not
# wait on it.
optional_requires:
  - "privacyRedact@1"
  # A typed decision model (TypeSafe Jev via @omadia/decision-jev, …) gates
  # every turn BEFORE the triage model calls — model yes/no, then the data
  # source — and may run a learned plan without the planner. Resolved per
  # turn; without it the LLM router runs as before.
  - "decisionModel@1"

# The learned plan store persists through ctx.memory, which the kernel builds
# ONCE at activation from the published `memoryStore` service. Without an
# activation edge this plugin could come up before the memory provider and
# run with `ctx.memory` undefined for the whole process ("kept in-process
# only", live v410). `requires` orders the provider first; every deployment
# runs one (@omadia/memory or @omadia/memory-postgres).
requires:
  - "memoryStore@^1"

# fastPath@1 — consumed by @omadia/orchestrator (the chat-agent wrapper for
# every non-canvas channel) and @omadia/ui-orchestrator (the canvas). Both
# resolve it lazily per turn; without it every turn runs the agent unchanged.
provides:
  - "fastPath@1"

setup:
  fields:
    - key: "fast_path_tools"
      type: "string"
      label:
        en: "Fast-path tools"
        de: "Tools für den Schnellpfad"
      help:
        en: "Comma-separated read tools a fast model may plan ONE deterministic query for (with an optional date/equality post-filter). When a message is answered that way, the query runs directly and the rows go only to the user — no agent turn, no model ever sees them; any miss falls back to the full agent. Used: the listed tools with a built-in planner spec (today: odoo_query), every read tool another plugin offers the agent (planned from its own input schema — write tools never; see \"Fast path for all plugin read tools\"), and read tools learned from verified agent answers. Empty → fast path off on every channel: nothing is learned, nothing is used."
        de: "Kommagetrennte Lese-Tools, für die ein schnelles Modell EINE deterministische Abfrage planen darf (optional mit Datums-/Gleichheits-Nachfilter). Wird eine Nachricht so beantwortet, läuft die Abfrage direkt und die Zeilen gehen nur an den Nutzer — kein Agenten-Zug, kein Modell sieht sie; jeder Fehlschlag fällt auf den vollen Agenten zurück. Genutzt werden: die gelisteten Tools mit eingebauter Planer-Spezifikation (aktuell: odoo_query), jedes Lese-Tool, das ein anderes Plugin dem Agenten anbietet (geplant aus dessen eigenem Eingabeschema — Schreib-Tools nie; siehe „Schnellpfad für alle Plugin-Lese-Tools“), sowie Lese-Tools, die aus geprüften Agenten-Antworten gelernt wurden. Leer → Schnellpfad auf allen Kanälen aus: nichts wird gelernt, nichts genutzt."
      required: false
      default: "odoo_query"
    - key: "fast_path_generic_tools"
      type: "boolean"
      label:
        en: "Fast path for all plugin read tools"
        de: "Schnellpfad für alle Plugin-Lese-Tools"
      help:
        en: "On: besides the listed tools, every read tool another plugin offers the agent can be planned from its own input schema (write tools never). Off: only the listed tools with a built-in planner spec and read tools learned from verified agent answers are used — choose this to keep the fast path to an explicit allow-list. Default: on."
        de: "An: Neben den gelisteten Tools kann jedes Lese-Tool, das ein anderes Plugin dem Agenten anbietet, aus dessen eigenem Eingabeschema geplant werden (Schreib-Tools nie). Aus: Genutzt werden nur die gelisteten Tools mit eingebauter Planer-Spezifikation und aus geprüften Agenten-Antworten gelernte Lese-Tools — so bleibt der Schnellpfad auf eine explizite Allow-Liste beschränkt. Standard: an."
      required: false
      default: "true"
    - key: "fast_path_agent_tools"
      type: "string"
      label:
        en: "Fast path for sub-agent read tools"
        de: "Schnellpfad für Lese-Tools von Sub-Agenten"
      help:
        en: "Comma-separated tool names or agent plugin ids (e.g. @omadia/agent-github-issue-tracker), or * for all. A sub-agent's own read tools are normally only reached through its model loop; listed ones may be planned and run directly by the fast path — rows without any model call. Only while the agent itself is offered; write tools never. Default: empty (none)."
        de: "Kommagetrennt: Tool-Namen oder Agent-Plugin-IDs (z. B. @omadia/agent-github-issue-tracker), oder * für alle. Die eigenen Lese-Tools eines Sub-Agenten erreicht man sonst nur über dessen Modellschleife; gelistete darf der Schnellpfad direkt planen und ausführen — Zeilen ohne jeden Modellaufruf. Nur solange der Agent selbst angeboten wird; Schreib-Tools nie. Standard: leer (keine)."
      required: false
      default: ""
    - key: "fast_path_channels"
      type: "string"
      label:
        en: "Fast-path channels"
        de: "Kanäle für den Schnellpfad"
      help:
        en: "Comma-separated channels the fast path runs on: canvas, web (browser chat), http, teams, telegram, slack, … Empty or \"all\" → every channel; \"none\" → none. On every channel but the canvas each message costs one quick model check before the agent, which then reuses its simple/complex verdict for model routing."
        de: "Kommagetrennte Kanäle, auf denen der Schnellpfad läuft: canvas, web (Browser-Chat), http, teams, telegram, slack, … Leer oder „all“ → alle Kanäle; „none“ → keiner. Auf allen Kanälen außer dem Canvas kostet jede Nachricht eine schnelle Modellprüfung vor dem Agenten, der deren Einstufung einfach/komplex dann fürs Modell-Routing übernimmt."
      required: false
      default: "all"
    - key: "fast_path_timezone"
      type: "string"
      label:
        en: "Fast-path time zone"
        de: "Zeitzone für den Schnellpfad"
      help:
        en: "IANA time zone (e.g. Europe/Berlin) in which relative dates of a fast-path or refresh query — {today}, {today-30d} — resolve to a calendar date, so \"overdue\" means overdue in your business day, not the server clock's. Invalid or empty → Europe/Berlin."
        de: "IANA-Zeitzone (z. B. Europe/Berlin), in der relative Datumsangaben einer Schnellpfad- oder Aktualisierungsabfrage — {today}, {today-30d} — zu einem Kalenderdatum aufgelöst werden, damit „überfällig“ nach Ihrem Geschäftstag gilt und nicht nach der Serveruhr. Ungültig oder leer → Europe/Berlin."
      required: false
      default: "Europe/Berlin"
    - key: "fast_path_answer_cache"
      type: "boolean"
      label:
        en: "Fast-path answer cache"
        de: "Antwort-Cache für den Schnellpfad"
      help:
        en: "When on, a question that repeats one the fast path already answered (same wording, other names or values) runs its query directly, without any model call. Only names and values the question itself contains are swapped; anything unclear goes through the normal check. Stores no personal data (checked by the Privacy Shield; without it nothing is stored). Default: on."
        de: "Wenn an, läuft eine Frage, die eine bereits vom Schnellpfad beantwortete wiederholt (gleicher Wortlaut, andere Namen oder Werte), direkt ohne Modellaufruf. Getauscht werden nur Namen und Werte, die die Frage selbst nennt; alles Unklare geht durch die normale Prüfung. Speichert keine personenbezogenen Daten (geprüft vom Privacy Shield; ohne ihn wird nichts gespeichert). Standard: an."
      required: false
      default: "true"

    - key: "fast_path_decision_model"
      type: "boolean"
      label:
        en: "Use the decision model"
        de: "Entscheidungsmodell nutzen"
      help:
        en: "When a decision-model plugin is installed (e.g. TypeSafe Jev), it decides every message BEFORE any model call: does it need a language model (→ the agent, right away) or does one data source answer it (plugin, API or MCP tool)? Only then is the query planned. Faster and cheaper than the model check; any failure falls back to it. Without such a plugin this switch does nothing. Default: on."
        de: "Ist ein Entscheidungsmodell-Plugin installiert (z. B. TypeSafe Jev), entscheidet es jede Nachricht VOR jedem Modellaufruf: Braucht sie ein Sprachmodell (→ sofort der Agent) oder beantwortet sie eine Datenquelle (Plugin-, API- oder MCP-Tool)? Erst dann wird die Abfrage geplant. Schneller und günstiger als die Modellprüfung; bei jedem Fehler übernimmt diese. Ohne ein solches Plugin wirkt der Schalter nicht. Standard: an."
      required: false
      default: "true"
    - key: "fast_path_decision_direct_plans"
      type: "boolean"
      label:
        en: "Run learned queries without a model"
        de: "Gelernte Abfragen ohne Modell ausführen"
      help:
        en: "With a decision model: a message that asks exactly what a learned query (no names or values in it) already answers runs that query directly — no planning model call. Only while a Privacy Shield runs, and only messages without numbers and without personal data it detects; anything else is planned as usual. Default: on."
        de: "Mit Entscheidungsmodell: Eine Nachricht, die genau das fragt, was eine gelernte Abfrage (ohne Namen oder Werte) schon beantwortet, führt diese direkt aus — ohne planenden Modellaufruf. Nur bei laufendem Privacy Shield und nur Nachrichten ohne Zahlen und ohne von ihm erkannte personenbezogene Daten; alles andere wird wie gewohnt geplant. Standard: an."
      required: false
      default: "true"
    - key: "fast_path_decision_canvas"
      type: "boolean"
      label:
        en: "Decision model builds the canvas view"
        de: "Entscheidungsmodell baut die Canvas-Ansicht"
      help:
        en: "With a decision model, on the canvas: a question it routes to data gets its view straight from the planned query, and a simple message (greeting, confirmation) a plain answer view — both without the composing model call. It also decides whether planned rows show as a table or as a bar, line or pie chart. Anything unsure or slow composes as before. Default: on."
        de: "Mit Entscheidungsmodell, auf dem Canvas: Eine Frage, die es zu Daten routet, bekommt ihre Ansicht direkt aus der geplanten Abfrage, eine einfache Nachricht (Gruß, Bestätigung) eine schlichte Antwortansicht — beides ohne den komponierenden Modellaufruf. Außerdem entscheidet es, ob geplante Zeilen als Tabelle oder als Balken-, Linien- oder Kreisdiagramm erscheinen. Alles Unsichere oder Langsame wird wie bisher komponiert. Standard: an."
      required: false
      default: "true"

permissions:
  filesystem:
    scratch: false
  # The tenant-wide learned plan store (`fastpath/plans.json`: literal-stripped
  # tool inputs + stripped example questions — never row data) in this
  # plugin's own Agent-independent tree (ctx.memory.pluginWide =
  # /memories/agents/@omadia/fast-path/), ONE file for every Agent.
  memory:
    reads: ["agent:@omadia/fast-path:*"]
    writes: ["agent:@omadia/fast-path:*"]
  # One triage call per non-canvas turn on the cheapest tier of the active
  # provider (class:fast). The calls counter is scoped to the plugin context,
  # which for an extension lives as long as the activation — hence the high
  # cap (same reasoning as @omadia/ui-orchestrator).
  llm:
    models_allowed:
      - "class:fast"
    calls_per_invocation: 1000000
    max_tokens_per_call: 1024
