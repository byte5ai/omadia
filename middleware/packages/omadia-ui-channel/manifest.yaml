schema_version: "1"

identity:
  id: "@omadia/ui-channel"
  name: "Omadia UI Channel"
  version: "0.1.0"
  kind: "channel"
  domain: "omadia.ui"
  description:
    en: "Connects the omadia canvas interface to the chat. It tells a client what the server supports and holds a live connection open, so a view already updates while the answer is still being written."
    de: "Verbindet die omadia-Canvas-Oberfläche mit dem Chat. Es teilt einem Client mit, was der Server unterstützt, und hält eine laufende Verbindung offen, damit sich eine Ansicht schon aktualisiert, während die Antwort noch entsteht."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  categories:
    - "infrastructure"
    - "channel"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

channel:
  transport:
    # Canvas transport is a WebSocket at /omadia-ui/canvas (registered via
    # CoreApi.registerWebSocket — kernel-authenticated upgrade). The HTTP route
    # below is the pre-connect discovery endpoint a client reads first.
    kind: "websocket"
    routes:
      - path: "/omadia-ui/info"
        method: "GET"
    verify_signature: false
  capabilities:
    - "text"
    - "canvas"
  adapters:
    - "text"
  dispatch_service: "canvasChatAgent"
  canvas_protocol_version: "1.0"

permissions:
  filesystem:
    scratch: false
  # per-user canvas registry (multi-canvas sidebar sync) — plugin-scoped store
  memory:
    reads: ["agent:@omadia/ui-channel:*"]
    writes: ["agent:@omadia/ui-channel:*"]
