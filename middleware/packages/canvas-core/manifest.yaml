schema_version: "1"

# ===========================================================================
# Canvas Core — the canonical canvas protocol as a generic (extension) plugin.
#
# Single source of truth for the omadia-canvas-protocol: the canvas-tree /
# surface-event JSON schemas, the precompiled validator, and the TypeScript
# types. Agent plugins that PRODUCE canvas trees (e.g. @omadia/agent-x-studio)
# `depends_on` this plugin and `requires: ["canvasValidator@^1"]` to validate
# against one contract instead of vendoring their own schema copy. The
# orchestrator and the desktop/mobile renderers consume the same package.
# ===========================================================================

identity:
  id: "@omadia/canvas-core"
  kind: "extension"
  domain: "core.canvas"
  name: "Canvas Core Protocol"
  version: "0.2.0"
  description:
    en: "Defines the canvas format omadia uses to draw interactive views, and validates it. Every plugin that produces or renders a canvas follows it."
    de: "Legt das Canvas-Format fest, mit dem omadia interaktive Ansichten zeichnet, und prüft es. Jedes Plugin, das eine Canvas erzeugt oder darstellt, richtet sich danach."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  categories:
    - "infrastructure"
    - "canvas"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

# #1499 — multi-instance (the default). The plugin publishes one stateless
# validator service (`canvasValidator@1`, pure functions); attaching it to a
# second orchestrator creates no second instance and shares no state, so there
# is no reason to refuse it. The previous `multi_instance: false` had no
# justification and logged a manifest warning on every boot and ingest.
privacy_class: "strict"

lifecycle:
  entry: "dist/src/plugin.js"

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false

playbook:
  when_to_use: |
    Wird von Canvas-Produzenten (Agent-Plugins wie @omadia/agent-x-studio)
    und vom omadia-ui-orchestrator konsumiert. Konsumenten deklarieren
    `depends_on: ["@omadia/canvas-core"]` + `requires: ["canvasValidator@^1"]`
    und holen den Validator via `ctx.services.get('canvasValidator')`.
    Kein Operator-Setup nötig — aktiviert sich ohne Konfiguration.

provides:
  - "canvasValidator@1"
requires: []
