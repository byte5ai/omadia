schema_version: "1"

identity:
  id: "@omadia/transcription-adapter-openai"
  name: "Transkription (OpenAI)"
  version: "0.1.0"
  kind: "extension"
  domain: "core.transcription"
  description:
    en: "Turns speech into text with OpenAI's transcription models, either from a recording or live while someone is speaking. Only one transcription provider can be active."
    de: "Wandelt Sprache in Text um, mit den Transkriptionsmodellen von OpenAI, entweder aus einer Aufnahme oder live während des Sprechens. Aktiv sein darf immer nur ein Transkriptions-Anbieter."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  categories:
    - "infrastructure"
    - "ml"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

setup:
  fields:
    - key: "api_key"
      type: "secret"
      label:
        en: "API key"
        de: "API-Key"
      help:
        en: "Bearer token for the transcription endpoint. Stored in the vault, never in installed.json. Without a key the plugin activates but publishes no service (consumers degrade to no-transcription paths). PRIVACY NOTICE: with an active provider, raw audio (meetings, recordings, voice notes) leaves the installation for the configured endpoint — the operator explicitly consents by installing. The secret type also prevents automatic installation through the built-in catalog."
        de: "Bearer-Token für den Transkriptions-Endpoint. Liegt im Vault, nie in installed.json. Ohne Key aktiviert sich das Plugin, published aber keinen Service (Konsumenten degraden auf no-transcription-Pfade). ACHTUNG Datenschutz: Mit aktivem Provider verlassen Roh-Audiodaten (Meetings, Aufnahmen, Sprachnotizen) die Installation Richtung des konfigurierten Endpoints — der Operator willigt mit der Installation explizit ein. Der secret-Typ verhindert zusätzlich die automatische Installation durch den Built-in-Katalog."
      required: false
    - key: "base_url"
      type: "string"
      label:
        en: "Base URL"
        de: "Base-URL"
      help:
        en: "Base URL of the endpoint, with or without '/v1'. Default: https://api.openai.com"
        de: "Basis-URL des Endpoints, mit oder ohne '/v1'. Default: https://api.openai.com"
      required: false
      default: "https://api.openai.com"
    - key: "batch_model"
      type: "string"
      label:
        en: "Batch model"
        de: "Batch-Modell"
      help:
        en: "Model for transcribeFile (finished recordings). Default: gpt-transcribe ($0.0045/min)."
        de: "Modell für transcribeFile (fertige Aufnahmen). Default: gpt-transcribe ($0.0045/min)."
      required: false
      default: "gpt-transcribe"
    - key: "realtime_model"
      type: "string"
      label:
        en: "Realtime model"
        de: "Realtime-Modell"
      help:
        en: "Model for transcribeStream (live audio). Default: gpt-live-transcribe ($0.017/min). The realtime path is additionally gated behind the env variable TRANSCRIPTION_REALTIME_EXPERIMENTAL=1 as long as there is no production consumer (#584 WS S to follow)."
        de: "Modell für transcribeStream (Live-Audio). Default: gpt-live-transcribe ($0.017/min). Der Realtime-Pfad ist zusätzlich hinter der Env-Variable TRANSCRIPTION_REALTIME_EXPERIMENTAL=1 gegated, solange es keinen produktiven Konsumenten gibt (#584 WS S folgt)."
      required: false
      default: "gpt-live-transcribe"
    - key: "realtime_url"
      type: "string"
      label:
        en: "Realtime URL"
        de: "Realtime-URL"
      help:
        en: "WebSocket URL of the Realtime API. Default: wss://api.openai.com/v1/realtime"
        de: "WebSocket-URL der Realtime-API. Default: wss://api.openai.com/v1/realtime"
      required: false
      default: "wss://api.openai.com/v1/realtime"
    - key: "timeout_ms"
      type: "integer"
      label:
        en: "Batch timeout (ms)"
        de: "Batch-Timeout (ms)"
      help:
        en: "Hard cancel per transcribeFile() call. Default 300000 (5 min — audio uploads take longer than text calls)."
        de: "Hard-cancel pro transcribeFile()-Call. Default 300000 (5 min — Audio-Uploads brauchen länger als Text-Calls)."
      required: false
      default: 300000
    - key: "max_call_minutes"
      type: "integer"
      label:
        en: "Max. audio minutes per call"
        de: "Max. Audio-Minuten pro Call"
      help:
        en: "Cost brake per call. Realtime streams are cut off hard at the cap (wall-clock backstop in the guardrail). Batch files cannot be measured before transcription — there the cap is advisory, but the duration actually billed always counts against the agent quota. Default 240."
        de: "Kostenbremse pro Aufruf. Realtime-Streams werden am Cap hart geschnitten (Wall-Clock-Backstop im Guardrail). Batch-Dateien lassen sich vor der Transkription nicht vermessen — dort wirkt der Cap advisory, die tatsächlich abgerechnete Dauer zählt aber immer gegen die Agent-Quota. Default 240."
      required: false
      default: 240
    - key: "agent_quota_minutes"
      type: "integer"
      label:
        en: "Minute quota per agent"
        de: "Minuten-Quota pro Agent"
      help:
        en: "Cost brake: transcription minute allowance per agent (in-memory counter, reset on process restart — deliberately a brake, not a billing ledger). Default 600."
        de: "Kostenbremse: Transkriptionsminuten-Kontingent pro Agent (In-Memory-Zähler, reset bei Prozess-Neustart — bewusst Bremse, kein Abrechnungs-Ledger). Default 600."
      required: false
      default: 600

playbook:
  when_to_use: |
    Erster transcription@1-Provider (#584). Batch-Transkription (Workstream I:
    "transcribe this recording") läuft sofort; der Realtime-Pfad für
    Live-Meetings (Workstream S, AudioMeetingSource) ist experimentell und
    braucht TRANSCRIPTION_REALTIME_EXPERIMENTAL=1. Vor der Installation
    prüfen, ob bereits ein anderer transcription@1-Provider aktiv ist — zwei
    aktive Provider wirft ctx.services.provide beim zweiten. Datenschutz: Roh-
    Audio geht an den konfigurierten externen Endpoint; Transkripte gelten
    downstream als untrusted Input und laufen durch die Privacy-Choke-Points.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      - "openai-transcription"
  filesystem:
    scratch: false

integrations:
  - id: "openai_transcription_batch"
    kind: "http"
    target: "POST {base_url}/v1/audio/transcriptions"
    auth_from: "api_key"
    docs: "https://developers.openai.com/api/docs/guides/speech-to-text"
  - id: "openai_transcription_realtime"
    kind: "websocket"
    target: "{realtime_url} (session.type=transcription)"
    auth_from: "api_key"
    docs: "https://developers.openai.com/api/docs/guides/realtime-transcription"

provides:
  - "transcription@1"
requires: []
optional_requires:
  - "turnContext@1"
