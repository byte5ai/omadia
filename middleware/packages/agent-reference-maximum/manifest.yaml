schema_version: "1"

identity:
  id: "@omadia/agent-reference-maximum"
  kind: "agent"
  domain: "reference"
  name: "Reference (Builder Pattern Source)"
  version: "0.3.2"
  description:
    en: "A runnable reference agent that shows every available plugin pattern in one place. The Builder agent uses it as its pattern source, and on its own it works as a personal knowledge companion."
    de: "Ein lauffähiger Beispiel-Agent, der alle verfügbaren Plugin-Muster an einer Stelle zeigt. Der Builder-Agent nutzt ihn als Vorlage, und für sich genommen dient er als persönlicher Wissensbegleiter."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  categories:
    - "reference"

# OB-29-0 marker: signal to the Plugin-Catalog endpoint that this plugin
# must not be visible in the Operator-Store. The BuilderAgent may still
# read it as a pattern source (lives in BUILDER_REFERENCE_ESSENTIALS).
is_reference_only: true

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

depends_on:
  - "@omadia/memory"

lifecycle:
  entry: "dist/plugin.js"
  hooks:
    onActivate: true
    onDeactivate: true
  uninstall_policy:
    entities: keep
    memory: delete
    secrets: delete

setup:
  fields:
    - key: "digest_cron"
      type: "string"
      label: "Wöchentlicher Digest-Cron"
      help: "Cron-Expression (croner-Syntax) für den Wochen-Digest."
      required: false
      default: "0 8 * * MON"

models:
  fallback_allowed: true

capabilities:
  - id: "add_note"
    description: "Schreibt eine Notiz in den Plugin-Memory-Scope und gibt ein note-card Smart-Card-Attachment zurück."
    input_schema:
      type: "object"
      required: ["body"]
      properties:
        title: { type: "string" }
        body: { type: "string" }
    output_schema:
      type: "object"
      properties:
        noteId: { type: "string" }
        createdAt: { type: "string" }
    side_effects: "write"
    idempotent: false
    timeout_ms: 5000

  - id: "analyze_url"
    description: "Lässt eine URL vom SEO-Analyst-Agenten (@omadia/agent-seo-analyst) prüfen und speichert dessen Antwort als Notiz im Plugin-Memory-Scope. Nutze das Tool, wenn der Nutzer eine konkrete URL analysieren lassen will — die Analyse macht der Sub-Agent, nicht dieses Plugin."
    input_schema:
      type: "object"
      required: ["url"]
      properties:
        url: { type: "string", format: "uri" }
    output_schema:
      type: "object"
      properties:
        noteId: { type: "string" }
        delegateAgent: { type: "string" }
    side_effects: "write"
    idempotent: false
    timeout_ms: 60000

  - id: "smart_extract_entities"
    description: "Extrahiert Personen und Topics aus einem Notiz-Text per LLM-Call. Nutze das Tool, wenn ein Text Personen oder Themen nur implizit nennt: `add_note` extrahiert selbst nur deterministisch per Regex und erkennt deshalb \"John hat das gut gemacht\" ohne `Person:`-Prefix nicht. Bei explizit markierten Entities ist der Aufruf unnötig."
    input_schema:
      type: "object"
      required: ["body"]
      properties:
        body: { type: "string" }
    output_schema:
      type: "object"
      properties:
        ok: { type: "boolean" }
        entities: { type: "array" }
    side_effects: "read"
    idempotent: false
    timeout_ms: 30000

  - id: "query_notes_by_person"
    description: "Sucht gespeicherte Notizen, die einen Personen-Namen erwähnen — case-insensitive Substring über Body und Title. Nutze das Tool, wenn der Nutzer nach Notizen zu einer Person fragt. Bei Mehrdeutigkeit (≥2 Matches) rät das Tool nicht, sondern meldet die Treffer als `_pendingUserChoice`. Ruft der Orchestrator das Tool selbst auf und interniert der Privacy Shield das Ergebnis nicht, beendet er den Turn und rendert eine Auswahl-Smart-Card. Kommt keine Karte, frag den Nutzer, welche Notiz er meint — rate nie."
    input_schema:
      type: "object"
      required: ["personName"]
      properties:
        personName: { type: "string" }
    output_schema:
      type: "object"
      properties:
        ok: { type: "boolean" }
    side_effects: "read"
    idempotent: true
    timeout_ms: 5000

playbook:
  when_to_use: |
    Reference-only Plugin: gedacht als Pattern-Quelle für den BuilderAgent.
    Sekundärnutzen: User können es als Personal-Knowledge-Companion nutzen,
    sobald `is_reference_only` im Catalog-Filter abgeschaltet wird.
  not_for:
    - "Produktions-Use ohne explizite Aktivierung"
    - "Sensible Daten — Notes liegen unverschlüsselt im Memory-Scope"

permissions:
  memory:
    reads: ["agent:@omadia/agent-reference-maximum:*"]
    writes: ["agent:@omadia/agent-reference-maximum:*"]
  graph:
    reads: ["Turn", "Person", "Company", "Fact"]
    writes: []
    # OB-29-2 — Plugin-owned entity namespace. ctx.knowledgeGraph.ingestEntities
    # accepts only these system-strings; anything else throws
    # KgEntityNamespaceError. 'odoo' and 'confluence' are reserved (host-only)
    # and are stripped here by the manifestLoader if anyone lists them.
    entity_systems:
      - "personal-notes"
  network:
    outbound: []
  filesystem:
    scratch: true
  # OB-29-1 — Sub-Agent-Delegation-Pattern: this plugin may call only the
  # seo-analyst. Every other target (or absence of subAgents permissions
  # entirely) makes ctx.subAgent.ask throw SubAgentPermissionDeniedError.
  subAgents:
    calls:
      - "@omadia/agent-seo-analyst"
    calls_per_invocation: 3
  # OB-29-3 — LLM-Service-Pattern: ctx.llm.complete() may only issue Haiku
  # calls (cost-controlled), max 2 calls per tool-handler lifetime,
  # max 1024 output tokens per call. Models outside the list throw
  # LlmModelNotAllowedError.
  llm:
    models_allowed:
      - "claude-haiku-4-5*"
    calls_per_invocation: 2
    max_tokens_per_call: 1024

integrations: []

skills:
  - id: "reference_expert_system"
    kind: "prompt_partial"
    path: "skills/reference-expert.md"
    description: "Rolle und Verhalten des Reference-Plugins gegenüber dem Modell."
    shareable: false
  - id: "disambiguate_policy"
    kind: "prompt_partial"
    path: "skills/disambiguate-policy.md"
    description: "Wie das Modell reagiert, wenn ein Tool dieses Plugins Mehrdeutigkeit zurückmeldet: Smart-Card oder Rückfrage, nie raten."
    shareable: true

jobs:
  - name: "weekly-digest"
    schedule:
      cron: "0 8 * * MON"
    timeoutMs: 30000
    overlap: skip
