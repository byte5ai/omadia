schema_version: "1"

# Capability plugin of kind `integration` (spec 2042 §5.10, ADR-0014) and
# the Plugin Builder's pattern source. Tools are registered via ctx.tools
# (registerTools.ts), exactly like the Builder boilerplates. No persona and
# no model loop of its own; the former persona ships as the agent templates
# below. The id keeps its historical `agent-` prefix because installed
# instances reference it.
identity:
  id: "@omadia/agent-reference-maximum"
  kind: "integration"
  domain: "reference"
  name: "Reference (Builder Pattern Source)"
  version: "0.4.0"
  description:
    en: "A runnable reference plugin that shows every available plugin pattern in one place. The Plugin Builder uses it as its pattern source; its note tools also work as a personal knowledge store."
    de: "Ein lauffähiges Beispiel-Plugin, das alle verfügbaren Plugin-Muster an einer Stelle zeigt. Der Plugin Builder nutzt es als Vorlage; seine Notiz-Tools taugen auch als persönlicher Wissensspeicher."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  categories:
    - "reference"

# OB-29-0 marker: signal to the Plugin-Catalog endpoint that this plugin
# must not be visible in the Operator-Store. The Plugin Builder may still
# read it as a pattern source (lives in BUILDER_REFERENCE_ESSENTIALS).
is_reference_only: true

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

depends_on:
  - "@omadia/memory"

lifecycle:
  entry: "dist/plugin.js"
  hooks:
    onActivate: true
    onDeactivate: true
  uninstall_policy:
    entities: keep
    memory: delete
    secrets: delete

setup:
  fields:
    - key: "digest_cron"
      type: "string"
      label:
        en: "Weekly digest cron"
        de: "Wöchentlicher Digest-Cron"
      help:
        en: "Cron expression (croner syntax) for the weekly digest."
        de: "Cron-Expression (croner-Syntax) für den Wochen-Digest."
      required: false
      default: "0 8 * * MON"

models:
  fallback_allowed: true

capabilities:
  - id: "add_note"
    description: "Schreibt eine Notiz in den Plugin-Memory-Scope und gibt ein note-card Smart-Card-Attachment zurück."
    input_schema:
      type: "object"
      required: ["body"]
      properties:
        title: { type: "string" }
        body: { type: "string" }
    output_schema:
      type: "object"
      properties:
        noteId: { type: "string" }
        createdAt: { type: "string" }
    side_effects: "write"
    idempotent: false
    timeout_ms: 5000

  - id: "smart_extract_entities"
    description: "Extrahiert Personen und Topics aus einem Notiz-Text per LLM-Call. Nutze das Tool, wenn ein Text Personen oder Themen nur implizit nennt: `add_note` extrahiert selbst nur deterministisch per Regex und erkennt deshalb \"John hat das gut gemacht\" ohne `Person:`-Prefix nicht. Bei explizit markierten Entities ist der Aufruf unnötig."
    input_schema:
      type: "object"
      required: ["body"]
      properties:
        body: { type: "string" }
    output_schema:
      type: "object"
      properties:
        ok: { type: "boolean" }
        entities: { type: "array" }
    side_effects: "read"
    idempotent: false
    timeout_ms: 30000

  - id: "query_notes_by_person"
    description: "Sucht gespeicherte Notizen, die einen Personen-Namen erwähnen — case-insensitive Substring über Body und Title. Nutze das Tool, wenn der Nutzer nach Notizen zu einer Person fragt. Bei Mehrdeutigkeit (≥2 Matches) rät das Tool nicht, sondern meldet die Treffer als `_pendingUserChoice`. Ruft der Agent das Tool selbst auf und interniert der Privacy Shield das Ergebnis nicht, beendet er den Turn und rendert eine Auswahl-Smart-Card. Kommt keine Karte, frag den Nutzer, welche Notiz er meint — rate nie."
    input_schema:
      type: "object"
      required: ["personName"]
      properties:
        personName: { type: "string" }
    output_schema:
      type: "object"
      properties:
        ok: { type: "boolean" }
    side_effects: "read"
    idempotent: true
    timeout_ms: 5000

playbook:
  when_to_use: |
    Reference-only Plugin: gedacht als Pattern-Quelle für den Plugin Builder.
    Sekundärnutzen: Notizen speichern und nach Personen wiederfinden, sobald
    `is_reference_only` im Catalog-Filter abgeschaltet wird.
  not_for:
    - "Produktions-Use ohne explizite Aktivierung"
    - "Sensible Daten — Notes liegen unverschlüsselt im Memory-Scope"

permissions:
  memory:
    reads: ["agent:@omadia/agent-reference-maximum:*"]
    writes: ["agent:@omadia/agent-reference-maximum:*"]
  graph:
    reads: ["Turn", "Person", "Company", "Fact"]
    writes: []
    # OB-29-2 — Plugin-owned entity namespace. ctx.knowledgeGraph.ingestEntities
    # accepts only these system-strings; anything else throws
    # KgEntityNamespaceError. 'odoo' and 'confluence' are reserved (host-only)
    # and are stripped here by the manifestLoader if anyone lists them.
    entity_systems:
      - "personal-notes"
  network:
    outbound: []
  filesystem:
    scratch: true
  # OB-29-3 — LLM-Service-Pattern: ctx.llm.complete() may only issue Haiku
  # calls (cost-controlled), max 2 calls per tool-handler lifetime,
  # max 1024 output tokens per call. Models outside the list throw
  # LlmModelNotAllowedError.
  llm:
    models_allowed:
      - "claude-haiku-4-5*"
    calls_per_invocation: 2
    max_tokens_per_call: 1024

integrations: []

# Inactive presets (spec 2042 §5.10): the former persona of this package.
# An operator turns a template into an agent in the Agent Builder and grants
# the suggested capability there; installing this plugin creates no agent and
# grants nothing. One template per language.
agent_templates:
  - id: "knowledge-companion"
    name: "Knowledge Companion"
    short_description: "Keeps short notes and finds them again by person."
    long_description: >-
      A personal knowledge companion without credentials: it stores notes,
      links the people and topics they mention in the knowledge graph and
      finds notes about a person again.
    language: "en"
    instructions: |
      You are a personal knowledge companion. People write notes, you store
      them and give them back later.

      - When someone says "remember this", "note" or "save": call `add_note`
        with the content right away. Ask only when the content is empty.
      - When a text names people or topics only implicitly, use
        `smart_extract_entities`; `add_note` only recognises explicitly
        marked entities.
      - When someone asks for notes about a person, use
        `query_notes_by_person`. If it reports several matches as a choice,
        never pick one yourself: wait for the choice card, or ask which note
        is meant when no card appears. A click on an option arrives as a new
        message with the chosen value.
      - When someone refers to a note you do not have, say so honestly
        instead of guessing.
      - Tone: short and factual, no small talk.
    quality:
      sycophancy: "low"
      boundaries:
        presets:
          - "no-speculation"
        custom:
          - "Quote stored notes faithfully; never paraphrase them into something they do not say."
          - "Keep tool plumbing (memory reads, graph lookups) out of the answer text."
    capabilities:
      - "@omadia/agent-reference-maximum"

  - id: "knowledge-companion-de"
    name: "Wissensbegleiter"
    short_description: "Speichert kurze Notizen und findet sie nach Personen wieder."
    long_description: >-
      Ein persönlicher Wissensbegleiter ohne Zugangsdaten: Er speichert
      Notizen, verknüpft die darin genannten Personen und Themen im
      Wissensgraphen und findet Notizen zu einer Person wieder.
    language: "de"
    instructions: |
      Du bist ein persönlicher Wissensbegleiter. Nutzer schreiben Notizen, du
      speicherst sie und gibst sie später zurück.

      - Sagt jemand „merk dir das“, „notiere“ oder „speichere“: Ruf `add_note`
        mit dem Inhalt direkt auf. Frag nur nach, wenn der Inhalt leer ist.
      - Nennt ein Text Personen oder Themen nur implizit, nutze
        `smart_extract_entities`; `add_note` erkennt nur ausdrücklich
        markierte Entitäten.
      - Fragt jemand nach Notizen zu einer Person, nutze
        `query_notes_by_person`. Meldet das Tool mehrere Treffer als Auswahl,
        wähle nie selbst: Warte auf die Auswahlkarte oder frag, welche Notiz
        gemeint ist, wenn keine Karte kommt. Ein Klick auf eine Option kommt
        als neue Nachricht mit dem gewählten Wert zurück.
      - Bezieht sich jemand auf eine Notiz, die du nicht hast, sag das
        ehrlich, statt zu raten.
      - Tonfall: kurz, sachlich, kein Smalltalk.
    quality:
      sycophancy: "low"
      boundaries:
        presets:
          - "no-speculation"
        custom:
          - "Gib gespeicherte Notizen getreu wieder; formuliere sie nie zu etwas um, was sie nicht sagen."
          - "Halte die Tool-Mechanik (Memory-Zugriffe, Graph-Abfragen) aus dem Antworttext heraus."
    capabilities:
      - "@omadia/agent-reference-maximum"

jobs:
  - name: "weekly-digest"
    schedule:
      cron: "0 8 * * MON"
    timeoutMs: 30000
    overlap: skip
