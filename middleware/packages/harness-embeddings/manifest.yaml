schema_version: "1"

identity:
  id: "@omadia/embeddings"
  name: "Embeddings"
  version: "0.1.0"
  kind: "extension"
  domain: "core.embeddings"
  description:
    en: "Computes embeddings through a local Ollama server, which is what semantic search, the knowledge graph and topic detection need. Use it instead of the OpenAI compatible adapter, only one of the two can be active."
    de: "Rechnet Texte über einen lokalen Ollama-Server in Zahlenvektoren um, die Grundlage für semantische Suche, Wissensgraph und Themenerkennung. Nutze es alternativ zum OpenAI-kompatiblen Adapter, aktiv sein darf immer nur eines von beiden."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "Proprietary"
  categories:
    - "infrastructure"
    - "ml"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

lifecycle:
  entry: "dist/plugin.js"

# ---------------------------------------------------------------------------
# S+9.1 Sub-Commit 1 — additive scaffold only.
#   - no `provides:` → the plugin does not yet announce a capability;
#     the kernel-side `embeddingClient` bridge stays active.
#   - no `requires:`.
#   - activate() is a no-op (logs only) — no service-construction, no
#     consumer wiring.
#
# Sub-Commit 2a moves `services/embeddingClient.ts` (interface + factory +
# withConcurrencyLimit + cosineSimilarity) into the plugin. Sub-Commit 2b
# adds `provides: ["embeddingClient@1"]`, builds the client in activate()
# and removes the pre-S+8.5 bridge in `src/index.ts`. From then on
# consumer manifests (KG, later orchestrator-extras) must carry the
# capability-ref in their `requires:` — otherwise the S+8.5 capability
# hardening fires and drops them from the eligible set.
# ---------------------------------------------------------------------------

setup:
  fields:
    - key: "ollama_base_url"
      type: "string"
      label:
        en: "Ollama base URL"
        de: "Ollama Base-URL"
      help:
        en: "Base URL of the Ollama sidecar (no trailing slash). Leave empty → the plugin activates but builds no client (consumers degrade to in-memory / no-op)."
        de: "Base-URL des Ollama-Sidecars (kein trailing slash). Leer lassen → Plugin aktiviert sich, baut aber keinen Client (Konsumenten degraden auf in-memory / no-op)."
      required: false
      default: ""
    - key: "ollama_model"
      type: "string"
      label:
        en: "Embedding model"
        de: "Embedding-Modell"
      help:
        en: "Model name the sidecar pulls. Default: nomic-embed-text."
        de: "Modellname, den der Sidecar pullt. Standard: nomic-embed-text."
      required: false
      default: "nomic-embed-text"
    - key: "ollama_timeout_ms"
      type: "integer"
      label:
        en: "Embed timeout (ms)"
        de: "Embed-Timeout (ms)"
      help:
        en: "Hard cancel per embed() call. A cold start of nomic-embed-text on Fly takes 2-5s; 30000 is generous."
        de: "Hard-cancel pro embed()-Call. Cold-start nomic-embed-text auf Fly braucht 2-5s; 30000 ist großzügig."
      required: false
      default: 30000
    - key: "embedding_dimensions"
      type: "integer"
      label:
        en: "Model vector dimensions"
        de: "Vektor-Dimensionen des Modells"
      help:
        en: "Published as provider metadata; the Knowledge Graph compares it with the model the existing corpus was embedded with (#440). Deliberately WITHOUT a default: for known models (nomic-embed-text 768, mxbai-embed-large 1024, bge-m3 1024, all-minilm 384) the value is derived from the model. Only needed for an unknown model — if it is missing there, the plugin publishes the client without metadata and the gate lets writes through unchanged, as before #440. If the value contradicts the known model, the plugin publishes nothing at all."
        de: "Wird als Provider-Metadatum veröffentlicht; der Knowledge-Graph vergleicht es mit dem Modell, mit dem der bestehende Korpus embedded wurde (#440). Bewusst OHNE Default: für bekannte Modelle (nomic-embed-text 768, mxbai-embed-large 1024, bge-m3 1024, all-minilm 384) wird der Wert aus dem Modell abgeleitet. Nur bei einem unbekannten Modell nötig — fehlt er dort, published das Plugin den Client ohne Metadaten und das Gate lässt Writes wie vor #440 unverändert zu. Widerspricht der Wert dem bekannten Modell, published das Plugin gar nichts."
      required: false
    - key: "max_concurrent"
      type: "integer"
      label:
        en: "Max. concurrent embeddings"
        de: "Max. parallele Embeddings"
      help:
        en: "FIFO limit against Ollama CPU bursts (boot replay + backfill + live ingest). Default 4. 0 or negative → no limit."
        de: "FIFO-Limit gegen Ollama-CPU-Burst (boot replay + backfill + live ingest). Default 4. 0 oder negativ → kein Limit."
      required: false
      default: 4

playbook:
  when_to_use: |
    Wird vom Knowledge-Graph-Plugin (`requires: embeddingClient@^1`) und
    späteren Tool-Sets (Orchestrator-Extras: ContextRetriever +
    TopicDetector + FactExtractor) konsumiert. Operator-Touchpoint:
    `ollama_base_url` muss im Setup-Feld stehen ODER auf .env-Werte
    bootstrappen — sonst published das Plugin keinen Client und
    Konsumenten fallen graceful auf no-embeddings-Pfade zurück.

permissions:
  memory:
    reads: []
    writes: []
  graph:
    reads: []
    writes: []
  network:
    outbound:
      - "ollama-sidecar"
  filesystem:
    scratch: false

integrations:
  - id: "ollama_sidecar"
    kind: "http"
    target: "Ollama-Sidecar /api/embeddings (Standard-Modell: nomic-embed-text)"
    auth_from: ""
    docs: "https://github.com/ollama/ollama/blob/main/docs/api.md#generate-embeddings"

# S+9.1 Sub-Commit 2b: capability lifetime flipped from kernel-bridge to
# plugin-owned. Consumers that read `ctx.services.get('embeddingClient')`
# must declare `requires: ["embeddingClient@^1"]` in their manifest, or
# the S+8.5 capability-resolver leaves them out of the eligible set.
provides:
  - "embeddingClient@1"
requires: []
