# Desktop apps — builds the native omadia installer (the "demo apps") for
# macOS, Windows and Linux and attaches the signed installers to the GitHub
# Release that triggered the run.
#
# This is the no-Docker, one-click installer in `desktop/`: an Electron shell
# that bundles + supervises the existing middleware kernel and web-ui plus a
# bundled native PostgreSQL 17 + pgvector. See desktop/README.md and
# docs/plans/native-installer-plan.md.
#
# Runs separately from release.yml (the GHCR image pipeline) so a desktop build
# failure never blocks the container release, and vice-versa.
#
# Signing is FAIL-SOFT — without the secrets below the build still produces
# installers, just unsigned (ad-hoc on macOS):
#   macOS (proven for omadia-ui, same _HIGH5 secret names so the values drop in):
#     APPLE_CERTIFICATE_P12_BASE64_HIGH5, APPLE_CERTIFICATE_PASSWORD_HIGH5,
#     APPLE_ASC_KEY_ID_HIGH5, APPLE_ASC_ISSUER_ID_HIGH5,
#     APPLE_ASC_KEY_P8_BASE64_HIGH5, APPLE_TEAM_ID_HIGH5
#   Windows — Azure Trusted Signing (preferred; no hardware token, works on
#   GitHub-hosted runners). Since 2023-06-01 the CA/Browser Forum requires every
#   code-signing key (OV *and* EV) to live in an HSM, so a plain .pfx in a secret
#   is no longer obtainable for newly issued certificates:
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#     AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_CERT_PROFILE
#   Windows — legacy Authenticode p12 (only certs issued before 2023-06-01):
#     WINDOWS_CSC_LINK_BASE64, WINDOWS_CSC_KEY_PASSWORD

name: Desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build + attach to (e.g. v0.3.0)'
        required: true
        type: string
      notarize:
        # Notarization needs an in-effect Apple Developer Program agreement. When
        # one lapses, notarytool returns "HTTP 403: A required agreement is
        # missing or has expired" and the whole build fails — even though signing
        # itself is fine. Set false to validate the signing path meanwhile.
        # NEVER ship a release built with this off: unnotarized apps are blocked
        # by Gatekeeper on first launch.
        description: 'Notarize with Apple (false = validate signing only, NOT releasable)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  # Called in-run from auto-release.yml: a GITHUB_TOKEN-created release does NOT
  # fire the `release` event, so the apps must be built from within the same run
  # that cut the release (same pattern as publish-images.yml).
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build + attach to'
        required: true
        type: string
      require_release:
        # auto-release.yml has just cut the release for this tag, so a missing
        # one there means something went wrong -- not the build-validation case
        # that the soft "skipping upload" path exists for. Without this, a
        # release the upload steps cannot find would produce a GREEN run that
        # attached nothing: the silent-failure shape this repo's own beta
        # findings keep hitting.
        description: 'Fail instead of skipping when the tag has no GitHub Release'
        required: false
        default: false
        type: boolean
    outputs:
      mac_feed_published:
        # Gates the release promotion in auto-release.yml (#928). Deliberately
        # keyed on the FEED, not on this workflow's overall result: `build` runs
        # fail-fast:false, so a broken Windows leg fails the workflow while the
        # macOS feed publishes perfectly well. Keying on the workflow result
        # would withhold the promotion and leave the macOS update channel dead
        # until the next fully green release -- the exact outcome OM-69 reports.
        #
        # True means: the merged feed is attached AND every installer it
        # references is attached too. The second half is not redundant -- see the
        # assertion in the mac-update-feed upload step for why a valid feed alone
        # proves nothing about the assets.
        description: 'true when latest-mac.yml and the installers it references are attached'
        value: ${{ jobs.mac-update-feed.outputs.published }}

concurrency:
  group: desktop-apps-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write # upload installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships BOTH architectures, each built on a runner of its own
          # architecture. That is mandatory, not a preference: the omadia runtime
          # rides along as unpacked extraResources (native node modules + the
          # embedded Postgres engine) which electron-builder copies verbatim and
          # cannot arch-split, so an x64 bundle produced on an arm64 host would
          # contain arm64 binaries and crash on Intel.
          - os: macos-latest
            args: --mac --arm64
          # macos-13 was retired in Dec 2025; macos-26-intel is the current
          # x86_64 image. GitHub drops x86_64 entirely in August 2027, at which
          # point this entry has to go (or move to a self-hosted Intel runner).
          - os: macos-26-intel
            args: --mac --x64
          # Linux + Windows each provision a PG17 pgvector for their embedded
          # engine below (apt pgdg / MSVC nmake build) before staging. x64 only.
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    # Hard cap so a stuck native build can never run for hours. Measured on a
    # full signed+notarized run: linux 5 min, windows 9 min, macOS arm64 21 min,
    # macOS Intel >30 min — the Intel runner is materially slower and blew the
    # previous 30-minute cap mid-signing, which then took the update-feed merge
    # down with it. 60 keeps the runaway protection with real headroom, and
    # notarization wait times are set by Apple, not by us.
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Undefined for the `release` and `workflow_dispatch` triggers, so those
      # keep the historical soft-skip behaviour; only workflow_call opts in.
      REQUIRE_RELEASE: ${{ inputs.require_release && 'true' || 'false' }}
      # 'yes' unless a workflow_dispatch explicitly passed notarize=false. The
      # `release` event and workflow_call leave the input undefined, so they
      # always notarize — a release can never accidentally skip it.
      NOTARIZE: ${{ inputs.notarize != 'false' && 'yes' || 'no' }}
      # Must match Supervisor.KERNEL_PORT in desktop/src/supervisor.ts — the
      # web-ui bakes this kernel URL into its routes-manifest at BUILD time, so
      # it cannot be a per-launch random port.
      KERNEL_URL: http://127.0.0.1:8769
      # macOS signing (hoisted so they're addressable in step-level `if:`).
      APPLE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64_HIGH5 }}
      APPLE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD_HIGH5 }}
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID_HIGH5 }}
      APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID_HIGH5 }}
      APPLE_ASC_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_KEY_P8_BASE64_HIGH5 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID_HIGH5 }}
      # Windows signing — PREFERRED path: Azure Trusted Signing (rebranded Azure
      # Artifact Signing). electron-builder 25.1.8 supports it natively via
      # `win.azureSignOptions` and installs the required TrustedSigning
      # PowerShell module itself. Credentials are read by Azure's
      # EnvironmentCredential, so the three AZURE_* names below are fixed by
      # Azure, not chosen by us.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      # Non-secret account coordinates, kept as secrets purely for consistency.
      AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_CERT_PROFILE: ${{ secrets.AZURE_SIGN_CERT_PROFILE }}
      # Windows signing — LEGACY path: a .p12/.pfx in a secret. Only works with
      # certificates issued BEFORE 2023-06-01. Since then the CA/Browser Forum
      # requires every code-signing private key (OV *and* EV) to live in a
      # FIPS 140-2 L2 / EAL4+ HSM, so no newly issued certificate can be exported
      # to a file at all. Kept for existing certs; prefer Azure above.
      WINDOWS_CSC_LINK_BASE64: ${{ secrets.WINDOWS_CSC_LINK_BASE64 }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # node-gyp's bundled gyp imports Python's `distutils`, removed in Python
      # 3.12. The macOS/Windows runners default to 3.12+ (Ubuntu still ships
      # 3.11), so pin 3.11 everywhere to keep native rebuilds working.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # @electron/rebuild pulls @electron/node-gyp as a git+ssh GitHub dependency.
      # Runners have no SSH key, so rewrite git+ssh GitHub URLs to https (public
      # repo, no auth) before any npm install/ci, or those installs fail.
      - name: Allow git-https for git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      # --- build the omadia runtime the installer bundles -------------------
      # `--ignore-scripts` is load-bearing, not hardening theatre — the same
      # reason it is load-bearing in the root Dockerfile. better-sqlite3 v13
      # ships N-API prebuilds for every platform (including win32-x64) inside
      # its own tarball and declares `gypfile: false` to say "do not build me".
      # npm ignores that field and synthesises `install: node-gyp rebuild`
      # anyway, purely because a `binding.gyp` is present in the package.
      # macOS/Linux merely waste time on that pointless compile; Windows has no
      # Visual Studio node-gyp can find, so it fails outright and the Windows
      # installer silently stopped shipping (last `.exe`: v0.63.0). Skipping
      # scripts lets the bundled prebuild be used. argon2 + esbuild are the only
      # middleware packages with a real install script, so rebuild those two by
      # hand (fsevents is macOS-only and resolves as an optional dependency).
      - name: Build middleware kernel
        working-directory: middleware
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild argon2 esbuild
          npm run build

      # No MIDDLEWARE_URL at build time: the /bot-api and /p proxies are route
      # handlers that read it per request (web-ui/app/_lib/middlewareProxy.ts).
      # The desktop supervisor injects the real kernel URL when it spawns the
      # standalone server (desktop/src/supervisor.ts, uiEnv).
      - name: Build web-ui
        working-directory: web-ui
        run: |
          npm ci
          npm run build

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # desktop/package-lock.json mirrors package.json's version field, so write
      # the release tag AFTER npm ci validated the lockfile and BEFORE the build
      # and pack steps consume that version for metadata and artifact names.
      - name: Set desktop app version from release tag
        working-directory: desktop
        run: node scripts/set-desktop-version.mjs "$TAG"

      # Verify the middleware's native modules load under Electron's Node (the
      # kernel runs via ELECTRON_RUN_AS_NODE). All three are N-API → ABI-stable
      # across node/electron, so their shipped binaries already work and NONE of
      # them needs an Electron-ABI rebuild.
      #
      # better-sqlite3 needed one back when it was v12 and non-N-API. Since v13
      # it ships N-API prebuilds in its own tarball (`prebuilds/<platform>-<arch>.node`)
      # and — decisively — its loader in `lib/binding.js` checks that `prebuilds/`
      # directory FIRST and only falls back to `build/Release/` if nothing is
      # there. So an electron-rebuild artefact would be written and then never
      # loaded. The old step was therefore a no-op that could only fail: upstream
      # publishes no GitHub release assets for v13, so `prebuild-install` always
      # missed and fell through to a source rebuild needing a full toolchain.
      #
      # The verification below is the real gate and is deliberately kept: if the
      # N-API/ABI-stability assumption is ever wrong, this fails here instead of
      # crashing the kernel at boot in the shipped app.
      - name: Verify native modules load under the Electron ABI
        shell: bash
        run: |
          ELECTRON_RUN_AS_NODE=1 ./desktop/node_modules/.bin/electron -e \
            "require('./middleware/node_modules/better-sqlite3'); require('./middleware/node_modules/argon2'); require('./middleware/node_modules/sharp'); console.log('better-sqlite3 + argon2 + sharp load under Electron ABI OK')"

      - name: Build desktop (main + preload + renderer)
        working-directory: desktop
        run: npm run build

      # The bundled embedded Postgres (@embedded-postgres) is a minimal server with
      # no pgvector. Build/grab pgvector for PG17 and copy vector.* into the engine
      # so stage-runtime bundles it. PG extensions are ABI-stable within a major
      # version, so a PG17 vector.dylib from Homebrew loads in the embedded PG17.
      - name: Provision pgvector into the embedded Postgres (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install pgvector
          PV="$(brew --prefix pgvector)"
          # Must follow the RUNNER's architecture, not a fixed value: the Intel
          # runner installs an x86_64 pgvector and needs it staged into the
          # darwin-x64 engine. Homebrew also lives at a different prefix per arch
          # (/usr/local vs /opt/homebrew), which `brew --prefix` already handles.
          ARCH="$(node -p 'process.arch')"      # arm64 | x64
          NATIVE="desktop/node_modules/@embedded-postgres/darwin-$ARCH/native"
          if [ ! -d "$(dirname "$NATIVE")" ]; then
            echo "FAIL: @embedded-postgres/darwin-$ARCH is not installed — the" >&2
            echo "      engine for this architecture is missing, so the staged app" >&2
            echo "      would ship without a database." >&2
            exit 1
          fi
          mkdir -p "$NATIVE/lib/postgresql" "$NATIVE/share/postgresql/extension"
          cp "$PV/lib/postgresql@17/vector.dylib" "$NATIVE/lib/postgresql/vector.dylib"
          cp "$PV/share/postgresql@17/extension/vector.control" "$NATIVE/share/postgresql/extension/"
          cp "$PV"/share/postgresql@17/extension/vector--*.sql "$NATIVE/share/postgresql/extension/"
          # Prove the dylib really is this runner's architecture — a silently
          # mismatched vector.dylib would only fail at CREATE EXTENSION, inside
          # the shipped app, on a user's machine.
          file "$NATIVE/lib/postgresql/vector.dylib"
          EXPECT="$([ "$ARCH" = arm64 ] && echo arm64 || echo x86_64)"
          if ! file "$NATIVE/lib/postgresql/vector.dylib" | grep -q "$EXPECT"; then
            echo "FAIL: vector.dylib is not $EXPECT — wrong architecture staged." >&2
            exit 1
          fi
          echo "✓ pgvector staged into the embedded PG17 engine (darwin-$ARCH, $EXPECT)"

      # Linux: the PostgreSQL APT repo (pgdg) ships a prebuilt postgresql-17-pgvector.
      # A PG17 vector.so loads in the embedded PG17 (extensions are ABI-stable within
      # a major). Unix layout: module in lib/postgresql/, control+SQL in
      # share/postgresql/extension/ (same as macOS).
      - name: Provision pgvector into the embedded Postgres (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17-pgvector
          NATIVE="desktop/node_modules/@embedded-postgres/linux-x64/native"
          mkdir -p "$NATIVE/lib/postgresql" "$NATIVE/share/postgresql/extension"
          cp /usr/lib/postgresql/17/lib/vector.so "$NATIVE/lib/postgresql/vector.so"
          cp /usr/share/postgresql/17/extension/vector.control "$NATIVE/share/postgresql/extension/"
          cp /usr/share/postgresql/17/extension/vector--*.sql "$NATIVE/share/postgresql/extension/"
          echo "✓ pgvector staged into the embedded PG17 engine (linux-x64)"

      # Windows: no prebuilt pgvector exists, so build vector.dll from source with
      # MSVC against a full PG17 (Chocolatey ships headers + lib; the embedded
      # engine is a minimal dist with neither). A PG17 build loads in the embedded
      # PG17. Windows layout is FLAT: module in lib/, control+SQL in share/extension/.
      - name: Set up MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Provision pgvector into the embedded Postgres (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install postgresql17 --params "/Password:postgres" -y --no-progress
          $pgroot = "C:\Program Files\PostgreSQL\17"
          if (-not (Test-Path $pgroot)) {
            $pgroot = (Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory |
              Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          $env:PGROOT = $pgroot
          Write-Host "PGROOT=$pgroot"
          git clone --depth 1 --branch v0.8.3 https://github.com/pgvector/pgvector.git "$env:RUNNER_TEMP\pgvector"
          Push-Location "$env:RUNNER_TEMP\pgvector"
          nmake /NOLOGO /F Makefile.win
          if ($LASTEXITCODE -ne 0) { throw "pgvector nmake build failed ($LASTEXITCODE)" }
          Pop-Location
          $native = "desktop\node_modules\@embedded-postgres\windows-x64\native"
          New-Item -ItemType Directory -Force -Path "$native\share\extension" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\pgvector\vector.dll" "$native\lib\vector.dll" -Force
          Copy-Item "$env:RUNNER_TEMP\pgvector\vector.control" "$native\share\extension\" -Force
          Copy-Item "$env:RUNNER_TEMP\pgvector\sql\vector--*.sql" "$native\share\extension\" -Force
          Write-Host "✓ pgvector built + staged into the embedded PG17 engine (windows-x64)"

      - name: Stage runtime (middleware + web-ui + Postgres → desktop/runtime)
        working-directory: desktop
        run: npm run stage

      # --- macOS signing + notarization (proven for omadia-ui) --------------
      - name: Prepare Apple signing (optional — needs _HIGH5 secrets)
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_P12_BASE64 != '' }}
        run: |
          printf '%s' "$APPLE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc-key.p8"

          # This keychain is the ONLY one used for signing — see the CSC_KEYCHAIN
          # note below for why electron-builder is deliberately kept from making
          # its own. It must exist before afterPack, which signs the nested
          # extraResources binaries and runs ahead of electron-builder's own sign
          # step. Put it on the search list so both find the key.
          KEYCHAIN="$RUNNER_TEMP/omadia-signing.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the user search list, KEEPING the existing ones.
          # Build the list as an array (bash 3.2 on macOS runners — no mapfile) so
          # multiple existing keychains aren't mashed into one path by whitespace
          # stripping. Only quotes + leading/trailing space are trimmed per entry.
          EXISTING=()
          while IFS= read -r kc; do
            kc="${kc//\"/}"
            kc="$(printf '%s' "$kc" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -n "$kc" ] && EXISTING+=("$kc")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"

          # The exact Developer ID Application identity now present in the keychain.
          IDENT=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)

          if [ -z "$IDENT" ]; then
            echo "FAIL: the Developer ID was imported but no codesigning identity" >&2
            echo "      is visible in the keychain — refusing to continue." >&2
            exit 1
          fi

          {
            # Deliberately NOT CSC_LINK. With CSC_LINK set, electron-builder
            # builds its OWN temp keychain and then runs:
            #
            #   security set-key-partition-list -S apple-tool:,apple: -s -k <pw> <keychain>
            #
            # passing the *P12 passphrase* as <pw> while the keychain was created
            # with a different, random password (app-builder-lib macCodeSign.js
            # importCerts). That only works while the keychain happens to still be
            # unlocked from moments earlier — it broke outright on the Intel
            # runner with "SecKeychainUnlock: The user name or passphrase you
            # entered is not correct", and was luck on arm64.
            #
            # macPackager.js: when CSC_LINK is absent it skips that path entirely
            # and uses CSC_KEYCHAIN + CSC_NAME. We already built a keychain above
            # and set its partition list with the CORRECT password, so point
            # electron-builder at it and skip the buggy detour.
            echo "CSC_KEYCHAIN=$KEYCHAIN"
            # WITHOUT the "Developer ID Application: " prefix — electron-builder
            # rejects it outright ("Please remove prefix ... from the specified
            # name"); it adds the certificate type itself. afterPack, which calls
            # codesign directly, still gets the full identity via
            # MAC_SIGN_IDENTITY below.
            echo "CSC_NAME=${IDENT#Developer ID Application: }"
            echo "APPLE_API_KEY=$RUNNER_TEMP/asc-key.p8"
            echo "APPLE_API_KEY_ID=$APPLE_ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_ASC_ISSUER_ID"
            # Must be set EXPLICITLY either way: electron-builder auto-notarizes
            # as soon as APPLE_API_KEY/_ID/_ISSUER are in the environment, so
            # simply leaving the flag off does NOT disable it.
            if [ "${NOTARIZE:-yes}" = yes ]; then
              echo "EB_NOTARIZE=--config.mac.notarize=true"
            else
              echo "EB_NOTARIZE=--config.mac.notarize=false"
            fi
            echo "MAC_SIGN_KEYCHAIN=$KEYCHAIN"
            echo "MAC_SIGN_EXPECTED=1"
            # afterPack signs the nested extraResources binaries with this.
            echo "MAC_SIGN_IDENTITY=$IDENT"
          } >> "$GITHUB_ENV"
          echo "signing identity: $IDENT"

      # --- Windows Authenticode signing (optional) --------------------------
      # --- Windows signing: Azure Trusted Signing (preferred) ----------------
      # The three coordinates are passed on the CLI rather than hard-coded in
      # electron-builder.yml so the config stays generic — a fork without these
      # secrets simply builds unsigned instead of failing on someone else's
      # Azure account. Presence of win.azureSignOptions is what switches
      # electron-builder to the Azure path.
      - name: Prepare Windows signing (Azure Trusted Signing)
        if: ${{ matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != '' }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_CERT_PROFILE; do
            if [ -z "${!v}" ]; then
              echo "FAIL: AZURE_CLIENT_ID is set but $v is empty — Azure signing needs all six." >&2
              exit 1
            fi
          done
          {
            printf 'EB_WIN_SIGN=--config.win.azureSignOptions.endpoint=%s' "$AZURE_SIGN_ENDPOINT"
            printf ' --config.win.azureSignOptions.codeSigningAccountName=%s' "$AZURE_SIGN_ACCOUNT"
            printf ' --config.win.azureSignOptions.certificateProfileName=%s' "$AZURE_SIGN_CERT_PROFILE"
            # electron-builder's WindowsSignAzureManager spreads any extra
            # azureSignOptions keys straight through as `-<Key> <value>` onto
            # `Invoke-TrustedSigning`. Without a timestamp server the signature
            # is valid today but dies the moment the signing certificate
            # expires — the verification gate below rejects an untimestamped
            # signature for exactly that reason.
            printf ' --config.win.azureSignOptions.timestampRfc3161=http://timestamp.acs.microsoft.com'
            printf ' --config.win.azureSignOptions.timestampDigest=SHA256\n'
            echo "WIN_SIGN_EXPECTED=1"
          } >> "$GITHUB_ENV"
          echo "Azure Trusted Signing configured for account $AZURE_SIGN_ACCOUNT"

      # electron-builder signs every unpacked binary in parallel, and each
      # parallel `Invoke-TrustedSigning` call independently checks whether its
      # NuGet dependencies (Microsoft.Trusted.Signing.Client,
      # Microsoft.Windows.SDK.BuildTools) are installed. On the FIRST run those
      # aren't cached yet, so N concurrent installs race for the same package
      # file and lose with "The process cannot access the file because it is
      # being used by another process" — not an auth or config problem, a
      # bootstrap race. Signing one throwaway file here, single-threaded,
      # forces that one-time install to finish before electron-builder's
      # parallel batch starts, so every later call just hits the warm cache.
      - name: Pre-warm Azure Trusted Signing tooling (avoid concurrent-install race)
        if: ${{ matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != '' }}
        shell: pwsh
        run: |
          Install-Module -Name TrustedSigning -RequiredVersion 0.4.1 -Force -Scope CurrentUser -AllowClobber
          $warmupFile = Join-Path $env:RUNNER_TEMP 'trusted-signing-warmup.exe'
          Copy-Item -Path "$env:SystemRoot\System32\notepad.exe" -Destination $warmupFile
          Invoke-TrustedSigning -Endpoint $env:AZURE_SIGN_ENDPOINT -CodeSigningAccountName $env:AZURE_SIGN_ACCOUNT -CertificateProfileName $env:AZURE_SIGN_CERT_PROFILE -Files $warmupFile -FileDigest SHA256
          Remove-Item -Path $warmupFile -Force

      # --- Windows signing: legacy .pfx (pre-2023 certificates only) ---------
      - name: Prepare Windows signing (legacy CSC — pre-2023 certs only)
        if: ${{ matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID == '' && env.WINDOWS_CSC_LINK_BASE64 != '' }}
        run: |
          printf '%s' "$WINDOWS_CSC_LINK_BASE64" | base64 -d > "$RUNNER_TEMP/win-cert.p12"
          {
            echo "CSC_LINK=$RUNNER_TEMP/win-cert.p12"
            echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD"
            echo "WIN_SIGN_EXPECTED=1"
          } >> "$GITHUB_ENV"

      - name: Package installers
        working-directory: desktop
        run: |
          # Belt-and-braces only. Signing hashes EVERY file in the bundle, and
          # this step used to die with "EMFILE: too many open files" — but the fd
          # limit is NOT the real lever: macOS caps concurrent open files at
          # `kern.maxfilesperproc` regardless of `ulimit -n`, and setting the
          # limit to `unlimited` actively LOWERS the effective ceiling. The fix
          # is the file-count reduction in stage-runtime.mjs; this just avoids a
          # needlessly small default. Keep it an explicit number, never
          # "unlimited".
          ulimit -n 65536 2>/dev/null || true
          echo "fd soft=$(ulimit -Sn) kern.maxfilesperproc=$(sysctl -n kern.maxfilesperproc 2>/dev/null || echo n/a)"
          echo "files in staged runtime: $(find runtime -type f | wc -l)"
          # Debugging note: electron-builder retries a failing `codesign` four
          # times and then reports only the LAST error, which masks the real
          # cause. Re-run this step with `DEBUG=electron-builder` to see the
          # actual command and its stderr.
          npx electron-builder ${{ matrix.args }} ${EB_NOTARIZE:-} ${EB_WIN_SIGN:-} --publish never

      # ALWAYS runs on macOS — signed or not. Without it, a build whose signature
      # macOS considers corrupt sails through CI green and ships an app that
      # cannot be opened at all ("omadia is damaged and can't be opened"), which
      # is exactly what happened to v0.56.0 and v0.57.0. The stricter Developer ID
      # assertions (not-adhoc, notarized, stapled) stay in the gate below; this one
      # only asserts the bundle is STRUCTURALLY valid, which must hold either way.
      - name: Verify the macOS bundle is structurally signed (always)
        if: ${{ startsWith(matrix.os, 'macos') }}
        working-directory: desktop
        run: |
          set -e
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "FAIL: no .app produced under release/mac*/ — nothing to verify" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            if [ ! -e "$app/Contents/_CodeSignature/CodeResources" ]; then
              echo "FAIL: $app has no _CodeSignature/CodeResources — the bundle was never sealed." >&2
              echo "      macOS reads this as corrupt and refuses to launch it." >&2
              exit 1
            fi
            # `--deep` is required HERE: a plain `--verify --strict` passes even
            # when a nested bundle (e.g. Electron Framework.framework) was never
            # sealed, which is precisely the state that makes the app unopenable.
            # Catches both that and a tree codesign cannot walk (e.g. dangling
            # node_modules/.bin symlinks → "No such file or directory").
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          echo "✓ macOS bundle carries a structurally valid signature (nested code included)"

      # Same lesson as macOS: without a gate, CI goes green while shipping an
      # unsigned installer. Runs whenever signing was CONFIGURED, so "secrets are
      # present but the installer came out unsigned" fails the build instead of
      # reaching users as a SmartScreen warning.
      # Uses Get-AuthenticodeSignature rather than signtool.exe — it is built into
      # PowerShell, so there is no Windows SDK path to hunt for.
      - name: Verify the Windows installer is signed
        if: ${{ matrix.os == 'windows-latest' && env.WIN_SIGN_EXPECTED == '1' }}
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path release -Filter *.exe -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            Write-Error "FAIL: no .exe produced under release/ — nothing to verify"
          }
          foreach ($exe in $installers) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "$($exe.Name): status=$($sig.Status) signer=$($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "FAIL: $($exe.Name) is not validly signed (status=$($sig.Status)). Signing was configured, so this must not ship."
            }
            if (-not $sig.TimeStamperCertificate) {
              # Without a countersignature the signature dies with the cert.
              Write-Error "FAIL: $($exe.Name) has no trusted timestamp."
            }
          }
          Write-Host "✓ Windows installer(s) carry a valid, timestamped Authenticode signature"

      # The .app is notarized + stapled by electron-builder above; the DMG needs
      # its own ticket so `stapler validate` passes on the disk image itself.
      - name: Notarize + staple the DMGs
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_P12_BASE64 != '' && env.NOTARIZE == 'yes' }}
        working-directory: desktop
        run: |
          for dmg in release/*.dmg; do
            xcrun notarytool submit "$dmg" \
              --key "$RUNNER_TEMP/asc-key.p8" \
              --key-id "$APPLE_ASC_KEY_ID" \
              --issuer "$APPLE_ASC_ISSUER_ID" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Verify macOS signatures (acceptance gate)
        if: ${{ startsWith(matrix.os, 'macos') && env.APPLE_P12_BASE64 != '' && env.NOTARIZE == 'yes' }}
        working-directory: desktop
        run: |
          set -e
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "FAIL: no .app produced under release/mac*/ — nothing to verify" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            # `--deep` is deprecated for verification and does NOT descend into
            # extraResources — verify the app, then EACH nested native binary
            # explicitly, then the real Gatekeeper verdict.
            codesign --verify --strict --verbose=4 "$app"
            if codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'; then
              echo "FAIL: $app is ad-hoc signed — the Developer ID did not apply" >&2
              exit 1
            fi
            # Every staged Mach-O (middleware native modules AND the bundled
            # Postgres binaries/dylibs, which are extensionless) must be signed
            # with the Developer ID (not ad-hoc) — afterPack.js does this. Detect
            # Mach-O via `file` so extensionless executables are covered.
            while IFS= read -r bin; do
              file "$bin" | grep -q 'Mach-O' || continue
              codesign --verify --strict "$bin" || { echo "FAIL: unsigned nested binary $bin" >&2; exit 1; }
              if codesign -dv "$bin" 2>&1 | grep -q 'Signature=adhoc'; then
                echo "FAIL: nested binary is ad-hoc signed, not Developer ID: $bin" >&2; exit 1
              fi
            done < <(find "$app/Contents/Resources/omadia" "$app/Contents/Resources/omadia-pg" -type f)
            xcrun stapler validate "$app"
            spctl --assess --type execute -vvv "$app"
          done
          for dmg in release/*.dmg; do
            xcrun stapler validate "$dmg"
          done

      - name: Tear down signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/win-cert.p12" || true
          # Also drop our temp signing keychain (and let macOS fall back to the
          # default search list) so nothing signing-related lingers.
          if [ -n "${MAC_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$MAC_SIGN_KEYCHAIN" 2>/dev/null || true
          fi

      # Downloadable from the run itself (independent of the Release upload), and
      # placed AFTER notarize/staple/verify so the artifacts are the final,
      # stapled installers — not a pre-notarization copy.
      - name: Upload installers as run artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: omadia-installers-${{ matrix.os }}
          # Artifact names are unique per run, not per attempt. Without this, the
          # documented stuck-draft recovery ("re-run the failed jobs") 409s here,
          # skips the release upload below, and wedges the draft a second time.
          overwrite: true
          if-no-files-found: ignore
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml

      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          # macOS is built once per architecture, and each run emits a
          # `latest-mac.yml` listing only ITS OWN artifacts. Uploading both would
          # leave whichever job finished last as the only updatable architecture.
          # The `mac-update-feed` job below merges them and uploads the result.
          if [ "$RUNNER_OS" = "macOS" ]; then
            keep=()
            for f in "${files[@]}"; do
              [[ "$(basename "$f")" == "latest-mac.yml" ]] || keep+=("$f")
            done
            files=("${keep[@]}")
            echo "holding back latest-mac.yml — merged across architectures by the mac-update-feed job"
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer artifacts found in desktop/release/" >&2
            exit 1
          fi
          # If TAG has no matching release (e.g. a build-validation dispatch on a
          # branch name), this is a build-only run — skip upload, don't fail.
          # Resolve the release by tag through the LIST endpoint, which includes
          # drafts for a token with push access (`GET /releases/tags/{tag}` does
          # not, and since #928 the release is a draft until promoted).
          #
          # `--paginate` is not optional: this repo has 237 releases and a single
          # per_page=100 page reaches back only to v0.78.0, so a rebuild
          # dispatched for an older tag would find nothing and — on the dispatch
          # path, where require_release is false — silently skip the upload and
          # report a green run that attached nothing. `--jq` is applied per page,
          # so a hit emits one line and misses emit nothing.
          #
          # gh's own --jq (gojq) rather than piping to jq: gh is guaranteed on
          # every runner this matrix uses, jq is not part of that contract, and
          # this step also runs on windows-latest.
          #
          # `gh release upload "$TAG"` below does work against a draft: gh's
          # FetchRelease looks up a published release by tag and falls back to
          # finding a draft by its pending tag name. That fallback is the single
          # assumption the whole draft flow depends on, so it is stated here
          # rather than left implicit.
          if ! release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq 'map(select(.tag_name == env.TAG)) | .[0].id // empty'); then
            echo "could not query releases for '$TAG'" >&2
            exit 1
          fi
          if [ -z "$release_id" ]; then
            if [ "${REQUIRE_RELEASE:-false}" = "true" ]; then
              echo "::error::no GitHub Release (draft or published) for '$TAG', but this run was" >&2
              echo "         invoked with require_release — refusing to report success while" >&2
              echo "         attaching no installers." >&2
              exit 1
            fi
            echo "no GitHub Release for '$TAG' — build validated, skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Publishes the ONE `latest-mac.yml` that covers both architectures.
  #
  # electron-updater's MacUpdater picks its download by testing the file URL for
  # "arm64", so a feed listing a single architecture leaves the other with no
  # matching file (Intel) or silently pushes everyone onto Rosetta (arm64). The
  # two mac jobs cannot produce this file between them — each only knows its own
  # artifacts — so it is assembled here from both run artifacts.
  mac-update-feed:
    needs: build
    # Runs even when another matrix leg failed (fail-fast is off), so a broken
    # Windows build does not also cost macOS its update feed. If a mac artifact
    # is genuinely missing the step below fails loudly rather than publishing a
    # feed that covers only half the users.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # Consumed by auto-release.yml to decide whether the draft release may be
      # published + flagged latest (#928).
      published: ${{ steps.upload-feed.outputs.published }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      REQUIRE_RELEASE: ${{ inputs.require_release && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: omadia-installers-macos-*

      - name: Merge the per-architecture update feeds
        run: |
          set -e
          ARM="artifacts/omadia-installers-macos-latest/latest-mac.yml"
          INTEL="artifacts/omadia-installers-macos-26-intel/latest-mac.yml"
          for f in "$ARM" "$INTEL"; do
            if [ ! -f "$f" ]; then
              echo "FAIL: missing $f — one macOS architecture did not produce an" >&2
              echo "      update feed. Refusing to publish a single-architecture" >&2
              echo "      latest-mac.yml, which would break auto-update for the other." >&2
              exit 1
            fi
          done
          # arm64 goes first: it supplies the legacy top-level path/sha512 that
          # pre-arch-aware updaters follow, and it is the majority of Macs.
          node desktop/scripts/merge-mac-update-feed.mjs "$ARM" "$INTEL" latest-mac.yml
          echo "--- merged latest-mac.yml ---"
          cat latest-mac.yml

      - name: Upload the merged feed to the release
        id: upload-feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Draft-aware, paginated lookup — see the matching note in the
          # installer upload step above for both reasons.
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq 'map(select(.tag_name == env.TAG)) | .[0].id // empty')
          if [ -z "$release_id" ]; then
            if [ "${REQUIRE_RELEASE:-false}" = "true" ]; then
              echo "::error::no GitHub Release (draft or published) for '$TAG', but this run was" >&2
              echo "         invoked with require_release — refusing to report a published feed." >&2
              exit 1
            fi
            echo "no GitHub Release for '$TAG' — merge validated, skipping upload."
            exit 0
          fi
          # A valid merged feed does NOT prove the installers it points at are on
          # the release. The feed is assembled from RUN artifacts (uploaded by an
          # `if: always()` step that runs BEFORE the release upload), so a mac
          # leg whose "Upload installers to the release" step failed transiently
          # still yields a complete, mergeable feed. Publishing on that alone
          # would flag a release latest whose latest-mac.yml references assets
          # that were never attached — OM-69's exact user-visible symptom, under
          # a green run. So assert attachment before claiming the feed is usable.
          # `state` is `starter` until the upload body finishes; such a record is
          # listed but 404s on download. Counting it would let the gate go green
          # on exactly the transient-upload failure it was added to catch.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | select(.state == "uploaded") | .name' > /tmp/release-assets.txt
          node --input-type=module -e '
            import fs from "node:fs";
            const { parseFeed } = await import("./desktop/scripts/merge-mac-update-feed.mjs");
            const feed = parseFeed(fs.readFileSync("latest-mac.yml", "utf8"), "latest-mac.yml");
            // electron-builder percent-encodes these; release asset names are raw.
            const refs = new Set();
            if (feed.scalars.path) refs.add(decodeURIComponent(feed.scalars.path));
            for (const f of feed.files) if (f.url) refs.add(decodeURIComponent(f.url));
            const attached = new Set(
              fs.readFileSync("/tmp/release-assets.txt", "utf8").split("\n").filter(Boolean),
            );
            const missing = [...refs].filter((r) => !attached.has(r));
            if (missing.length > 0) {
              console.error("::error::latest-mac.yml references files that are NOT attached to");
              console.error("         the release, so macOS clients could not download this");
              console.error("         version: " + missing.join(", "));
              process.exit(1);
            }
            console.log("all " + refs.size + " file(s) referenced by latest-mac.yml are attached");
          '
          gh release upload "$TAG" latest-mac.yml --clobber
          # Now it is true that a macOS client can resolve AND download an update
          # for this tag. auto-release.yml gates the `--latest` promotion on this.
          echo "published=true" >> "$GITHUB_OUTPUT"
