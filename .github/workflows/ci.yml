# PR + main-branch quality gate.
#
# Runs lint + typecheck + test on both workspaces, plus a schema smoke
# that applies every migration in the repo against a real pgvector
# container. Audit enforces a high-severity ceiling so a CVE-bumping
# dep can't slip in unnoticed.
#
# Naming-independent — no secrets, no GHCR/npm push. Release-flow lives
# in release.yml (currently placeholder; activates once OB-30 Block 2
# locks the npm-scope + repo name).

name: CI

on:
  # Pull-request trigger accepts any base branch so that cluster-fix
  # PRs stacked on the test-suite resurrection branch (#35 / #37)
  # still run CI. Once #35 merges and the cluster work is done, this
  # can return to `branches: [main]`.
  pull_request:
    branches: ['**']
  push:
    branches: [main]

# Cancel in-flight runs on the same ref when a newer push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Core-decoupling check (epic #470). The Dev Platform lives in its own
  # repository; this fails if core re-acquires ANY reference to it.
  #
  # This was a ratchet — a committed count allowed to fall and never rise —
  # for as long as the extraction was in flight. C13 finished the job and the
  # floor is now hard zero: the script asserts 0 outright instead of reading
  # a baseline, because a baseline is a number and numbers get edited. The
  # job name is kept for continuity as a required check.
  # ------------------------------------------------------------------
  decoupling:
    name: core decoupling ratchet (#470)
    runs-on: ubuntu-latest
    # Was 5. `Ensure ripgrep` alone took 3:28 on a good run and 5:07 on a bad
    # one, so this job routinely had ~90 seconds of headroom and intermittently
    # blew the budget. A timed-out job reports as `cancelled`, and its remaining
    # steps are `skipped` — so the ratchet was a REQUIRED check that silently
    # did not run, which is the same failure family as a permanently-green
    # guard-skip: not red, not passing, just absent.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure ripgrep
        # `apt-get update` is the expensive half — it refetches every package
        # index to install one small binary. Try the cached indices first and
        # only refresh when that actually fails. `rg` is genuinely needed:
        # `check-core-decoupling.mjs` shells out to it (`execFileSync('rg', …)`).
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get install -y ripgrep \
              || (sudo apt-get update && sudo apt-get install -y ripgrep)
          fi

      - name: Assert core has ZERO Dev Platform references
        # C13 pinned the count at 0 permanently. The script asserts that
        # outright (`EXTRACTION_COMPLETE`) rather than comparing against
        # `decoupling-baseline.json`, so a single reintroduced reference —
        # code path, config key, i18n key, fixture string or comment — fails
        # this job, and there is no number anyone can edit to make it pass.
        #
        # Belt and braces on top of the script's own exit code: assert the
        # report literally says zero. If a future refactor ever made the
        # script exit 0 while still counting hits (a `--report`-style path
        # slipping into the default mode, an early `process.exit(0)`), this
        # step still fails. A guard that can only fail loudly is the point.
        run: |
          node scripts/check-core-decoupling.mjs
          node scripts/check-core-decoupling.mjs --report | tee /tmp/decoupling.txt
          grep -qE '^  TOTAL 0( |$)' /tmp/decoupling.txt

      - name: Test the detector itself
        # The guard above only earns its required-check status if the detector
        # it runs actually detects. `check-core-decoupling.test.mjs` plants a
        # probe file under `middleware/src/` and asserts the checker goes red —
        # it is the mutation test, committed.
        #
        # It is wired HERE deliberately. `scripts/` has no package.json and no
        # other job globs `*.test.mjs`, so a test file sitting there would
        # never execute: green because nothing ran it, which this job's own
        # timeout comment above already names as the same failure family as a
        # permanently-green guard-skip. A test nobody runs is not a test.
        run: node --test scripts/check-core-decoupling.test.mjs

  # ------------------------------------------------------------------
  # Middleware: lint + typecheck + node:test against tsx
  # ------------------------------------------------------------------
  middleware:
    name: middleware (lint + typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: middleware
    # Postgres for the *.pg.test.ts suites. Without this the whole
    # Postgres-backed layer (migration backfills, embedding-gate suites,
    # job/webhook/memory stores, ~25 files) self-skips on an unreachable
    # DB and the job still reports green — the silent-coverage hole from
    # issue #565. pgvector image because several suites create a vector(n)
    # column as the thing under test.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omadia
          POSTGRES_USER: omadia
          POSTGRES_PASSWORD: omadia-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omadia -d omadia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: middleware/package-lock.json

      - name: npm ci (middleware + workspaces)
        run: npm ci --include=optional --no-audit --no-fund

      # sharp's native binary is platform-specific. package-lock.json was
      # generated on macOS (darwin-arm64) and has no `node_modules/@img/
      # sharp-linux-x64` entry, so `npm ci` even with --include=optional
      # skips it. Force-install the linux-x64 variant for the CI runner.
      - name: Install sharp linux-x64 native binary
        run: npm install --no-save --no-audit --no-fund --os=linux --cpu=x64 sharp

      - name: Build workspace packages (compiled dist/ for cross-package imports)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The root tsconfig only includes src/, so `typecheck` above never sees
      # test/ or scripts/. This ratchet typechecks those trees against a
      # committed baseline: it blocks NEW type errors while the pre-existing
      # debt burns down (issue #573, same pattern as the decoupling ratchet).
      - name: Typecheck (test + scripts trees, ratchet)
        run: npm run typecheck:test

      # #760 — prompt-PII detection-quality gate. Deterministic (pure regex
      # over committed fixtures, C0 set only — no sidecar): every locale must
      # stay at or above its committed floor in validation/ci-baseline.json.
      # The check FAILS on an empty evaluation, so a broken fixture load can
      # never report green (the #640 permanently-green-no-op failure mode).
      - name: Prompt-PII C0 eval gate (per-locale floors)
        run: npx tsx packages/harness-plugin-privacy-guard/src/validation/promptDetectorEval.ts --check

      # Non-Postgres suites, run in parallel as before. No pg DSN is set for
      # this step, so the *.pg.test.ts files probe the unreachable default
      # and self-skip — same as today. They get real coverage in the
      # dedicated serial step below.
      #
      # `test` pins --test-concurrency=4 (issue #605). Node's default is
      # derived from the core count, so a 16-core dev machine ran far more
      # files at once than CI ever does — and the suite spins up many
      # short-lived Express servers on localhost. Three consecutive full runs
      # each failed a DIFFERENT test (runtimeSecretsRoute,
      # conductorTemplateRoutes, inboundWebhookRoutes), two with a
      # connection-level `fetch failed`; every one passed in isolation. That
      # is contention, not logic. Pinning makes the number the same
      # everywhere, so a red run means a real failure instead of training
      # everyone to re-run — the habit that let #549 break main.
      - name: Test (node --test via tsx)
        run: npm run test

      # `--test-timeout` is applied to the FILE, not to each leaf (#566): a
      # file whose leaves are all fast but whose total crosses the ceiling is
      # killed as a unit, and the failure is reported against whichever leaf
      # happened to be running. #550 sized the ceiling on the slowest file of
      # the day and nothing has watched the margin since — the spec and tap
      # reporters flatten a glob to suite names, so the per-file total was not
      # observable at all. The step above now also writes it; this turns it
      # into a gate. Deliberately a fraction of the ceiling rather than a
      # committed ms baseline: the same suite measures ~36s locally on 16
      # cores and ~172s here, so an absolute number would be either
      # permanently red or permanently asleep.
      - name: Test file durations (per-file timeout headroom, #566)
        run: npm run test:filetimes

      # Updater sidecar (#432). It is a STANDALONE zero-dependency `.mjs`
      # service, so it is outside the `test/**/*.test.ts` glob above and would
      # otherwise be tested nowhere. No install step — it has no dependencies.
      - name: Test — updater sidecar (node --test)
        run: npm run test:updater

      # Anti-silent-skip guard (#565). The pg suites self-skip when the DB
      # is unreachable, so a broken/renamed service would once again pass
      # green with zero Postgres coverage. Fail loudly here instead if the
      # exact DSN the suites use can't be reached, and enable pgvector once
      # up-front so every suite has it.
      - name: Verify Postgres is reachable (fail loud, don't skip green)
        run: |
          PGPASSWORD=omadia-ci psql -h localhost -U omadia -d omadia \
            -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "SELECT 1;"

      # Postgres-backed suites (#565). Test-scoped DSNs only, set on this
      # step alone. Since #626 every *.pg.test.ts resolves its DSN through
      # test/_helpers/pgTestDb.ts (probePgTest), first-non-empty-wins over a
      # suite-specific chain. The chains differ (some carry WS5_PG_TEST_URL,
      # memoryStoreConformance reads MEMORY_PG_TEST_URL alone) but every one
      # of them contains GRAPH_PG_TEST_URL and/or MEMORY_PG_TEST_URL ahead of
      # any other name, and each suite runs its own migrations against a fresh
      # pool — so these two vars activate all 25 suites. If you add a suite
      # whose chain starts with neither, it will silently skip: the count
      # ratchet below is what catches that. Deliberately NOT DATABASE_URL: two live-Neon
      # tests (palaiaHybridRetrievalNeon, neonDatasetFilterEscaping) gate
      # solely on DATABASE_URL and need external fixtures / pre-applied
      # migrations — pointing it at this blank throwaway DB would activate
      # them and red-line on missing data. They stay correctly skipped
      # (out of #565).
      #
      # test:pg pins --test-concurrency=1: these suites share one database
      # and were written to each own a private DB (locally each defaults to
      # its own port), so running the files in parallel lets one suite's job
      # poller claim another's rows. Serial file execution isolates them;
      # the whole set runs in ~20s.
      #
      # The test-count ratchet below is the real anti-#565 guard. node --test
      # exits 0 when a suite self-skips, and — critically — a describe-level
      # skip does NOT increment "skipped": its tests simply never register
      # and vanish from the total. So "skipped == 0" is blind to exactly the
      # silent-skip this issue is about; only a floor on the test COUNT
      # catches it. The *.pg.test.ts files register 269 tests today (+6 from
      # channelIdentityAuthSubject.pg.test.ts, issue #568; +8 from
      # updateAuditStore.pg.test.ts, issue #432). If
      # the count drops (broken DSN, a future suite reading an env var we
      # don't set here, a cold-connection flake), a suite silently vanished —
      # go red. Raise PG_TEST_FLOOR when you add Postgres tests, same
      # baseline-ratchet convention as the core-decoupling job above.
      #
      # NOTE — this floor is the INVERSE of the core-decoupling ratchet, and
      # the reflex from that one is wrong here. It is a MINIMUM on desirable
      # coverage, so raising it as suites land is the intended move; there the
      # counted thing is debt and the rule is reword-don't-raise. It had
      # drifted to 240 against an actual 269, i.e. 29 tests of slack in which
      # a whole suite could self-skip unnoticed — precisely the #565 failure
      # this guard exists to catch. Re-pinned to the measured count (the
      # step below prints `ran=` on every run; read it there, don't guess).
      - name: Test — Postgres suites (serial, real pgvector)
        env:
          GRAPH_PG_TEST_URL: postgres://omadia:omadia-ci@localhost:5432/omadia
          MEMORY_PG_TEST_URL: postgres://omadia:omadia-ci@localhost:5432/omadia
          # 269 → 252 with epic #470 C10: the Postgres suites of the extracted
          # subsystem left core together with the code they covered (their
          # successors run in the plugin repository). Measured on the C10
          # head, not estimated. 252 → 279 with C11 (27 ledger-handoff pg tests).
          PG_TEST_FLOOR: '279'
        run: |
          set -eo pipefail
          npm run test:pg 2>&1 | tee pg-test.out
          # node's spec reporter wraps the summary as "\e[34mℹ tests 238\e[39m"
          # whenever it decides to colorize, which turns the ^-anchored greps
          # below into zero matches (ran=0 => a spurious red). Actions is
          # currently uncoloured, but that is the runner's choice, not ours,
          # and it is what a developer re-running this locally hits. Strip SGR
          # sequences first; printf '\033' keeps this working on BSD sed too.
          esc=$(printf '\033')
          sed "s/${esc}\[[0-9;]*m//g" pg-test.out > pg-test.plain
          ran=$(grep -m1 -oE '^ℹ tests [0-9]+' pg-test.plain | grep -oE '[0-9]+' || echo 0)
          skipped=$(grep -m1 -oE '^ℹ skipped [0-9]+' pg-test.plain | grep -oE '[0-9]+' || echo 0)
          echo "Postgres suites: ran=${ran} skipped=${skipped} (floor=${PG_TEST_FLOOR})"
          if [ "${ran:-0}" -lt "${PG_TEST_FLOOR}" ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::Postgres coverage regressed (#565): expected >=${PG_TEST_FLOOR} tests and 0 skipped, got ran=${ran} skipped=${skipped}. A suite silently self-skipped — check the DSN and *.pg.test.ts env-var resolution."
            exit 1
          fi

      # Smoke scripts (middleware/scripts/smoke-*.ts) live outside this
      # public repo by design — they hit byte5-internal endpoints. The
      # privacy-shield v2 smoke that previously ran here has the same
      # coverage as the in-suite privacyOutputValidator tests.

  # ------------------------------------------------------------------
  # Web-dev: Next.js admin UI — vitest + lint + typecheck
  # ------------------------------------------------------------------
  web-ui:
    name: web-ui (lint + typecheck + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: npm ci
        run: npm ci --include=optional --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      - name: Plugin UI stylesheet drift check
        # Epic #470 C8 — middleware/assets/plugin-ui/plugin-ui.css is generated
        # from this workspace's theme tokens + tailwind bridge and committed so
        # the runtime image needs no web-ui toolchain. Regenerate and diff here
        # so an edit to the tokens, the bridge or the vocabulary that was not
        # regenerated fails loudly instead of shipping a stylesheet that
        # disagrees with the shell. Runs inside the existing web-ui job, not as
        # a new required check.
        run: npm run plugin-ui:css:check

  # ------------------------------------------------------------------
  # Schema smoke: apply every migration in the repo against pgvector.
  # Catches SQL-only regressions before they hit prod-or-OSS-demo
  # deploys. Domains are listed explicitly in dependency order; files
  # inside a domain are applied in lexical (numbered) order, so newly
  # added migrations are picked up automatically.
  # ------------------------------------------------------------------
  schema:
    name: schema (migrations on pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omadia
          POSTGRES_USER: omadia
          POSTGRES_PASSWORD: omadia-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omadia -d omadia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Schema domains in apply order. Within each domain, files apply
      # in lexical (file-name) order — which matches the numbered
      # migration convention. Newline-separated so the shell loop can
      # iterate cleanly.
      #
      # `middleware/migrations` is the core runtime domain — the shared
      # schema for the main app's features. It is self-contained: no
      # cross-domain FKs and no extension dependencies, so its position
      # in this list is not load-bearing.
      #
      # Still uncovered (each needs its own audit before enabling):
      # middleware/src/conductor/migrations,
      # middleware/src/services/graph/migrations,
      # middleware/packages/harness-memory-postgres/src/migrations.
      MIGRATION_DOMAINS: |
        middleware/migrations
        middleware/packages/harness-knowledge-graph-neon/src/migrations
        middleware/src/auth/migrations
        middleware/src/plugins/routines/migrations
        middleware/src/profileSnapshots/migrations
        middleware/src/profileStorage/migrations
    steps:
      - uses: actions/checkout@v7

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=omadia-ci psql -h localhost -U omadia -d omadia \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Apply all migrations
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "==> domain: $dir"
            for f in "$dir"/*.sql; do
              echo "  applying $(basename "$f")"
              PGPASSWORD=omadia-ci psql -h localhost -U omadia -d omadia \
                -v ON_ERROR_STOP=1 -f "$f"
            done
          done <<< "$MIGRATION_DOMAINS"

      - name: Re-apply migrations (idempotency check)
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            for f in "$dir"/*.sql; do
              PGPASSWORD=omadia-ci psql -h localhost -U omadia -d omadia \
                -v ON_ERROR_STOP=1 -f "$f" > /dev/null
              echo "✓ idempotent: $(basename "$f")"
            done
          done <<< "$MIGRATION_DOMAINS"

  # ------------------------------------------------------------------
  # Dependency audit. Enforces a "no high or critical" floor — moderate
  # findings remain warnings (some of ours are dev-tools that need a
  # Next.js major to clear). Acts as the canary for new CVE bumps in
  # transitive deps.
  # ------------------------------------------------------------------
  audit:
    name: audit (high+critical block)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workspace: [middleware, web-ui]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: npm ci
        run: npm ci --include=optional --no-audit --no-fund

      - name: npm audit (--audit-level=high)
        # npm's registry audit backend is currently broken for every npm CLI
        # version we could test (2026-07-26): npm 10.x's legacy "quick audit"
        # endpoint 400s with "Invalid package tree" (reproduces even against a
        # pristine, untouched lockfile), and npm 11.x/12.x's newer bulk-advisory
        # endpoint fails to gzip-decode its own response. Both are upstream
        # infra failures, not real audit results -- npm's error handler always
        # prints "audit endpoint returned an error" for these, distinct from a
        # genuine "vulnerabilities found" failure. Treat only the latter as
        # blocking so this gate doesn't wedge every PR on an upstream outage.
        run: |
          npm install -g npm@latest
          set +e
          npm audit --audit-level=high --json >audit-report.json 2>audit-stderr.log
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            exit 0
          fi
          if grep -q 'audit endpoint returned an error' audit-stderr.log; then
            echo "::warning::npm audit endpoint is erroring upstream (registry-side) -- treating as non-blocking, not a real result"
            cat audit-stderr.log
            exit 0
          fi
          cat audit-stderr.log
          cat audit-report.json
          exit $exit_code
